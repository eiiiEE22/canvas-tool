    // ========== 键盘 ==========
    const ARROW_KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

    document.addEventListener('keydown', function(e) {
        const tag = document.activeElement && document.activeElement.tagName;
        const isInputFocused = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');

        if (e.code === 'Space' && !isInputFocused && !transformMode) {
            if (!spacePressed) {
                spacePressed = true;
                canvasWrapper.classList.add('space-pan');
                showShortcutHint('按住 <kbd>空格</kbd> 拖拽可平移视图');
            }
            e.preventDefault();
            return;
        }

        if (isInputFocused) return;

        if (e.key === '?' || (e.shiftKey && e.key === '/')) {
            e.preventDefault();
            openShortcutsPanel();
            return;
        }

        if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
            e.preventDefault(); redo(); return;
        }

        if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
            e.preventDefault();
            copySelectedLayers();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
            e.preventDefault();
            if (!pasteLayers()) pasteFromClipboard();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
            e.preventDefault();
            duplicateSelected();
            return;
        }

        if ((e.ctrlKey || e.metaKey) && (e.key === ']' || e.key === '}')) {
            e.preventDefault(); nudgeLayerOrder(1); return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === '[' || e.key === '{')) {
            e.preventDefault(); nudgeLayerOrder(-1); return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key === '0') {
            e.preventDefault(); fitCanvasInView(); return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === '1') {
            e.preventDefault(); setViewScaleTo1(); return;
        }

        if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
            e.preventDefault();
            selectedIndices.clear();
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].visible && layers[i].img) selectedIndices.add(i);
            }
            if (selectedIndices.size > 0) activeLayerIndex = Array.from(selectedIndices)[selectedIndices.size - 1];
            renderAll(); renderOverlay(); renderLayerPanel();
            showShortcutHint('已全选图层 · <kbd>Shift</kbd> 点击可取消选择');
            return;
        }

        if (ARROW_KEYS[e.key] && !transformMode) {
            const sel = getSelectedLayerIndices();
            if (sel.length === 0) return;
            e.preventDefault();
            const step = e.shiftKey ? 10 : 1;
            const [dx, dy] = ARROW_KEYS[e.key];
            let moved = false;
            for (const i of sel) {
                if (layers[i].locked) continue;
                layers[i].x += dx * step;
                layers[i].y += dy * step;
                moved = true;
            }
            if (!moved) { showToast('选中图层均已锁定'); return; }
            renderAll(); renderOverlay();
            if (nudgeSaveTimer) clearTimeout(nudgeSaveTimer);
            nudgeSaveTimer = setTimeout(() => saveState(), 400);
            return;
        }

        if (e.key === '[' || e.key === ']') {
            e.preventDefault();
            const sel = Array.from(selectedIndices).filter(i => i >= 0 && i < layers.length);
            if (sel.length === 0) return;
            const first = layers[sel[0]];
            const cur = first.opacity !== undefined ? first.opacity : 1;
            const delta = e.key === '[' ? -0.05 : 0.05;
            const next = Math.min(Math.max(cur + delta, 0), 1);
            updateSelectedOpacity(next, true);
            showShortcutHint(`不透明度 ${Math.round(next * 100)}%`);
            return;
        }

        if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            const indices = Array.from(selectedIndices);
            if (indices.length === 0) return;
            for (const i of indices) {
                if (i >= 0 && i < layers.length && layers[i].locked) {
                    showToast('选中图层中有锁定图层，无法删除');
                    return;
                }
            }
            indices.sort((a, b) => b - a);
            for (const i of indices) removeLayer(i, true);
            renderAll(); renderOverlay(); renderLayerPanel(); saveState(true);
            return;
        }

        if (e.key === 'Enter' && transformMode) {
            e.preventDefault(); exitTransformMode(true); return;
        }
        if (e.key === 'Escape') {
            if (layerMarqueeActive) {
                layerMarqueeActive = false;
                layerMarqueeStart = null;
                layerMarqueeCurrent = null;
                layerMarqueeMoved = false;
                layerMarqueeAdditive = false;
                layerMarqueeStartTarget = null;
                if (layerMarqueeEl) layerMarqueeEl.classList.remove('active');
                layerList.classList.remove('marquee-active');
                suppressItemDrag = false;
                const items = layerList.querySelectorAll('.layer-item');
                for (let i = 0; i < items.length; i++) items[i].draggable = true;
                e.preventDefault();
                return;
            }
            if (isMarqueeSelecting) { e.preventDefault(); cancelMarqueeSelect(); return; }
            if (shortcutsModal.classList.contains('active')) { shortcutsModal.classList.remove('active'); return; }
            if (huePanel.classList.contains('active')) { hueCancelBtn.click(); return; }
            if (alignPanel.classList.contains('active')) { alignPanel.classList.remove('active'); return; }
            if (transformMode) { e.preventDefault(); exitTransformMode(false); return; }
            hideContextMenu();
        }
    });

    document.addEventListener('keyup', function(e) {
        if (e.code === 'Space') {
            if (spacePressed) {
                spacePressed = false;
                canvasWrapper.classList.remove('space-pan');
                stopPanning();
                hideShortcutHint();
            }
        }
    });

    // ========== 拖拽导入 ==========
    const IMG_EXT_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;
    let dragDepth = 0;

    function isFileDrag(e) {
        const dt = e.dataTransfer;
        if (!dt || !dt.types) return false;
        try {
            const types = dt.types;
            const len = types.length || 0;
            for (let i = 0; i < len; i++) {
                const t = (types[i] !== undefined) ? types[i] : (types.item ? types.item(i) : null);
                if (t === 'Files') return true;
            }
        } catch (err) { return false; }
        return false;
    }

    function isImageFile(f) {
        if (!f) return false;
        const t = f.type || '';
        if (t.indexOf('image/') === 0) return true;
        if (IMG_EXT_RE.test(f.name || '')) return true;
        return false;
    }

    function showDropOverlay() { dropOverlay.classList.add('active'); }
    function hideDropOverlay() { dragDepth = 0; dropOverlay.classList.remove('active'); }

    function readAllEntries(reader) {
        return new Promise((resolve, reject) => {
            const all = [];
            const next = () => {
                reader.readEntries((entries) => {
                    if (!entries.length) { resolve(all); return; }
                    all.push(...entries);
                    next();
                }, reject);
            };
            next();
        });
    }

    async function collectEntryFiles(entry, out) {
        if (!entry) return;
        if (entry.isFile) {
            try {
                const f = await new Promise((res, rej) => entry.file(res, rej));
                out.push(f);
            } catch (err) {}
        } else if (entry.isDirectory) {
            try {
                const children = await readAllEntries(entry.createReader());
                for (const child of children) await collectEntryFiles(child, out);
            } catch (err) {}
        }
    }

    async function importImageFiles(files) {
        const total = files.length;
        let added = 0;
        for (let i = 0; i < total; i++) {
            try {
                const img = await readImageFromFile(files[i]);
                addImageAsLayer(img, nameFromFile(files[i]), {
                    silent: true, skipHistory: true, fill: true
                });
                added++;
            } catch (err) {
                console.warn('跳过无法解析的图片：', files[i] && files[i].name, err);
            }
        }
        if (added > 0) {
            renderAll(); renderOverlay(); renderLayerPanel();
            saveState(true);
            showToast(`已导入 ${added} 张图片，每张铺满画布，可在图层面板切换`);
        } else {
            showToast('未找到可用的图片文件');
        }
    }

    async function handleDrop(rawFiles, entries) {
        let entryFiles = [];
        if (entries && entries.length) {
            for (const en of entries) await collectEntryFiles(en, entryFiles);
        }
        const merged = [];
        const seen = new Set();
        const pushUnique = (f) => {
            if (!f) return;
            const key = (f.name || '') + '|' + (f.size || 0) + '|' + (f.lastModified || 0);
            if (seen.has(key)) return;
            seen.add(key);
            merged.push(f);
        };
        entryFiles.forEach(pushUnique);
        (rawFiles || []).forEach(pushUnique);

        const imgs = merged.filter(isImageFile);
        if (!imgs.length) { showToast('未检测到图片文件'); return; }
        imgs.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true, sensitivity: 'base' }));
        await importImageFiles(imgs);
    }

    window.addEventListener('dragenter', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        dragDepth++;
        showDropOverlay();
    });

    window.addEventListener('dragover', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (!dropOverlay.classList.contains('active')) {
            dragDepth = Math.max(dragDepth, 1);
            showDropOverlay();
        }
    });

    window.addEventListener('dragleave', (e) => {
        if (dragDepth <= 0) return;
        dragDepth--;
        if (dragDepth <= 0 || e.relatedTarget === null) hideDropOverlay();
    });

    window.addEventListener('drop', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        hideDropOverlay();
        const dt = e.dataTransfer;
        if (!dt) return;

        let rawFiles = [];
        try { if (dt.files && dt.files.length) rawFiles = Array.from(dt.files); } catch (err) {}

        const entries = [];
        try {
            if (dt.items && dt.items.length) {
                for (let i = 0; i < dt.items.length; i++) {
                    const it = dt.items[i];
                    if (!it || it.kind !== 'file') continue;
                    const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                    if (entry) entries.push(entry);
                }
            }
        } catch (err) {}

        handleDrop(rawFiles, entries);
    });

    // ========== 窗口大小 ==========
    let windowResizeTimer = null;
    window.addEventListener('resize', () => {
        invalidateCanvasRectCache();
        if (windowResizeTimer) clearTimeout(windowResizeTimer);
        windowResizeTimer = setTimeout(() => { updateCanvasPadding(); }, 100);
    });

    // ========== 初始化 ==========
    async function init() {
        canvasWidth = parseInt(widthInput.value) || 800;
        canvasHeight = parseInt(heightInput.value) || 800;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        lastValidWidth = canvasWidth;
        lastValidHeight = canvasHeight;

        canvasBgColor = bgColorInput.value || '#ffffff';
        canvas.style.background = canvasBgColor;

        invalidateCanvasRectCache();
        updateCanvasDisplaySize();
        updateViewZoomBadge();
        initTheme();
        renderAll();
        renderOverlay();
        renderLayerPanel();

        showShortcutHint(DEFAULT_HINT);

        let restored = false;
        try {
            const saved = await loadAutoSave();
            if (saved && Array.isArray(saved.layers) && saved.layers.length > 0) {
                restoreState(saved, () => {
                    history = [];
                    historyIndex = -1;
                    saveState();
                    requestAnimationFrame(() => {
                        updateCanvasPadding();
                        centerCanvasInView();
                    });
                });
                restored = true;
                showToast('已恢复上次会话');
            }
        } catch (e) { console.warn(e); }

        if (!restored) {
            saveState();
            requestAnimationFrame(() => {
                updateCanvasPadding();
                centerCanvasInView();
            });
        }

        showToast('画布/图层均可框选 · Shift 加选 · 中键平移');
    }
    init();
})();
</script>
</body>
</html>
