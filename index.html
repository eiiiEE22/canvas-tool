    function setHintDimmed(on) {
        if (!mouseHint) return;
        mouseHint.classList.toggle('dimmed', on);
    }

    let canvasRectCache = null;
    function invalidateCanvasRectCache() { canvasRectCache = null; }
    function getCanvasRectCached() {
        if (!canvasRectCache) {
            const r = canvas.getBoundingClientRect();
            canvasRectCache = {
                left: r.left,
                top: r.top,
                sx: canvas.width / r.width,
                sy: canvas.height / r.height
            };
        }
        return canvasRectCache;
    }
    function canvasPointFromClient(clientX, clientY) {
        const r = getCanvasRectCached();
        return { x: (clientX - r.left) * r.sx, y: (clientY - r.top) * r.sy };
    }
    function getCanvasMouse(e) {
        return canvasPointFromClient(e.clientX, e.clientY);
    }

    function getLayerW(layer) {
        if (!layer || !layer.img) return 0;
        return layer.img.width * layer.scaleX;
    }
    function getLayerH(layer) {
        if (!layer || !layer.img) return 0;
        return layer.img.height * layer.scaleY;
    }

    function updateCanvasDisplaySize() {
        const w = canvasWidth * viewScale;
        const h = canvasHeight * viewScale;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        transformSvg.setAttribute('width', w);
        transformSvg.setAttribute('height', h);
        transformSvg.setAttribute('viewBox', `0 0 ${canvasWidth} ${canvasHeight}`);
        invalidateCanvasRectCache();
        updateCanvasPadding();
    }

    function updateViewZoomBadge() {
        viewZoomBadge.textContent = `视图 ${Math.round(viewScale * 100)}%`;
    }

    function setViewScale(newScale, clientX, clientY) {
        newScale = Math.min(Math.max(newScale, 0.05), 10);
        if (Math.abs(newScale - viewScale) < 0.001) return;

        const oldRect = canvas.getBoundingClientRect();
        const canvasX = (clientX - oldRect.left) / viewScale;
        const canvasY = (clientY - oldRect.top) / viewScale;

        viewScale = newScale;
        updateCanvasDisplaySize();
        invalidateCanvasRectCache();

        const newRect = canvas.getBoundingClientRect();
        const targetLeft = clientX - canvasX * newScale;
        const targetTop = clientY - canvasY * newScale;
        const dx = newRect.left - targetLeft;
        const dy = newRect.top - targetTop;
        if (Math.abs(dx) > 0.01) canvasWrapper.scrollLeft += dx;
        if (Math.abs(dy) > 0.01) canvasWrapper.scrollTop += dy;

        updateViewZoomBadge();
        renderOverlay();
    }

    function centerCanvasInView() {
        const cw = canvas.offsetWidth;
        const ch = canvas.offsetHeight;
        const centerX = stagePadX + cw / 2;
        const centerY = stagePadY + ch / 2;
        canvasWrapper.scrollLeft = Math.max(0, centerX - canvasWrapper.clientWidth / 2);
        canvasWrapper.scrollTop = Math.max(0, centerY - canvasWrapper.clientHeight / 2);
    }

    function getGridStep() {
        let step = 50;
        let guard = 0;
        while (step * viewScale < 40 && guard++ < 20) step *= 2;
        guard = 0;
        while (step * viewScale > 100 && guard++ < 20) step /= 2;
        return step;
    }

    function hexToRgb(hex) {
        if (!hex) return null;
        let h = String(hex).trim().replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        if (h.length !== 6) return null;
        const n = parseInt(h, 16);
        if (isNaN(n)) return null;
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    function getGridLineColor() {
        const rgb = hexToRgb(canvasBgColor);
        if (!rgb) return getCSSVar('--grid-line') || '#f1f1f2';
        const lum = 0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b;
        return lum > 140 ? 'rgba(0,0,0,0.055)' : 'rgba(255,255,255,0.10)';
    }

    function getActiveLayer() {
        if (activeLayerIndex >= 0 && activeLayerIndex < layers.length) return layers[activeLayerIndex];
        return null;
    }

    function generateLayerName() { return `图层 ${layers.length + 1}`; }
    function generateLayerId() {
        return 'layer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }

    function getLayerFilter(layer) {
        const parts = [];
        const hue = layer.hue || 0;
        const sat = layer.saturation !== undefined ? layer.saturation : 100;
        const bri = layer.brightness !== undefined ? layer.brightness : 100;
        const con = layer.contrast !== undefined ? layer.contrast : 100;
        const gray = layer.grayscale || 0;
        const sep = layer.sepia || 0;
        const inv = layer.invert || 0;

        if (hue !== 0) parts.push(`hue-rotate(${hue}deg)`);
        if (sat !== 100) parts.push(`saturate(${sat}%)`);
        if (bri !== 100) parts.push(`brightness(${bri}%)`);
        if (con !== 100) parts.push(`contrast(${con}%)`);
        if (gray > 0) parts.push(`grayscale(${gray}%)`);
        if (sep > 0) parts.push(`sepia(${sep}%)`);
        if (inv > 0) parts.push(`invert(${inv}%)`);

        return parts.length ? parts.join(' ') : 'none';
    }

    function getSelectedLayerIndices() {
        const arr = [];
        selectedIndices.forEach(i => {
            if (i >= 0 && i < layers.length && layers[i].visible && layers[i].img) arr.push(i);
        });
        arr.sort((a, b) => a - b);
        return arr;
    }

    function getLayerAABB(l) {
        const w = getLayerW(l);
        const h = getLayerH(l);
        const rot = l.rotation || 0;
        if (!rot) return { x: l.x, y: l.y, w: w, h: h };
        const cx = l.x + w / 2, cy = l.y + h / 2;
        const r = rot * Math.PI / 180;
        const cos = Math.cos(r), sin = Math.sin(r);
        const hw = w / 2, hh = h / 2;
        const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (let i = 0; i < 4; i++) {
            const dx = pts[i][0], dy = pts[i][1];
            const px = cx + dx * cos - dy * sin;
            const py = cy + dx * sin + dy * cos;
            if (px < minX) minX = px;
            if (px > maxX) maxX = px;
            if (py < minY) minY = py;
            if (py > maxY) maxY = py;
        }
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function getSelectionBounds() {
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) return null;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const i of indices) {
            const l = layers[i];
            const b = getLayerAABB(l);
            if (b.w === 0 || b.h === 0) continue;
            minX = Math.min(minX, b.x);
            minY = Math.min(minY, b.y);
            maxX = Math.max(maxX, b.x + b.w);
            maxY = Math.max(maxY, b.y + b.h);
        }
        if (!isFinite(minX)) return null;
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function getTransformFrame() {
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) return null;
        if (indices.length === 1) {
            const l = layers[indices[0]];
            const w = getLayerW(l), h = getLayerH(l);
            if (!w || !h) return null;
            return { x: l.x, y: l.y, w: w, h: h, rot: l.rotation || 0 };
        }
        const b = getSelectionBounds();
        if (!b) return null;
        return { x: b.x, y: b.y, w: b.w, h: b.h, rot: 0 };
    }

    function toFrameCoords(frame, mx, my) {
        if (!frame || !frame.rot) return { x: mx, y: my };
        const cx = frame.x + frame.w / 2, cy = frame.y + frame.h / 2;
        const rad = -frame.rot * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const dx = mx - cx, dy = my - cy;
        return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
    }

    function makeLayerFromImg(img, name, x, y, scale) {
        return {
            id: generateLayerId(),
            name: name || generateLayerName(),
            img: img,
            x: x, y: y,
            scaleX: scale, scaleY: scale,
            visible: true, locked: false, opacity: 1,
            flipX: false, flipY: false,
            rotation: 0,
            hue: 0, saturation: 100, brightness: 100, contrast: 100,
            grayscale: 0, sepia: 0, invert: 0,
            blend: 'source-over'
        };
    }

    // ========== 图层操作 ==========
    function addImageAsLayer(img, name, opts) {
        opts = opts || {};
        if (!img || !img.width || !img.height) return null;
        let scale, x, y;

        if (opts.fill) {
            scale = Math.max(canvasWidth / img.width, canvasHeight / img.height);
            x = (canvasWidth - img.width * scale) / 2;
            y = (canvasHeight - img.height * scale) / 2;
        } else {
            const fit = Math.min((canvasWidth * 0.9) / img.width, (canvasHeight * 0.9) / img.height, 1);
            scale = fit;
            x = (canvasWidth - img.width * scale) / 2;
            y = (canvasHeight - img.height * scale) / 2;
        }

        const layer = makeLayerFromImg(img, name, x, y, scale);
        layers.push(layer);
        activeLayerIndex = layers.length - 1;
        selectedIndices.clear();
        selectedIndices.add(activeLayerIndex);
        if (!opts.silent) { renderAll(); renderOverlay(); renderLayerPanel(); }
        if (!opts.skipHistory) saveState();
        return layer;
    }

    function removeLayer(index, silent) {
        if (index < 0 || index >= layers.length) return;
        const layer = layers[index];
        if (layer.locked) { showToast('图层已锁定，无法删除'); return; }
        layers.splice(index, 1);

        const newSel = new Set();
        selectedIndices.forEach(i => {
            if (i < index) newSel.add(i);
            else if (i > index) newSel.add(i - 1);
        });
        selectedIndices = newSel;

        if (layers.length === 0) {
            activeLayerIndex = -1;
            selectedIndices.clear();
        } else {
            if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
            if (activeLayerIndex > index) activeLayerIndex--;
            if (activeLayerIndex < 0) activeLayerIndex = 0;
            if (selectedIndices.size === 0) selectedIndices.add(activeLayerIndex);
        }

        if (hueEditingLayerIndex === index) closeHuePanel();
        else if (hueEditingLayerIndex > index) hueEditingLayerIndex--;
        if (contextMenuLayerIndex === index) { hideContextMenu(); contextMenuLayerIndex = -1; }
        else if (contextMenuLayerIndex > index) contextMenuLayerIndex--;

        if (!silent) { renderAll(); renderOverlay(); renderLayerPanel(); saveState(true); }
    }

    function selectLayer(index, additive) {
        if (index < 0 || index >= layers.length) return;
        if (transformMode) exitTransformMode(true);

        if (additive) {
            if (selectedIndices.has(index)) {
                if (selectedIndices.size > 1) {
                    selectedIndices.delete(index);
                    if (activeLayerIndex === index) {
                        const arr = Array.from(selectedIndices);
                        activeLayerIndex = arr[arr.length - 1];
                    }
                }
            } else {
                selectedIndices.add(index);
                activeLayerIndex = index;
            }
        } else {
            selectedIndices.clear();
            selectedIndices.add(index);
            activeLayerIndex = index;
        }
        renderAll(); renderOverlay(); renderLayerPanel();
    }

    function toggleLayerVisibility(index) {
        if (index < 0 || index >= layers.length) return;
        layers[index].visible = !layers[index].visible;
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
    }

    function toggleLayerLock(index) {
        if (index < 0 || index >= layers.length) return;
        layers[index].locked = !layers[index].locked;
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(layers[index].locked ? '图层已锁定' : '图层已解锁');
    }

    function renameLayer(index, newName) {
        if (index < 0 || index >= layers.length) return;
        if (!newName || newName === layers[index].name) { renderLayerPanel(); return; }
        layers[index].name = newName;
        renderLayerPanel(); saveState();
    }

    function moveLayerToPosition(srcIndex, targetIndex, before) {
        const n = layers.length;
        if (srcIndex < 0 || srcIndex >= n) return;
        if (targetIndex < 0 || targetIndex >= n) return;
        if (srcIndex === targetIndex) return;

        const oldLayers = layers.slice();
        const movedLayer = oldLayers[srcIndex];
        const targetLayer = oldLayers[targetIndex];

        const rest = oldLayers.slice();
        rest.splice(srcIndex, 1);
        const targetPos = rest.indexOf(targetLayer);
        if (targetPos < 0) return;
        const insertPos = before ? targetPos + 1 : targetPos;
        rest.splice(insertPos, 0, movedLayer);

        let same = true;
        for (let i = 0; i < n; i++) {
            if (rest[i] !== oldLayers[i]) { same = false; break; }
        }
        if (same) return;

        const oldActive = (activeLayerIndex >= 0 && activeLayerIndex < n) ? oldLayers[activeLayerIndex] : null;
        const oldSelLayers = [];
        selectedIndices.forEach(i => { if (i >= 0 && i < n) oldSelLayers.push(oldLayers[i]); });
        const oldHue = (hueEditingLayerIndex >= 0 && hueEditingLayerIndex < n) ? oldLayers[hueEditingLayerIndex] : null;
        const oldCtx = (contextMenuLayerIndex >= 0 && contextMenuLayerIndex < n) ? oldLayers[contextMenuLayerIndex] : null;

        layers = rest;
        activeLayerIndex = oldActive ? layers.indexOf(oldActive) : -1;
        selectedIndices = new Set(oldSelLayers.map(l => layers.indexOf(l)).filter(i => i >= 0));
        hueEditingLayerIndex = oldHue ? layers.indexOf(oldHue) : -1;
        contextMenuLayerIndex = oldCtx ? layers.indexOf(oldCtx) : -1;

        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast('图层顺序已调整');
    }

    function nudgeLayerOrder(direction) {
        const sel = getSelectedLayerIndices();
        if (sel.length === 0) { showToast('请先选择图层'); return; }
        for (const i of sel) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层'); return; }
        }

        const selectedObjs = sel.map(i => layers[i]);
        const order = direction > 0
            ? sel.slice().sort((a, b) => b - a)
            : sel.slice().sort((a, b) => a - b);

        let moved = false;
        for (const i of order) {
            const j = i + direction;
            if (j < 0 || j >= layers.length) continue;
            if (sel.indexOf(j) >= 0) continue;
            const tmp = layers[i];
            layers[i] = layers[j];
            layers[j] = tmp;
            moved = true;
        }
        if (!moved) { showToast(direction > 0 ? '已经在最上层' : '已经在最下层'); return; }

        selectedIndices = new Set();
        for (const o of selectedObjs) {
            const idx = layers.indexOf(o);
            if (idx >= 0) selectedIndices.add(idx);
        }
        if (selectedIndices.size > 0) {
            activeLayerIndex = Math.max.apply(null, Array.from(selectedIndices));
        }
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(direction > 0 ? '已上移一层' : '已下移一层');
    }

    function duplicateSelected() {
        const sel = getSelectedLayerIndices();
        if (sel.length === 0) { showToast('没有可复制的图层'); return; }
        const newLayers = [];
        for (const i of sel) {
            const l = layers[i];
            if (l.locked) continue;
            newLayers.push({
                id: generateLayerId(),
                name: l.name + ' 副本',
                img: l.img,
                x: l.x + 20, y: l.y + 20,
                scaleX: l.scaleX, scaleY: l.scaleY,
                visible: l.visible, locked: false, opacity: l.opacity,
                flipX: l.flipX, flipY: l.flipY,
                rotation: l.rotation || 0,
                hue: l.hue, saturation: l.saturation, brightness: l.brightness,
                contrast: l.contrast, grayscale: l.grayscale, sepia: l.sepia, invert: l.invert,
                blend: l.blend
            });
        }
        if (newLayers.length === 0) { showToast('所有选中图层均已锁定'); return; }
        const startIdx = layers.length;
        layers.push.apply(layers, newLayers);
        selectedIndices = new Set();
        for (let k = 0; k < newLayers.length; k++) selectedIndices.add(startIdx + k);
        activeLayerIndex = layers.length - 1;
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(`已复制 ${newLayers.length} 个图层`);
    }

    function copySelectedLayers() {
        const sel = getSelectedLayerIndices();
        if (sel.length === 0) { showToast('没有可复制的图层'); return; }
        _layerClipboard = sel.map(i => {
            const l = layers[i];
            return {
                name: l.name, img: l.img,
                scaleX: l.scaleX, scaleY: l.scaleY,
                visible: l.visible, opacity: l.opacity,
                flipX: l.flipX, flipY: l.flipY,
                rotation: l.rotation || 0,
                hue: l.hue, saturation: l.saturation, brightness: l.brightness,
                contrast: l.contrast, grayscale: l.grayscale, sepia: l.sepia, invert: l.invert,
                blend: l.blend,
                w: getLayerW(l), h: getLayerH(l)
            };
        });
        showToast(`已复制 ${_layerClipboard.length} 个图层`);
    }

    function pasteLayers() {
        if (!_layerClipboard || _layerClipboard.length === 0) return false;
        const startIdx = layers.length;
        const newLayers = _layerClipboard.map(src => ({
            id: generateLayerId(),
            name: src.name + ' 副本',
            img: src.img,
            x: (canvasWidth - src.w) / 2,
            y: (canvasHeight - src.h) / 2,
            scaleX: src.scaleX, scaleY: src.scaleY,
            visible: src.visible, locked: false, opacity: src.opacity,
            flipX: src.flipX, flipY: src.flipY,
            rotation: src.rotation || 0,
            hue: src.hue, saturation: src.saturation, brightness: src.brightness,
            contrast: src.contrast, grayscale: src.grayscale, sepia: src.sepia, invert: src.invert,
            blend: src.blend
        }));
        layers.push.apply(layers, newLayers);
        selectedIndices = new Set();
        for (let k = 0; k < newLayers.length; k++) selectedIndices.add(startIdx + k);
        activeLayerIndex = layers.length - 1;
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(`已粘贴 ${newLayers.length} 个图层`);
        return true;
    }

    function flipLayer(index, horizontal) {
        const layer = layers[index];
        if (!layer || !layer.img) return;
        if (layer.locked) { showToast('图层已锁定，无法翻转'); return; }
        if (horizontal) layer.flipX = !layer.flipX;
        else layer.flipY = !layer.flipY;
        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(horizontal ? '已水平翻转' : '已垂直翻转');
    }

    function rotateLayer90(index, clockwise) {
        const layer = layers[index];
        if (!layer || !layer.img) return;
        if (layer.locked) { showToast('图层已锁定，无法旋转'); return; }

        const sw = layer.img.naturalWidth || layer.img.width;
        const sh = layer.img.naturalHeight || layer.img.height;
        if (!sw || !sh) return;

        const c = document.createElement('canvas');
        c.width = sh; c.height = sw;
        const cx = c.getContext('2d');
        cx.translate(sh / 2, sw / 2);
        cx.rotate((clockwise ? 1 : -1) * Math.PI / 2);
        cx.drawImage(layer.img, -sw / 2, -sh / 2, sw, sh);

        const w0 = getLayerW(layer), h0 = getLayerH(layer);
        const centerX = layer.x + w0 / 2;
        const centerY = layer.y + h0 / 2;

        let outUrl;
        try { outUrl = c.toDataURL('image/png'); } catch (err) { showToast('旋转失败'); return; }

        const newImg = new Image();
        newImg.onload = () => {
            if (layers.indexOf(layer) < 0) return;
            layer.img = newImg;
            const w1 = getLayerW(layer), h1 = getLayerH(layer);
            layer.x = centerX - w1 / 2;
            layer.y = centerY - h1 / 2;
            renderAll(); renderOverlay(); renderLayerPanel(); saveState();
            showToast('已旋转 90°');
        };
        newImg.onerror = () => showToast('旋转失败');
        newImg.src = outUrl;
    }

    // ========== 对齐 / 分布 / 网格（重写 + 新增） ==========
    function alignLayers(mode) {
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) { showToast('请先选择图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层，无法对齐'); return; }
        }

        let bounds = null;
        if (indices.length === 1) {
            bounds = { x: 0, y: 0, w: canvasWidth, h: canvasHeight };
        } else {
            bounds = getSelectionBounds();
        }
        if (!bounds || bounds.w <= 0 || bounds.h <= 0) {
            bounds = { x: 0, y: 0, w: canvasWidth, h: canvasHeight };
        }

        let changed = false;
        for (const i of indices) {
            const l = layers[i];
            if (!l || !l.img) continue;
            const b = getLayerAABB(l);
            if (b.w === 0 || b.h === 0) continue;

            let dx = 0, dy = 0;
            switch (mode) {
                case 'left':     dx = bounds.x - b.x; break;
                case 'center-h': dx = (bounds.x + bounds.w / 2) - (b.x + b.w / 2); break;
                case 'right':    dx = (bounds.x + bounds.w) - (b.x + b.w); break;
                case 'top':      dy = bounds.y - b.y; break;
                case 'middle':   dy = (bounds.y + bounds.h / 2) - (b.y + b.h / 2); break;
                case 'bottom':   dy = (bounds.y + bounds.h) - (b.y + b.h); break;
                default: return;
            }
            if (dx !== 0 || dy !== 0) {
                l.x += dx;
                l.y += dy;
                changed = true;
            }
        }

        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(changed ? '已对齐' : '已是最佳位置');
    }

    function distributeLayers(axis) {
        const indices = getSelectedLayerIndices();
        if (indices.length < 3) { showToast('分布需要至少 3 个图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层，无法分布'); return; }
        }

        const items = indices.map(i => {
            const l = layers[i];
            const b = getLayerAABB(l);
            return { l: l, b: b, w: b.w, h: b.h };
        });

        if (axis === 'h') {
            items.sort((a, b) => a.b.x - b.b.x);
            const firstX = items[0].b.x;
            const last = items[items.length - 1];
            const lastRight = last.b.x + last.w;
            const span = lastRight - firstX;
            const totalW = items.reduce((s, it) => s + it.w, 0);
            const gap = (span - totalW) / (items.length - 1);
            let cur = firstX;
            for (const it of items) {
                it.l.x += cur - it.b.x;
                cur += it.w + gap;
            }
        } else {
            items.sort((a, b) => a.b.y - b.b.y);
            const firstY = items[0].b.y;
            const last = items[items.length - 1];
            const lastBottom = last.b.y + last.h;
            const span = lastBottom - firstY;
            const totalH = items.reduce((s, it) => s + it.h, 0);
            const gap = (span - totalH) / (items.length - 1);
            let cur = firstY;
            for (const it of items) {
                it.l.y += cur - it.b.y;
                cur += it.h + gap;
            }
        }

        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(axis === 'h' ? '已水平分布' : '已垂直分布');
    }

    // ★ 新增：田字格网格分布（自动铺满画布）
    function gridLayoutLayers() {
        const indices = getSelectedLayerIndices();
        if (indices.length < 2) { showToast('网格排列需要至少 2 个图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层，无法排列'); return; }
        }

        const n = indices.length;
        const cols = Math.ceil(Math.sqrt(n));
        const rows = Math.ceil(n / cols);
        const cellW = canvasWidth / cols;
        const cellH = canvasHeight / rows;

        // 按当前位置从左上到右下排序，使排列顺序符合视觉直觉
        const ordered = indices.slice().sort((a, b) => {
            const ba = getLayerAABB(layers[a]);
            const bb = getLayerAABB(layers[b]);
            const caY = ba.y + ba.h / 2;
            const cbY = bb.y + bb.h / 2;
            if (Math.abs(caY - cbY) > 24) return caY - cbY;
            const caX = ba.x + ba.w / 2;
            const cbX = bb.x + bb.w / 2;
            return caX - cbX;
        });

        ordered.forEach((idx, k) => {
            const l = layers[idx];
            if (!l || !l.img) return;
            const r = Math.floor(k / cols);
            const c = k % cols;
            const cellX = c * cellW;
            const cellY = r * cellH;

            const w0 = getLayerW(l);
            const h0 = getLayerH(l);
            if (w0 <= 0 || h0 <= 0) return;

            // 等比缩放使其刚好铺满单元格
            const s = Math.min(cellW / w0, cellH / h0);
            if (isFinite(s) && s > 0) {
                l.scaleX *= s;
                l.scaleY *= s;
            }

            const w1 = getLayerW(l);
            const h1 = getLayerH(l);

            // 图层中心放到单元格中心（对旋转图层同样友好）
            const cx = cellX + cellW / 2;
            const cy = cellY + cellH / 2;
            l.x = cx - w1 / 2;
            l.y = cy - h1 / 2;
        });

        renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        showToast(`已排列为 ${rows} × ${cols} 网格`);
    }

    // ========== 渲染 ==========
    function renderAll() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        ctx.fillStyle = canvasBgColor;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        const step = getGridStep();
        ctx.strokeStyle = getGridLineColor();
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= canvasWidth; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke();
        }
        for (let y = 0; y <= canvasHeight; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke();
        }

        for (const layer of layers) {
            if (!layer.visible || !layer.img) continue;
            const w = getLayerW(layer);
            const h = getLayerH(layer);
            if (w === 0 || h === 0) continue;

            ctx.globalAlpha = layer.opacity;
            ctx.filter = getLayerFilter(layer);
            ctx.globalCompositeOperation = layer.blend || 'source-over';

            const rotation = layer.rotation || 0;
            if (rotation || layer.flipX || layer.flipY) {
                ctx.save();
                try {
                    ctx.translate(layer.x + w / 2, layer.y + h / 2);
                    if (rotation) ctx.rotate(rotation * Math.PI / 180);
                    ctx.scale(layer.flipX ? -1 : 1, layer.flipY ? -1 : 1);
                    ctx.drawImage(layer.img, -w / 2, -h / 2, w, h);
                } catch (err) { /* ignore */ }
                ctx.restore();
            } else {
                try {
                    ctx.drawImage(layer.img, layer.x, layer.y, w, h);
                } catch (err) { /* ignore */ }
            }
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        ctx.globalAlpha = 1;

        updateStatus();
    }

    function renderOverlay() {
        while (transformSvg.firstChild) transformSvg.removeChild(transformSvg.firstChild);
        drawSvgSnapLines();

        if (isMarqueeSelecting) drawMarqueeRect();

        const indices = getSelectedLayerIndices();
        if (indices.length === 0) return;

        let bounds = getSelectionBounds();
        if (!bounds) return;

        const stroke = getCSSVar('--outline-selected');
        const fillSurface = getCSSVar('--surface');

        let rot = 0;
        if (transformMode && indices.length === 1) {
            const l = layers[indices[0]];
            const lw = getLayerW(l), lh = getLayerH(l);
            bounds = { x: l.x, y: l.y, w: lw, h: lh };
            rot = l.rotation || 0;
        }

        const cx = bounds.x + bounds.w / 2;
        const cy = bounds.y + bounds.h / 2;

        const g = document.createElementNS(SVG_NS, 'g');
        if (rot) {
            g.setAttribute('transform', `rotate(${rot} ${cx} ${cy})`);
        }
        transformSvg.appendChild(g);

        if (transformMode) {
            const rect = document.createElementNS(SVG_NS, 'rect');
            rect.setAttribute('x', bounds.x);
            rect.setAttribute('y', bounds.y);
            rect.setAttribute('width', bounds.w);
            rect.setAttribute('height', bounds.h);
            rect.setAttribute('fill', 'none');
            rect.setAttribute('stroke', stroke);
            rect.setAttribute('stroke-width', 1 / viewScale);
            rect.setAttribute('stroke-dasharray', `${4 / viewScale} ${4 / viewScale}`);
            g.appendChild(rect);

            const size = 8 / viewScale;

            const isScaleActive = transformDragMode === 'scale';
            const scaleFill = isScaleActive ? getCSSVar('--sel-accent') : fillSurface;
            const scaleStroke = isScaleActive ? fillSurface : stroke;
            const scaleSize = isScaleActive ? size * 1.15 : size;
            const scaleHalf = scaleSize / 2;

            const handles = getTransformHandlePositions(bounds);
            transformHandles = handles;
            for (const p of handles) {
                const r = document.createElementNS(SVG_NS, 'rect');
                r.setAttribute('x', p.x - scaleHalf);
                r.setAttribute('y', p.y - scaleHalf);
                r.setAttribute('width', scaleSize);
                r.setAttribute('height', scaleSize);
                r.setAttribute('fill', scaleFill);
                r.setAttribute('stroke', scaleStroke);
                r.setAttribute('stroke-width', 1.4 / viewScale);
                g.appendChild(r);

                if (isScaleActive) {
                    const cross = document.createElementNS(SVG_NS, 'path');
                    const cs = scaleSize * 0.25;
                    cross.setAttribute('d', `M ${p.x - cs} ${p.y} L ${p.x + cs} ${p.y} M ${p.x} ${p.y - cs} L ${p.x} ${p.y + cs}`);
                    cross.setAttribute('stroke', fillSurface);
                    cross.setAttribute('stroke-width', 1.2 / viewScale);
                    cross.setAttribute('fill', 'none');
                    g.appendChild(cross);
                }
            }

            const isRotateActive = transformDragMode === 'rotate';
            const rotFill = isRotateActive ? getCSSVar('--sel-accent') : fillSurface;
            const rotStroke = isRotateActive ? fillSurface : stroke;
            const rSize = isRotateActive ? (7 / viewScale) * 1.15 : (7 / viewScale);

            const rotHandles = getRotateHandlePositions(bounds);
            for (const p of rotHandles) {
                const c = document.createElementNS(SVG_NS, 'circle');
                c.setAttribute('cx', p.x);
                c.setAttribute('cy', p.y);
                c.setAttribute('r', rSize / 2);
                c.setAttribute('fill', rotFill);
                c.setAttribute('stroke', rotStroke);
                c.setAttribute('stroke-width', 1.4 / viewScale);
                g.appendChild(c);

                if (isRotateActive) {
                    const arrow = document.createElementNS(SVG_NS, 'path');
                    const as = rSize * 0.35;
                    arrow.setAttribute('d', `M ${p.x - as} ${p.y + as*0.5} A ${as} ${as} 0 1 1 ${p.x + as} ${p.y + as*0.5}`);
                    arrow.setAttribute('stroke', fillSurface);
                    arrow.setAttribute('stroke-width', 1.2 / viewScale);
                    arrow.setAttribute('fill', 'none');
                    arrow.setAttribute('stroke-linecap', 'round');
                    g.appendChild(arrow);
                }
            }
        } else {
            if (indices.length === 1) {
                const i = indices[0];
                const l = layers[i];
                const w = getLayerW(l);
                const h = getLayerH(l);
                const rotation = l.rotation || 0;
                const rect = document.createElementNS(SVG_NS, 'rect');
                rect.setAttribute('x', l.x);
                rect.setAttribute('y', l.y);
                rect.setAttribute('width', w);
                rect.setAttribute('height', h);
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', l.locked ? getCSSVar('--warn') : stroke);
                rect.setAttribute('stroke-width', 1.5 / viewScale);
                rect.setAttribute('stroke-dasharray', `${5 / viewScale} ${4 / viewScale}`);
                if (rotation) {
                    const lcx = l.x + w / 2, lcy = l.y + h / 2;
                    rect.setAttribute('transform', `rotate(${rotation} ${lcx} ${lcy})`);
                }
                transformSvg.appendChild(rect);

                if (l.locked) drawSvgLockIcon(l.x + 6 / viewScale, l.y + 6 / viewScale);
            } else {
                const rect = document.createElementNS(SVG_NS, 'rect');
                rect.setAttribute('x', bounds.x);
                rect.setAttribute('y', bounds.y);
                rect.setAttribute('width', bounds.w);
                rect.setAttribute('height', bounds.h);
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', stroke);
                rect.setAttribute('stroke-width', 1.2 / viewScale);
                rect.setAttribute('stroke-dasharray', `${5 / viewScale} ${4 / viewScale}`);
                rect.setAttribute('opacity', '0.7');
                transformSvg.appendChild(rect);

                for (const i of indices) {
                    const l = layers[i];
                    const w = getLayerW(l);
                    const h = getLayerH(l);
                    const rotation = l.rotation || 0;
                    const r = document.createElementNS(SVG_NS, 'rect');
                    r.setAttribute('x', l.x);
                    r.setAttribute('y', l.y);
                    r.setAttribute('width', w);
                    r.setAttribute('height', h);
                    r.setAttribute('fill', 'none');
                    r.setAttribute('stroke', stroke);
                    r.setAttribute('stroke-width', 1 / viewScale);
                    r.setAttribute('stroke-dasharray', `${3 / viewScale} ${3 / viewScale}`);
                    r.setAttribute('opacity', '0.6');
                    if (rotation) {
                        const lcx = l.x + w / 2, lcy = l.y + h / 2;
                        r.setAttribute('transform', `rotate(${rotation} ${lcx} ${lcy})`);
                    }
                    transformSvg.appendChild(r);
                }
            }
        }
    }

    function drawMarqueeRect() {
        if (!marqueeStart || !marqueeCurrent) return;
        const x1 = Math.min(marqueeStart.x, marqueeCurrent.x);
        const y1 = Math.min(marqueeStart.y, marqueeCurrent.y);
        const w = Math.abs(marqueeCurrent.x - marqueeStart.x);
        const h = Math.abs(marqueeCurrent.y - marqueeStart.y);
        if (w < 0.5 && h < 0.5) return;

        const rect = document.createElementNS(SVG_NS, 'rect');
        rect.setAttribute('x', x1);
        rect.setAttribute('y', y1);
        rect.setAttribute('width', w);
        rect.setAttribute('height', h);
        rect.setAttribute('fill', getCSSVar('--sel-bg') || 'rgba(37,99,235,.12)');
        rect.setAttribute('stroke', getCSSVar('--sel-accent') || '#2563eb');
        rect.setAttribute('stroke-width', 1 / viewScale);
        rect.setAttribute('stroke-dasharray', `${4 / viewScale} ${3 / viewScale}`);
        rect.setAttribute('pointer-events', 'none');
        transformSvg.appendChild(rect);
    }

    function drawSvgLockIcon(px, py) {
        const s = 1 / viewScale;
        const color = getCSSVar('--warn');
        const g = document.createElementNS(SVG_NS, 'g');
        g.setAttribute('stroke', color);
        g.setAttribute('fill', 'none');
        g.setAttribute('stroke-width', 1.8 / viewScale);
        g.setAttribute('stroke-linecap', 'round');

        const r1 = document.createElementNS(SVG_NS, 'rect');
        r1.setAttribute('x', px);
        r1.setAttribute('y', py + 6 * s);
        r1.setAttribute('width', 12 * s);
        r1.setAttribute('height', 9 * s);
        g.appendChild(r1);

        const path = document.createElementNS(SVG_NS, 'path');
        const cx = px + 6 * s;
        const cy = py + 6 * s;
        path.setAttribute('d', `M ${cx - 4 * s} ${cy} A ${4 * s} ${4 * s} 0 0 1 ${cx + 4 * s} ${cy}`);
        g.appendChild(path);

        transformSvg.appendChild(g);
    }

    function drawSvgSnapLines() {
        if (snapLines.length === 0) return;
        const color = getCSSVar('--snap-line');
        for (const line of snapLines) {
            const el = document.createElementNS(SVG_NS, 'line');
            if (line.type === 'vertical') {
                el.setAttribute('x1', line.pos); el.setAttribute('y1', 0);
                el.setAttribute('x2', line.pos); el.setAttribute('y2', canvasHeight);
            } else {
                el.setAttribute('x1', 0); el.setAttribute('y1', line.pos);
                el.setAttribute('x2', canvasWidth); el.setAttribute('y2', line.pos);
            }
            el.setAttribute('stroke', color);
            el.setAttribute('stroke-width', 1.5 / viewScale);
            el.setAttribute('stroke-dasharray', `${6 / viewScale} ${4 / viewScale}`);
            transformSvg.appendChild(el);
        }
    }

    function getTransformHandlePositions(b) {
        const { x, y, w, h } = b;
        return [
            { x: x,         y: y },
            { x: x + w / 2, y: y },
            { x: x + w,     y: y },
            { x: x + w,     y: y + h / 2 },
            { x: x + w,     y: y + h },
            { x: x + w / 2, y: y + h },
            { x: x,         y: y + h },
            { x: x,         y: y + h / 2 }
        ];
    }

    function getRotateHandlePositions(b) {
        const { x, y, w, h } = b;
        const off = 22 / viewScale;
        const cx = x + w / 2, cy = y + h / 2;
        const corners = [
            { x: x,         y: y },
            { x: x + w,     y: y },
            { x: x + w,     y: y + h },
            { x: x,         y: y + h }
        ];
        return corners.map(c => {
            const dx = c.x - cx, dy = c.y - cy;
            const len = Math.hypot(dx, dy) || 1;
            return { x: c.x + dx / len * off, y: c.y + dy / len * off };
        });
    }

    function syncScaleUI(active, selCount) {
        isSyncingZoomSlider = true;
        if (active && selCount <= 1) {
            const pct = Math.round(active.scaleX * 100);
            zoomSlider.value = Math.min(Math.max(pct, 10), 300);
            zoomLabel.value = `${pct}%`;
        } else if (selCount > 1) {
            zoomSlider.value = 100;
            zoomLabel.value = '多选';
        } else {
            zoomSlider.value = 100;
            zoomLabel.value = '100%';
        }
        isSyncingZoomSlider = false;
    }

    function updateStatus() {
        sizeInfo.textContent = `画布 ${canvasWidth} × ${canvasHeight}`;
        const selCount = selectedIndices.size;
        const active = getActiveLayer();
        if (active && selCount <= 1) {
            const w = Math.round(getLayerW(active));
            const h = Math.round(getLayerH(active));
            const opPct = Math.round((active.opacity !== undefined ? active.opacity : 1) * 100);
            const rotPct = Math.round(active.rotation || 0);
            posInfo.textContent = `图层 ${layers.length} · 选中 ${active.name}（${w}×${h} · ${opPct}%${rotPct ? ' · ' + rotPct + '°' : ''}）${active.locked ? ' · 已锁定' : ''}`;
        } else if (selCount > 1) {
            posInfo.textContent = `图层 ${layers.length} · 已选 ${selCount} 个图层`;
        } else {
            posInfo.textContent = `图层 ${layers.length} · 未选中`;
        }
        syncScaleUI(active, selCount);
    }

    // ========== 吸附 ==========
    function buildSnapTargets(excludeIndices) {
        const exclude = excludeIndices instanceof Set ? excludeIndices : new Set();
        const xTargets = [0, canvasWidth / 2, canvasWidth];
        const yTargets = [0, canvasHeight / 2, canvasHeight];
        for (let i = 0; i < layers.length; i++) {
            if (exclude.has(i)) continue;
            const l = layers[i];
            if (!l.visible || !l.img) continue;
            const b = getLayerAABB(l);
            if (b.w === 0 || b.h === 0) continue;
            xTargets.push(b.x, b.x + b.w / 2, b.x + b.w);
            yTargets.push(b.y, b.y + b.h / 2, b.y + b.h);
        }
        return { xTargets: xTargets, yTargets: yTargets };
    }

    function applySnappingWithTargets(x, y, w, h, targets) {
        const SNAP = 8 / viewScale;
        snapLines = [];
        let newX = x, newY = y;
        if (!targets) return { x: newX, y: newY };

        const xTargets = targets.xTargets;
        const yTargets = targets.yTargets;

        const xPositions = [newX, newX + w / 2, newX + w];
        const xOffsets = [0, w / 2, w];
        let bestDistX = SNAP + 1, bestX = null;
        for (let i = 0; i < xPositions.length; i++) {
            for (let k = 0; k < xTargets.length; k++) {
                const t = xTargets[k];
                const dist = Math.abs(xPositions[i] - t);
                if (dist < bestDistX) {
                    bestDistX = dist;
                    bestX = { value: t - xOffsets[i], linePos: t };
                }
            }
        }
        if (bestX) { newX = bestX.value; snapLines.push({ type: 'vertical', pos: bestX.linePos }); }

        const yPositions = [newY, newY + h / 2, newY + h];
        const yOffsets = [0, h / 2, h];
        let bestDistY = SNAP + 1, bestY = null;
        for (let i = 0; i < yPositions.length; i++) {
            for (let k = 0; k < yTargets.length; k++) {
                const t = yTargets[k];
                const dist = Math.abs(yPositions[i] - t);
                if (dist < bestDistY) {
                    bestDistY = dist;
                    bestY = { value: t - yOffsets[i], linePos: t };
                }
            }
        }
        if (bestY) { newY = bestY.value; snapLines.push({ type: 'horizontal', pos: bestY.linePos }); }

        return { x: newX, y: newY };
    }

    function applySnapping(x, y, w, h, excludeIndices) {
        return applySnappingWithTargets(x, y, w, h, buildSnapTargets(excludeIndices));
    }

    // ========== 图层面板 ==========
    let lastLayerBtnDownTime = 0;
    let paintState = null;
    let paintChanged = false;
    let paintRenderRAF = null;

    function schedulePaintRender() {
        if (paintRenderRAF !== null) return;
        paintRenderRAF = requestAnimationFrame(() => {
            paintRenderRAF = null;
            renderAll();
            renderOverlay();
        });
    }

    function applyLayerItemClasses(item, index) {
        const layer = layers[index];
        if (!layer) return;
        const isActive = index === activeLayerIndex;
        const isSelected = selectedIndices.has(index);
        item.className = 'layer-item'
            + (isActive ? ' active' : '')
            + (isSelected ? ' selected' : '')
            + (layer.locked ? ' locked' : '');
    }

    function refreshLayerItemDOM(index) {
        const item = layerList.querySelector('.layer-item[data-index="' + index + '"]');
        if (!item) return;
        const layer = layers[index];
        if (!layer) return;
        applyLayerItemClasses(item, index);

        const visBtn = item.querySelector('.layer-btn.vis');
        if (visBtn) {
            visBtn.className = 'layer-btn vis' + (layer.visible ? ' on' : '');
            visBtn.innerHTML = layer.visible ? ICON_EYE : ICON_EYE_OFF;
            visBtn.title = layer.visible ? '隐藏图层' : '显示图层';
        }
        const lockBtn = item.querySelector('.layer-btn.lock');
        if (lockBtn) {
            lockBtn.className = 'layer-btn lock' + (layer.locked ? ' on' : '');
            lockBtn.innerHTML = layer.locked ? ICON_LOCK : ICON_UNLOCK;
            lockBtn.title = layer.locked ? '点击解锁图层' : '点击锁定图层';
        }
    }

    function paintLayerButton(btn) {
        if (!paintState) return;
        const prop = btn.dataset.prop;
        if (prop !== paintState.prop) return;
        const item = btn.closest('.layer-item');
        if (!item) return;
        const idx = parseInt(item.dataset.index, 10);
        if (isNaN(idx) || idx < 0 || idx >= layers.length) return;
        const layer = layers[idx];
        if (!layer) return;
        if (layer[prop] === paintState.value) return;

        layer[prop] = paintState.value;
        paintChanged = true;
        refreshLayerItemDOM(idx);
        schedulePaintRender();
    }

    layerList.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        const btn = e.target.closest('.layer-btn');
        if (!btn) return;
        const item = btn.closest('.layer-item');
        const idx = item ? parseInt(item.dataset.index, 10) : -1;
        if (isNaN(idx) || idx < 0 || idx >= layers.length) return;
        const prop = btn.dataset.prop;
        if (!prop) return;

        e.preventDefault(); e.stopPropagation();
        lastLayerBtnDownTime = Date.now();
        paintState = { prop: prop, value: !layers[idx][prop] };
        paintChanged = false;
        document.body.classList.add('layer-painting');
        paintLayerButton(btn);
    });

    layerList.addEventListener('mouseover', function(e) {
        if (!paintState) return;
        const btn = e.target.closest('.layer-btn');
        if (!btn) return;
        paintLayerButton(btn);
    });

    layerList.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        const item = e.target.closest('.layer-item');
        if (!item) return;
        if (e.target.closest('.layer-ctrl, .layer-btn, input, select, textarea')) {
            suppressItemDrag = true;
            item.draggable = false;
        }
    }, true);

    window.addEventListener('mouseup', function() {
        if (!paintState) return;
        const changed = paintChanged;
        paintState = null;
        paintChanged = false;
        document.body.classList.remove('layer-painting');
        if (paintRenderRAF !== null) {
            cancelAnimationFrame(paintRenderRAF);
            paintRenderRAF = null;
        }
        if (changed) {
            renderAll(); renderOverlay(); renderLayerPanel(); saveState();
        }
    });

    document.addEventListener('mouseup', function() {
        if (!suppressItemDrag) return;
        suppressItemDrag = false;
        const items = layerList.querySelectorAll('.layer-item');
        for (let i = 0; i < items.length; i++) items[i].draggable = true;
    }, true);
    window.addEventListener('blur', function() {
        if (!suppressItemDrag) return;
        suppressItemDrag = false;
        const items = layerList.querySelectorAll('.layer-item');
        for (let i = 0; i < items.length; i++) items[i].draggable = true;
    });

    function buildThumbCanvas(layer) {
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 36; thumbCanvas.height = 36;
        thumbCanvas.className = 'layer-thumb';
        const tctx = thumbCanvas.getContext('2d');
        tctx.fillStyle = getCSSVar('--thumb-bg') || '#fff';
        tctx.fillRect(0, 0, 36, 36);
        if (layer.img && layer.img.width && layer.img.height) {
            const scale = Math.min(36 / layer.img.width, 36 / layer.img.height);
            const tw = layer.img.width * scale;
            const th = layer.img.height * scale;
            const rotation = layer.rotation || 0;
            try {
                tctx.filter = getLayerFilter(layer);
                if (rotation || layer.flipX || layer.flipY) {
                    tctx.save();
                    tctx.translate(18, 18);
                    if (rotation) tctx.rotate(rotation * Math.PI / 180);
                    tctx.scale(layer.flipX ? -1 : 1, layer.flipY ? -1 : 1);
                    tctx.drawImage(layer.img, -tw / 2, -th / 2, tw, th);
                    tctx.restore();
                } else {
                    tctx.drawImage(layer.img, (36 - tw) / 2, (36 - th) / 2, tw, th);
                }
                tctx.filter = 'none';
            } catch (err) { /* ignore */ }
        }
        return thumbCanvas;
    }

    function renderLayerPanel() {
        const savedScrollTop = layerList.scrollTop;
        layerList.innerHTML = '';
        suppressItemDrag = false;

        for (let i = layers.length - 1; i >= 0; i--) {
            const layer = layers[i];
            const item = document.createElement('div');
            applyLayerItemClasses(item, i);
            item.dataset.index = i;
            item.draggable = true;

            const topRow = document.createElement('div');
            topRow.className = 'layer-top';

            topRow.appendChild(buildThumbCanvas(layer));

            const nameEl = document.createElement('div');
            nameEl.className = 'layer-name';
            nameEl.textContent = layer.name;
            nameEl.title = layer.name;
            nameEl.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (layer.locked) { showToast('图层已锁定，无法重命名'); return; }
                startRenameLayer(i, nameEl);
            });
            topRow.appendChild(nameEl);

            const visBtn = document.createElement('button');
            visBtn.className = 'layer-btn vis' + (layer.visible ? ' on' : '');
            visBtn.innerHTML = layer.visible ? ICON_EYE : ICON_EYE_OFF;
            visBtn.title = layer.visible ? '隐藏图层' : '显示图层';
            visBtn.dataset.prop = 'visible';
            visBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (Date.now() - lastLayerBtnDownTime < 600) return;
                toggleLayerVisibility(i);
            });
            topRow.appendChild(visBtn);

            const lockBtn = document.createElement('button');
            lockBtn.className = 'layer-btn lock' + (layer.locked ? ' on' : '');
            lockBtn.innerHTML = layer.locked ? ICON_LOCK : ICON_UNLOCK;
            lockBtn.title = layer.locked ? '点击解锁图层' : '点击锁定图层';
            lockBtn.dataset.prop = 'locked';
            lockBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (Date.now() - lastLayerBtnDownTime < 600) return;
                toggleLayerLock(i);
            });
            topRow.appendChild(lockBtn);

            item.appendChild(topRow);

            const ctrlRow = document.createElement('div');
            ctrlRow.className = 'layer-ctrl';

            ['mouseup', 'click', 'dblclick', 'pointerdown', 'dragstart'].forEach(evt => {
                ctrlRow.addEventListener(evt, (ev) => ev.stopPropagation());
            });
            ctrlRow.addEventListener('mousedown', (ev) => {
                ev.stopPropagation();
                suppressItemDrag = true;
                item.draggable = false;
            });

            const blendSel = document.createElement('select');
            blendSel.className = 'layer-blend';
            blendSel.draggable = false;
            blendSel.title = '图层混合模式';
            BLEND_MODE_LIST.forEach(([val, txt]) => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = txt;
                blendSel.appendChild(opt);
            });
            blendSel.value = layer.blend || 'source-over';
            blendSel.disabled = !!layer.locked;
            blendSel.addEventListener('change', (ev) => {
                ev.stopPropagation();
                if (layer.locked) {
                    blendSel.value = layer.blend || 'source-over';
                    showToast('图层已锁定');
                    return;
                }
                layer.blend = blendSel.value;
                renderAll(); renderOverlay();
                saveState();
                const optText = blendSel.options[blendSel.selectedIndex].text;
                showShortcutHint(`混合模式：${optText}`);
            });
            ctrlRow.appendChild(blendSel);

            const opSlider = document.createElement('input');
            opSlider.type = 'range';
            opSlider.min = 0; opSlider.max = 100; opSlider.step = 1;
            opSlider.className = 'layer-opacity';
            opSlider.draggable = false;
            opSlider.title = '图层不透明度';
            const opPct0 = Math.round((layer.opacity !== undefined ? layer.opacity : 1) * 100);
            opSlider.value = opPct0;
            opSlider.disabled = !!layer.locked;
            ctrlRow.appendChild(opSlider);

            const opVal = document.createElement('span');
            opVal.className = 'layer-opacity-val';
            opVal.textContent = opPct0 + '%';
            ctrlRow.appendChild(opVal);

            let opSaveTimer = null;
            let opRAF = null;
            const scheduleOpacityRender = () => {
                if (opRAF !== null) return;
                opRAF = requestAnimationFrame(() => {
                    opRAF = null;
                    renderAll();
                    renderOverlay();
                });
            };
            const applyOpacityFromSlider = (saveNow) => {
                if (layer.locked) {
                    opSlider.value = Math.round((layer.opacity !== undefined ? layer.opacity : 1) * 100);
                    return;
                }
                const v = parseFloat(opSlider.value) / 100;
                layer.opacity = v;
                opVal.textContent = Math.round(v * 100) + '%';
                scheduleOpacityRender();
                if (saveNow) {
                    if (opSaveTimer) { clearTimeout(opSaveTimer); opSaveTimer = null; }
                    saveState();
                } else {
                    if (opSaveTimer) clearTimeout(opSaveTimer);
                    opSaveTimer = setTimeout(() => { opSaveTimer = null; saveState(); }, 400);
                }
            };
            opSlider.addEventListener('input', (ev) => {
                ev.stopPropagation();
                applyOpacityFromSlider(false);
            });
            opSlider.addEventListener('change', (ev) => {
                ev.stopPropagation();
                applyOpacityFromSlider(true);
            });

            item.appendChild(ctrlRow);

            item.addEventListener('click', (e) => {
                if (Date.now() - layerMarqueeJustFinished < 200) return;
                selectLayer(i, e.shiftKey);
            });

            item.addEventListener('dragstart', (e) => {
                if (suppressItemDrag || !item.draggable) {
                    e.preventDefault();
                    return;
                }
                if (e.target && e.target.closest && e.target.closest('.layer-ctrl, .layer-btn, input, select, textarea')) {
                    e.preventDefault();
                    return;
                }
                dragSortSrcIndex = i;
                item.classList.add('dragging');
                try {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', 'layer-sort:' + i);
                } catch (err) {}
            });

            item.addEventListener('dragover', (e) => {
                if (dragSortSrcIndex < 0 || dragSortSrcIndex === i) return;
                e.preventDefault(); e.stopPropagation();
                try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}

                const rect = item.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                const wantCls = before ? 'drop-above' : 'drop-below';
                if (item.classList.contains(wantCls)) return;

                const marked = layerList.querySelectorAll('.layer-item.drop-above, .layer-item.drop-below');
                for (let k = 0; k < marked.length; k++) {
                    if (marked[k] !== item) marked[k].classList.remove('drop-above', 'drop-below');
                }
                item.classList.remove('drop-above', 'drop-below');
                item.classList.add(wantCls);
            });

            item.addEventListener('dragleave', (e) => {
                if (item.contains(e.relatedTarget)) return;
                item.classList.remove('drop-above', 'drop-below');
            });

            item.addEventListener('drop', (e) => {
                if (dragSortSrcIndex < 0) return;
                e.preventDefault(); e.stopPropagation();
                item.classList.remove('drop-above', 'drop-below');
                const rect = item.getBoundingClientRect();
                const before = (e.clientY - rect.top) < rect.height / 2;
                const src = dragSortSrcIndex;
                dragSortSrcIndex = -1;
                layerList.querySelectorAll('.layer-item').forEach(el => {
                    el.classList.remove('dragging', 'drop-above', 'drop-below');
                });
                moveLayerToPosition(src, i, before);
            });

            item.addEventListener('dragend', () => {
                dragSortSrcIndex = -1;
                layerList.querySelectorAll('.layer-item').forEach(el => {
                    el.classList.remove('dragging', 'drop-above', 'drop-below');
                });
            });

            layerList.appendChild(item);
        }
        layerList.scrollTop = savedScrollTop;
    }

    document.addEventListener('dragend', function() {
        if (dragSortSrcIndex < 0) return;
        dragSortSrcIndex = -1;
        layerList.querySelectorAll('.layer-item').forEach(el => {
            el.classList.remove('dragging', 'drop-above', 'drop-below');
        });
    });

    function startRenameLayer(index, nameEl) {
        const layer = layers[index];
        if (!layer) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = layer.name;
        nameEl.textContent = '';
        nameEl.appendChild(input);
        input.focus(); input.select();

        let finished = false;
        const finish = () => {
            if (finished) return;
            finished = true;
            const newName = (input.value || '').trim() || layer.name;
            renameLayer(index, newName);
        };
        input.addEventListener('blur', finish);
        input.addEventListener('keydown', (ev) => {
            ev.stopPropagation();
            if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
            if (ev.key === 'Escape') { ev.preventDefault(); input.value = layer.name; input.blur(); }
        });
        input.addEventListener('mousedown', (ev) => ev.stopPropagation());
        input.addEventListener('click', (ev) => ev.stopPropagation());
        input.addEventListener('dblclick', (ev) => ev.stopPropagation());
    }

    // ========== 历史记录 ==========
    function serializeLayers() {
        return layers.map(l => {
            let imgData = null;
            if (l.img) {
                if (typeof l.img.src === 'string' && l.img.src.indexOf('data:') === 0) {
                    imgData = l.img.src;
                } else {
                    try {
                        const tc = document.createElement('canvas');
                        tc.width = l.img.naturalWidth || l.img.width;
                        tc.height = l.img.naturalHeight || l.img.height;
                        const tctx = tc.getContext('2d');
                        tctx.drawImage(l.img, 0, 0);
                        imgData = tc.toDataURL('image/png');
                    } catch (err) { imgData = null; }
                }
            }
            return {
                id: l.id, name: l.name, imgData: imgData,
                x: l.x, y: l.y,
                scaleX: l.scaleX, scaleY: l.scaleY,
                visible: l.visible, locked: l.locked, opacity: l.opacity,
                flipX: !!l.flipX, flipY: !!l.flipY,
                rotation: l.rotation || 0,
                hue: l.hue || 0,
                saturation: l.saturation !== undefined ? l.saturation : 100,
                brightness: l.brightness !== undefined ? l.brightness : 100,
                contrast: l.contrast !== undefined ? l.contrast : 100,
                grayscale: l.grayscale || 0,
                sepia: l.sepia || 0,
                invert: l.invert || 0,
                blend: l.blend || 'source-over'
            };
        });
    }

    function saveState(immediate) {
        if (isUndoing) return;
        const state = {
            layers: serializeLayers(),
            activeIndex: activeLayerIndex,
            canvasWidth: canvasWidth,
            canvasHeight: canvasHeight,
            viewScale: viewScale,
            canvasBgColor: canvasBgColor
        };
        if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
        if (history.length >= MAX_HISTORY) { history.shift(); historyIndex--; }
        history.push(state);
        historyIndex = history.length - 1;
        scheduleAutoSave(!!immediate);
    }

    function restoreState(state, onDone) {
        if (!state) return;
        _restoreDoneCallback = onDone || null;
        isUndoing = true;
        canvasWidth = state.canvasWidth || 800;
        canvasHeight = state.canvasHeight || 800;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        viewScale = state.viewScale || 1;

        canvasBgColor = state.canvasBgColor || '#ffffff';
        bgColorInput.value = canvasBgColor;
        canvas.style.background = canvasBgColor;

        invalidateCanvasRectCache();
        updateCanvasDisplaySize();
        updateViewZoomBadge();
        widthInput.value = canvasWidth;
        heightInput.value = canvasHeight;
        lastValidWidth = canvasWidth;
        lastValidHeight = canvasHeight;

        const restoredLayers = [];
        let loadedCount = 0;
        const total = state.layers.length;

        if (total === 0) {
            layers = [];
            activeLayerIndex = -1;
            selectedIndices.clear();
            isUndoing = false;
            renderAll(); renderOverlay(); renderLayerPanel();
            if (_restoreDoneCallback) {
                const cb = _restoreDoneCallback; _restoreDoneCallback = null;
                try { cb(); } catch (e) {}
            }
            return;
        }

        state.layers.forEach((ls, idx) => {
            const finishOne = () => {
                loadedCount++;
                if (loadedCount === total) finishRestore(restoredLayers, state);
            };
            if (ls.imgData) {
                const image = new Image();
                image.onload = () => {
                    const sx = ls.scaleX !== undefined ? ls.scaleX : 1;
                    const sy = ls.scaleY !== undefined ? ls.scaleY : 1;
                    restoredLayers[idx] = {
                        id: ls.id, name: ls.name, img: image,
                        x: ls.x, y: ls.y,
                        scaleX: sx, scaleY: sy,
                        visible: ls.visible,
                        locked: ls.locked !== undefined ? ls.locked : false,
                        opacity: ls.opacity !== undefined ? ls.opacity : 1,
                        flipX: !!ls.flipX, flipY: !!ls.flipY,
                        rotation: ls.rotation || 0,
                        hue: ls.hue || 0,
                        saturation: ls.saturation !== undefined ? ls.saturation : 100,
                        brightness: ls.brightness !== undefined ? ls.brightness : 100,
                        contrast: ls.contrast !== undefined ? ls.contrast : 100,
                        grayscale: ls.grayscale || 0,
                        sepia: ls.sepia || 0,
                        invert: ls.invert || 0,
                        blend: ls.blend || 'source-over'
                    };
                    finishOne();
                };
                image.onerror = () => { restoredLayers[idx] = null; finishOne(); };
                image.src = ls.imgData;
            } else {
                restoredLayers[idx] = null;
                finishOne();
            }
        });
    }

    function finishRestore(restoredLayers, state) {
        layers = restoredLayers.filter(Boolean);
        activeLayerIndex = Math.min(state.activeIndex, layers.length - 1);
        if (activeLayerIndex < 0 && layers.length > 0) activeLayerIndex = 0;
        selectedIndices.clear();
        if (activeLayerIndex >= 0) selectedIndices.add(activeLayerIndex);
        isUndoing = false;
        renderAll(); renderOverlay(); renderLayerPanel();
        if (_restoreDoneCallback) {
            const cb = _restoreDoneCallback; _restoreDoneCallback = null;
            try { cb(); } catch (e) { console.warn(e); }
        }
    }

    function undo() {
        if (historyIndex > 0) {
            historyIndex--;
            restoreState(history[historyIndex]);
            showToast('已撤销');
        } else {
            showToast('没有更多可撤销的操作');
        }
    }

    function redo() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            restoreState(history[historyIndex]);
            showToast('已重做');
        } else {
            showToast('没有更多可重做的操作');
        }
    }

    // ========== 自动保存 ==========
    const DB_NAME = 'canvas-tool-db';
    const DB_STORE = 'projects';
    const AUTOSAVE_KEY = 'autosave';
    let dbPromise = null;

    function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
            if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
        return dbPromise;
    }

    async function autoSaveNow() {
        if (autoSavePaused) return;
        try {
            const db = await openDB();
            const state = {
                version: 1,
                savedAt: Date.now(),
                canvasWidth: canvasWidth,
                canvasHeight: canvasHeight,
                canvasBgColor: canvasBgColor,
                viewScale: viewScale,
                activeIndex: activeLayerIndex,
                layers: serializeLayers()
            };
            await new Promise((res, rej) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(state, AUTOSAVE_KEY);
                tx.oncomplete = res;
                tx.onerror = () => rej(tx.error);
                tx.onabort = () => rej(tx.error);
            });
        } catch (e) {
            console.warn('[autoSave]', e && e.message);
        }
    }

    function scheduleAutoSave(immediate) {
        if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
        if (immediate) { autoSaveNow(); return; }
        autoSaveTimer = setTimeout(() => { autoSaveTimer = null; autoSaveNow(); }, 800);
    }

    function flushAutoSave() {
        if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
        autoSaveNow();
    }

    window.addEventListener('pagehide', flushAutoSave);
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') flushAutoSave();
    });

    async function loadAutoSave() {
        try {
            const db = await openDB();
            const state = await new Promise((res, rej) => {
                const tx = db.transaction(DB_STORE, 'readonly');
                const req = tx.objectStore(DB_STORE).get(AUTOSAVE_KEY);
                req.onsuccess = () => res(req.result);
                req.onerror = () => rej(req.error);
            });
            return state || null;
        } catch (e) {
            return null;
        }
    }

    // ========== 画布尺寸 ==========
    linkAspectBtn.addEventListener('click', () => {
        isAspectLocked = !isAspectLocked;
        linkAspectBtn.classList.toggle('active', isAspectLocked);
        linkAspectBtn.innerHTML = isAspectLocked ? ICON_LINK_LOCKED : ICON_LINK_UNLOCKED;
        linkAspectBtn.title = isAspectLocked ? '解锁宽高比例' : '锁定宽高比例';
        if (isAspectLocked) {

    let canvasResizeTimer = null;
    function handleCanvasResize() {
        if (canvasResizeTimer) clearTimeout(canvasResizeTimer);
        canvasResizeTimer = setTimeout(() => {
            let w = parseInt(widthInput.value);
            let h = parseInt(heightInput.value);
            if (isNaN(w) || isNaN(h) || w < 100 || w > 4000 || h < 100 || h > 4000) return;
            if (w === canvasWidth && h === canvasHeight) return;

            if (isAspectLocked) {
                if (document.activeElement === widthInput) {
                    h = Math.round(w * (lastValidHeight / lastValidWidth));
                    h = Math.min(Math.max(h, 100), 4000);
                    heightInput.value = h;
                } else if (document.activeElement === heightInput) {
                    w = Math.round(h * (lastValidWidth / lastValidHeight));
                    w = Math.min(Math.max(w, 100), 4000);
                    widthInput.value = w;
                }
            }

            canvasWidth = w; canvasHeight = h;
            lastValidWidth = w; lastValidHeight = h;
            canvas.width = w; canvas.height = h;
            invalidateCanvasRectCache();

            updateCanvasDisplaySize();
            renderAll(); renderOverlay(); saveState();
            centerCanvasInView();
        }, 200);
    }

    widthInput.addEventListener('input', handleCanvasResize);
    heightInput.addEventListener('input', handleCanvasResize);
    widthInput.addEventListener('blur', function() {
        let w = parseInt(this.value);
        if (isNaN(w) || w < 100 || w > 4000) this.value = canvasWidth;
    });
    heightInput.addEventListener('blur', function() {
