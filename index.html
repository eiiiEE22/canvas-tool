<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>画布工具 · 多图层版</title>
<style>
    :root{ --radius:10px; }

    html[data-theme="light"]{
        --bg:#f4f4f5; --surface:#ffffff; --surface-2:#fafafa;
        --border:#e4e4e7; --border-strong:#d4d4d8;
        --text:#18181b; --text-2:#52525b; --text-3:#a1a1aa;
        --hover:#f4f4f5; --hover-2:#ebebed; --active-bg:#e4e4e7;
        --accent:#18181b; --accent-hover:#2f2f33; --accent-text:#ffffff;
        --warn:#d97706; --warn-bg:#fffbeb; --warn-bg-hover:#fef7e6;
        --warn-bg-active:#fdf3dd; --warn-border:#fcd9a0; --warn-text:#92400e;
        --warn-chip:#fef3c7; --warn-chip-hover:#fde68a;
        --danger:#dc2626; --danger-bg:#fef2f2; --danger-border:#fecaca;
        --sel-bg:#eff4ff; --sel-ring:#a8c3ff; --sel-accent:#2563eb; --sel-text:#1d4ed8;
        --grid-line:#f1f1f2; --thumb-bg:#ffffff; --input-bg:#ffffff;
        --modal-overlay:rgba(24,24,27,.35);
        --kbd-bg:#fafafa; --kbd-text:#52525b;
        --range-track:#e4e4e7; --range-thumb-border:#ffffff;
        --scrollbar:#d4d4d8; --scrollbar-hover:#b8b8bd;
        --shadow-app:0 1px 2px rgba(0,0,0,.03), 0 12px 32px rgba(0,0,0,.05);
        --shadow-sm:0 1px 3px rgba(0,0,0,.06);
        --shadow-menu:0 2px 6px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.10);
        --shadow-menu-drag:0 4px 10px rgba(0,0,0,.07), 0 20px 44px rgba(0,0,0,.16);
        --shadow-panel:0 4px 12px rgba(0,0,0,.07), 0 20px 48px rgba(0,0,0,.14);
        --shadow-modal:0 24px 60px rgba(0,0,0,.18);
        --shadow-toast:0 8px 24px rgba(0,0,0,.18);
        --outline-selected:#18181b; --snap-line:#ec4899;
    }

    html[data-theme="dark"]{
        --bg:#18181b; --surface:#1e1e1e; --surface-2:#141414;
        --border:#2d2d2d; --border-strong:#3f3f46;
        --text:#e4e4e7; --text-2:#a1a1aa; --text-3:#71717a;
        --hover:#2d2d2d; --hover-2:#3f3f46; --active-bg:#3f3f46;
        --accent:#ffffff; --accent-hover:#e4e4e7; --accent-text:#18181b;
        --warn:#fbbf24; --warn-bg:rgba(251,191,36,.10);
        --warn-bg-hover:rgba(251,191,36,.16); --warn-bg-active:rgba(251,191,36,.20);
        --warn-border:#78350f; --warn-text:#fcd34d;
        --warn-chip:rgba(251,191,36,.18); --warn-chip-hover:rgba(251,191,36,.28);
        --danger:#f87171; --danger-bg:rgba(248,113,113,.10);
        --danger-border:rgba(248,113,113,.35);
        --sel-bg:rgba(96,165,250,.14); --sel-ring:rgba(96,165,250,.40);
        --sel-accent:#60a5fa; --sel-text:#93c5fd;
        --grid-line:rgba(255,255,255,.05); --thumb-bg:#18181b; --input-bg:#18181b;
        --modal-overlay:rgba(0,0,0,.6);
        --kbd-bg:#18181b; --kbd-text:#a1a1aa;
        --range-track:#3f3f46; --range-thumb-border:#1e1e1e;
        --scrollbar:#3f3f46; --scrollbar-hover:#52525b;
        --shadow-app:0 12px 40px rgba(0,0,0,.6);
        --shadow-sm:0 4px 16px rgba(0,0,0,.35);
        --shadow-menu:0 10px 30px rgba(0,0,0,.7);
        --shadow-menu-drag:0 18px 44px rgba(0,0,0,.85);
        --shadow-panel:0 10px 30px rgba(0,0,0,.7);
        --shadow-modal:0 20px 60px rgba(0,0,0,.8);
        --shadow-toast:0 8px 24px rgba(0,0,0,.5);
        --outline-selected:#ffffff; --snap-line:#f472b6;
    }

    *, *::before, *::after{
        box-sizing:border-box; margin:0; padding:0;
        transition: background-color .22s ease, border-color .22s ease, color .22s ease, box-shadow .22s ease;
    }

    body{
        background:var(--bg);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
        color:var(--text);
        display:flex; justify-content:center; align-items:center;
        min-height:100vh; padding:20px;
        -webkit-font-smoothing:antialiased;
    }

    .app{
        background:var(--surface);
        border:1px solid var(--border); border-radius:16px;
        padding:18px 20px 14px;
        max-width:1400px; width:100%; max-height:95vh;
        display:flex; flex-direction:column;
        box-shadow:var(--shadow-app);
    }

    .toolbar{
        display:flex; flex-wrap:wrap; align-items:center; gap:6px;
        padding-bottom:14px; border-bottom:1px solid var(--border);
        flex-shrink:0;
    }
    .tool-group{ display:flex; align-items:center; gap:2px; }
    .toolbar .sep{ width:1px; height:20px; background:var(--border); margin:0 6px; }
    .field{
        display:inline-flex; align-items:center; gap:6px;
        font-size:12px; color:var(--text-2); margin-right:4px;
    }
    .field input[type="number"]{
        width:66px; padding:5px 8px;
        border:1px solid var(--border); border-radius:6px;
        background:var(--input-bg); color:var(--text);
        font-size:12.5px; font-family:inherit; outline:none;
    }
    .field input[type="number"]:focus{ border-color:var(--accent); }

    .field input[type="color"]{
        width:30px; height:26px; padding:2px;
        border:1px solid var(--border); border-radius:6px;
        background:var(--input-bg); cursor:pointer;
    }
    .field input[type="color"]:hover{ border-color:var(--border-strong); }

    .btn{
        display:inline-flex; align-items:center; justify-content:center; gap:7px;
        height:32px; padding:0 12px;
        border:none; background:transparent; color:var(--text-2);
        border-radius:8px; font-size:12.5px; font-family:inherit;
        cursor:pointer; white-space:nowrap;
        transition:background .15s ease, color .15s ease;
    }
    .btn svg{
        width:16px; height:16px; flex-shrink:0;
        stroke:currentColor; stroke-width:1.8; fill:none;
        stroke-linecap:round; stroke-linejoin:round;
    }
    .btn:hover{ background:var(--hover); color:var(--text); }
    .btn.active{ background:var(--active-bg); color:var(--text); }
    .btn.danger{ color:var(--text-2); }
    .btn.danger:hover{ background:var(--danger-bg); color:var(--danger); }
    .btn.primary{
        background:var(--accent); color:var(--accent-text); padding:0 16px;
    }
    .btn.primary:hover{ background:var(--accent-hover); }
    .btn.primary svg{ stroke:var(--accent-text); }
    .btn.theme-toggle{ padding:0 10px; }
    .btn.theme-toggle .theme-label{ font-size:12px; }

    .icon-btn{
        width:26px; height:26px;
        display:flex; align-items:center; justify-content:center;
        border:1px solid var(--border); background:var(--surface);
        border-radius:7px; color:var(--text); font-size:16px; line-height:1;
        cursor:pointer;
        transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .icon-btn:hover{ background:var(--hover); border-color:var(--border-strong); }
    .icon-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
    }
    .icon-btn.active:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
    }

    .zoom-control{
        display:flex; align-items:center; gap:8px;
        color:var(--text-2); font-size:12px; margin-left:4px;
    }
    .zoom-control .zoom-name{ font-size:11px; color:var(--text-3); }
    #zoomLabel{
        width:52px; text-align:center;
        background:var(--input-bg); border:1px solid var(--border);
        color:var(--text); border-radius:6px; padding:4px 4px;
        font-size:12px; font-family:inherit; outline:none;
    }
    #zoomLabel:focus{ border-color:var(--accent); }

    input[type="range"]{
        -webkit-appearance:none; appearance:none;
        height:3px; background:var(--range-track);
        border-radius:2px; outline:none; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb{
        -webkit-appearance:none;
        width:14px; height:14px; border-radius:50%;
        background:var(--accent); border:2px solid var(--range-thumb-border);
        box-shadow:0 1px 3px rgba(0,0,0,.25); cursor:pointer;
        transition:transform .12s;
    }
    input[type="range"]::-webkit-slider-thumb:hover{ transform:scale(1.12); }
    input[type="range"]::-moz-range-thumb{
        width:12px; height:12px; border-radius:50%;
        background:var(--accent); border:2px solid var(--range-thumb-border);
        box-shadow:0 1px 3px rgba(0,0,0,.25); cursor:pointer;
    }
    .zoom-control input[type="range"]{ width:96px; }

    .main-area{
        display:flex; gap:14px; flex:1; min-height:0; padding-top:14px;
    }
    .canvas-area{
        flex:1; position:relative; display:flex; min-width:0;
    }
    .canvas-wrapper{
        flex:1;
        background:var(--surface-2);
        border:1px solid var(--border); border-radius:12px;
        overflow:auto; position:relative; min-height:400px;
        scrollbar-gutter: stable;
        font-size:0;
        overscroll-behavior: contain;
    }
    .canvas-wrapper.panning,
    .canvas-wrapper.panning *{
        cursor: grabbing !important;
        user-select: none;
    }
    .canvas-wrapper.space-pan,
    .canvas-wrapper.space-pan *{
        cursor: grab !important;
    }
    .canvas-stage{
        padding: 400px;
        line-height:0;
        display: inline-block;
    }
    .canvas-inner{
        position:relative; display:inline-block; line-height:0;
    }
    canvas#mainCanvas{
        display:block;
        background:#ffffff;
        border-radius:2px;
        box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
        cursor:grab;
        touch-action: pan-x pan-y;
    }
    canvas#mainCanvas:active{ cursor:grabbing; }
    .transform-svg{
        position:absolute;
        left:0; top:0;
        pointer-events:none;
        overflow:visible;
        z-index:2;
    }

    .view-zoom-badge{
        position:absolute; bottom:14px; right:14px;
        background:var(--surface);
        border:1px solid var(--border);
        padding:4px 10px; border-radius:6px;
        font-size:11.5px; color:var(--text-2);
        font-variant-numeric:tabular-nums;
        pointer-events:none;
        box-shadow:var(--shadow-sm);
        z-index:5;
    }

    .mouse-hint{
        position: absolute;
        bottom: 14px;
        left: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 10.5px;
        color: var(--text-2);
        pointer-events: none;
        box-shadow: var(--shadow-sm);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        max-width: 90%;
        transition: opacity 0.35s ease;
    }
    .mouse-hint.dimmed { opacity: 0.14; }
    .mouse-hint span{
        display: inline-flex; align-items: center; gap: 3px;
        white-space: nowrap;
    }
    .mouse-hint kbd{
        display: inline-block; padding: 1px 4px;
        border: 1px solid var(--border); border-bottom-width: 2px;
        border-radius: 4px; background: var(--kbd-bg); color: var(--kbd-text);
        font-size: 9.5px; font-family: inherit; line-height: 1.3;
    }

    .shortcut-hint {
        position: absolute;
        bottom: 52px;
        left: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11.5px;
        color: var(--text-2);
        pointer-events: none;
        box-shadow: var(--shadow-sm);
        z-index: 5;
        opacity: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .shortcut-hint kbd {
        display: inline-block; padding: 1px 5px;
        border: 1px solid var(--border); border-bottom-width: 2px;
        border-radius: 4px; background: var(--kbd-bg); color: var(--kbd-text);
        font-size: 10px; font-family: inherit; line-height: 1.4;
    }

    .layer-panel{
        width:280px; background:var(--surface);
        border:1px solid var(--border); border-radius:12px;
        display:flex; flex-direction:column; overflow:hidden; flex-shrink:0;
        position:relative;
    }
    .panel-header{
        display:flex; justify-content:space-between; align-items:center;
        padding:11px 12px; border-bottom:1px solid var(--border);
        color:var(--text); font-size:12.5px; font-weight:600; letter-spacing:.02em;
    }
    .layer-list{ flex:1; overflow-y:auto; padding:6px; user-select:none; position:relative; }

    .layer-item{
        position:relative;
        display:flex; flex-direction:column;
        gap:6px;
        padding:8px 8px 8px 6px;
        border-radius:8px; cursor:pointer;
        border-left:3px solid transparent; margin-bottom:4px;
    }
    .layer-item:hover{ background:var(--hover); }

    .layer-item.selected{
        background:var(--sel-bg);
        border-left-color:var(--sel-accent);
        box-shadow:inset 0 0 0 1px var(--sel-ring);
    }
    .layer-item.selected .layer-name{
        color:var(--sel-text);
        font-weight:500;
    }
    .layer-item.active{
        background:var(--active-bg);
        border-left-color:var(--accent);
        box-shadow:inset 0 0 0 1px var(--border-strong);
    }
    .layer-item.active.selected{
        background:var(--sel-bg);
        border-left-color:var(--sel-accent);
        box-shadow:inset 0 0 0 2px var(--sel-accent);
    }

    .layer-item.locked{ border-left-color:var(--warn); background:var(--warn-bg); }
    .layer-item.locked:hover{ background:var(--warn-bg-hover); }
    .layer-item.locked.selected,
    .layer-item.locked.active{
        background:var(--warn-bg-active);
        box-shadow:inset 0 0 0 1.5px var(--warn-border);
    }
    .layer-item.locked.active{ border-left-color:var(--warn); }

    .layer-item.dragging{ opacity:.42; }
    .layer-item.drop-above::after,
    .layer-item.drop-below::after{
        content:"";
        position:absolute; left:6px; right:6px; height:2px;
        background:var(--accent); border-radius:2px;
        box-shadow:0 0 0 1px var(--surface);
        pointer-events:none;
    }
    .layer-item.drop-above::after{ top:-1px; }
    .layer-item.drop-below::after{ bottom:-1px; }

    .layer-item .layer-top{
        display:flex; align-items:center; gap:8px; min-width:0;
    }

    .layer-item .layer-thumb{
        width:36px; height:36px; border-radius:6px;
        background:var(--thumb-bg); border:1px solid var(--border);
        object-fit:contain; flex-shrink:0;
        pointer-events:none;
    }
    .layer-item.locked .layer-thumb{
        border-color:var(--warn-border);
        filter:grayscale(.65) brightness(.92);
    }
    .layer-item .layer-name{
        flex:1; color:var(--text); font-size:12.5px;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        min-width:0;
    }
    .layer-item.locked .layer-name{ color:var(--warn-text); }
    .layer-item .layer-name input{
        width:100%; background:var(--input-bg);
        border:1px solid var(--accent); border-radius:5px;
        color:var(--text); font-size:12.5px; font-family:inherit;
        padding:2px 5px; outline:none;
    }
    .layer-item .layer-btn{
        background:transparent; border:none; color:var(--text-3);
        cursor:pointer; padding:0; border-radius:6px;
        width:24px; height:24px;
        display:flex; align-items:center; justify-content:center;
        flex-shrink:0;
    }
    .layer-item .layer-btn:hover{ background:var(--hover-2); color:var(--text); }
    .layer-item .layer-btn.vis.on{ color:var(--text); }
    .layer-item .layer-btn.lock.on{
        color:var(--warn); background:var(--warn-chip);
    }
    .layer-item .layer-btn.lock.on:hover{ background:var(--warn-chip-hover); }

    .layer-item .layer-ctrl{
        display:flex; align-items:center; gap:6px;
        padding-left:44px;
        cursor:default;
    }

    .layer-item .layer-blend{
        flex:0 0 auto;
        width:74px; height:22px;
        padding:0 18px 0 6px;
        border:1px solid var(--border); border-radius:5px;
        background-color:var(--input-bg); color:var(--text-2);
        font-size:11px; font-family:inherit; line-height:20px;
        outline:none; cursor:pointer;
        -webkit-appearance:none; -moz-appearance:none; appearance:none;
        background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='9' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
        background-repeat:no-repeat;
        background-position:right 4px center;
        text-overflow:ellipsis;
    }
    .layer-item .layer-blend:hover{ border-color:var(--border-strong); color:var(--text); }
    .layer-item .layer-blend:focus{ border-color:var(--accent); color:var(--text); }
    .layer-item .layer-blend:disabled{ opacity:.5; cursor:not-allowed; }

    .layer-item .layer-opacity{
        flex:1 1 auto; min-width:24px;
        height:16px;
        background:transparent;
        cursor:pointer;
    }
    .layer-item .layer-opacity::-webkit-slider-runnable-track{
        height:3px; border-radius:2px; background:var(--range-track);
    }
    .layer-item .layer-opacity::-moz-range-track{
        height:3px; border-radius:2px; background:var(--range-track);
    }
    .layer-item .layer-opacity::-webkit-slider-thumb{
        -webkit-appearance:none;
        width:12px; height:12px; border-radius:50%;
        background:var(--accent); border:2px solid var(--range-thumb-border);
        box-shadow:0 1px 3px rgba(0,0,0,.25);
        margin-top:-4.5px;
        transition:transform .12s ease;
    }
    .layer-item .layer-opacity::-webkit-slider-thumb:hover{ transform:scale(1.15); }
    .layer-item .layer-opacity::-moz-range-thumb{
        width:10px; height:10px; border-radius:50%;
        background:var(--accent); border:2px solid var(--range-thumb-border);
        box-shadow:0 1px 3px rgba(0,0,0,.25);
    }
    .layer-item .layer-opacity:disabled{ opacity:.5; cursor:not-allowed; }

    .layer-item .layer-opacity-val{
        flex:0 0 34px;
        text-align:right;
        font-size:10.5px; color:var(--text-3);
        font-variant-numeric:tabular-nums;
    }
    .layer-item.locked .layer-blend,
    .layer-item.locked .layer-opacity,
    .layer-item.locked .layer-opacity-val{
        opacity:.55;
    }

    body.layer-painting, body.layer-painting *{ user-select:none !important; }

    .status-bar{
        margin-top:12px; padding-top:10px;
        border-top:1px solid var(--border);
        color:var(--text-3); font-size:11.5px;
        display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
        flex-shrink:0;
    }
    .status-bar span{ display:inline-flex; align-items:center; gap:6px; }

    .context-menu{
        position:fixed; display:none;
        background:var(--surface); border:1px solid var(--border);
        border-radius:10px; padding:6px;
        box-shadow:var(--shadow-menu);
        z-index:3000; min-width:172px; user-select:none;
    }
    .context-menu.active{ display:block; }
    .context-menu.dragging{
        cursor:grabbing; border-color:var(--border-strong);
        box-shadow:var(--shadow-menu-drag);
    }
    .context-menu .menu-drag-bar{
        height:14px; display:flex; align-items:center; justify-content:center;
        cursor:grab; margin-bottom:2px;
    }
    .context-menu .menu-drag-bar::before{
        content:""; width:26px; height:3px; border-radius:2px;
        background:var(--border-strong); transition:background .15s,width .15s;
    }
    .context-menu .menu-drag-bar:hover::before{
        background:var(--text-3); width:34px;
    }
    .context-menu.dragging .menu-drag-bar{ cursor:grabbing; }
    .context-menu.dragging .menu-drag-bar::before{ background:var(--accent); }

    .context-menu .menu-item{
        padding:8px 12px; color:var(--text); font-size:13px;
        border-radius:6px; cursor:pointer; white-space:nowrap;
    }
    .context-menu .menu-item:hover{ background:var(--hover); }
    .context-menu .menu-item.disabled{ color:var(--text-3); cursor:not-allowed; }
    .context-menu .menu-item.disabled:hover{ background:transparent; }
    .context-menu .divider{ height:1px; background:var(--border); margin:4px 6px; }

    .hue-panel{
        position:fixed; display:none;
        background:var(--surface); border:1px solid var(--border);
        border-radius:12px; padding:16px;
        box-shadow:var(--shadow-panel); z-index:3100; width:276px;
    }
    .hue-panel.active{ display:block; }
    .hue-panel h4{
        color:var(--text); font-size:12.5px; font-weight:600;
        letter-spacing:.02em; text-align:center;
        cursor:grab;
        user-select:none;
        margin:-4px -4px 6px;
        padding:10px 4px 10px;
        border-radius:8px;
        transition:background-color .15s ease;
    }
    .hue-panel h4:hover{ background:var(--hover); }
    .hue-panel h4::before{
        content:"";
        display:block;
        width:26px; height:3px; border-radius:2px;
        background:var(--border-strong);
        margin:0 auto 6px;
        transition:background .15s, width .15s;
    }
    .hue-panel h4:hover::before{ background:var(--text-3); width:34px; }
    .hue-panel.dragging h4::before{ background:var(--accent); width:34px; }
    .hue-panel.dragging h4{ cursor:grabbing; }
    .hue-panel.dragging{
        border-color:var(--border-strong);
        box-shadow:0 6px 16px rgba(0,0,0,.10), 0 22px 52px rgba(0,0,0,.18);
    }
    .hue-panel .field{ margin-bottom:14px; display:block; }
    .hue-panel label{
        display:flex; justify-content:space-between;
        color:var(--text-2); font-size:11.5px; margin-bottom:7px;
    }
    .hue-panel label span{ color:var(--text); font-variant-numeric:tabular-nums; }
    .hue-panel input[type="range"]{ width:100%; }

    .hue-panel .gradient-bar{
        position:relative;
        height:9px;
        border-radius:5px;
        margin-top:8px;
        border:1px solid var(--border);
        box-shadow:inset 0 1px 2px rgba(0,0,0,.07);
    }
    .hue-panel .gradient-marker{
        position:absolute;
        top:50%;
        width:13px; height:13px;
        border-radius:50%;
        border:2px solid var(--surface);
        box-shadow:0 0 0 1px var(--border-strong), 0 1px 4px rgba(0,0,0,.3);
        transform:translate(-50%, -50%);
        pointer-events:none;
        left:50%;
    }

    .hue-panel .preset-row{
        display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;
    }
    .hue-panel .preset-btn{
        flex:1 1 auto; min-width:56px; height:28px;
        border:1px solid var(--border); border-radius:7px;
        background:var(--surface); color:var(--text-2);
        font-size:11.5px; font-family:inherit; cursor:pointer;
        transition:background .15s, color .15s, border-color .15s;
    }
    .hue-panel .preset-btn:hover{ background:var(--hover); color:var(--text); }
    .hue-panel .preset-btn.on{
        background:var(--accent); border-color:var(--accent);
        color:var(--accent-text);
    }

    .hue-panel .btn-row{ display:flex; gap:8px; margin-top:16px; }
    .hue-panel .btn-row button{
        flex:1; height:32px;
        border:1px solid var(--border); border-radius:8px;
        font-size:12.5px; font-family:inherit; cursor:pointer;
        background:var(--surface); color:var(--text);
    }
    .hue-panel .btn-row button:hover{ background:var(--hover); }
    .hue-panel .btn-row .apply{
        background:var(--accent); border-color:var(--accent);
        color:var(--accent-text);
    }
    .hue-panel .btn-row .apply:hover{
        background:var(--accent-hover); border-color:var(--accent-hover);
    }

    .align-panel{
        position:fixed; display:none;
        background:var(--surface); border:1px solid var(--border);
        border-radius:12px; padding:10px;
        box-shadow:var(--shadow-panel); z-index:3100;
        user-select:none;
    }
    .align-panel.active{ display:block; }
    .align-panel .align-row{ display:flex; gap:4px; margin-bottom:6px; }
    .align-panel .align-row:last-child{ margin-bottom:0; }
    .align-panel .align-btn{
        width:34px; height:34px;
        display:flex; align-items:center; justify-content:center;
        border:1px solid var(--border); background:var(--surface);
        border-radius:8px; color:var(--text-2); cursor:pointer;
    }
    .align-panel .align-btn:hover{
        background:var(--hover); color:var(--text);
        border-color:var(--border-strong);
    }
    .align-panel .align-btn svg{
        width:17px; height:17px; stroke:currentColor; stroke-width:1.7;
        fill:none; stroke-linecap:round; stroke-linejoin:round;
    }
    .align-panel .divider-h{
        height:1px; background:var(--border); margin:6px 2px;
    }

    .modal-overlay{
        display:none; position:fixed; inset:0;
        background:var(--modal-overlay); backdrop-filter:blur(3px);
        z-index:1000; justify-content:center; align-items:center;
    }
    .modal-overlay.active{ display:flex; }
    .modal{
        background:var(--surface); border:1px solid var(--border);
        border-radius:14px; padding:26px 28px;
        max-width:440px; width:90%; color:var(--text);
        box-shadow:var(--shadow-modal); max-height:90vh; overflow-y:auto;
    }
    .modal h3{
        margin-bottom:20px; text-align:center;
        font-size:14px; font-weight:600; letter-spacing:.02em;
    }
    .modal .field{ margin-bottom:14px; }
    .modal label{ display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; }
    .modal input[type="number"], .modal select{
        width:100%; padding:8px 10px; border-radius:8px;
        border:1px solid var(--border); background:var(--input-bg);
        color:var(--text); font-size:13px; font-family:inherit; outline:none;
    }
    .modal input[type="number"]:focus, .modal select:focus{ border-color:var(--accent); }
    .modal input[type="range"]{ width:100%; margin-top:6px; }
    .modal .quality-hint{
        display:flex; justify-content:space-between;
        font-size:11px; color:var(--text-3); margin-top:6px;
    }
    .modal .file-size-wrap{ text-align:center; margin-top:4px; }
    .modal .file-size-display{
        display:inline-block; font-size:12.5px; color:var(--text-2);
        background:var(--hover); padding:5px 14px; border-radius:20px;
        font-variant-numeric:tabular-nums;
    }
    .modal .preview-wrap{
        text-align:center; margin-top:16px; padding-top:16px;
        border-top:1px solid var(--border);
    }
    .modal .preview-wrap label{
        font-size:11.5px; color:var(--text-3); margin-bottom:10px;
    }
    .modal .preview-wrap canvas{
        background:var(--surface-2); border-radius:8px;
        display:block; margin:0 auto; border:1px solid var(--border);
    }
    .modal .preview-wrap .quality-desc{
        font-size:11.5px; color:var(--text-2); margin-top:8px;
    }
    .modal .btn-row{ display:flex; gap:10px; justify-content:center; margin-top:22px; }
    .modal .btn-row button{
        flex:1; height:36px; border:1px solid var(--border);
        border-radius:9px; font-size:13px; font-family:inherit;
        cursor:pointer; background:var(--surface); color:var(--text);
    }
    .modal .btn-row button:hover{ background:var(--hover); }
    .modal .btn-row .confirm{
        background:var(--accent); border-color:var(--accent); color:var(--accent-text);
    }
    .modal .btn-row .confirm:hover{
        background:var(--accent-hover); border-color:var(--accent-hover);
    }

    .shortcuts-modal{ max-width:560px; }
    .shortcuts-modal h3{ margin-bottom:18px; }
    .shortcuts-grid{
        display:grid; grid-template-columns:1fr 1fr; gap:8px 22px;
        font-size:12.5px;
    }
    .shortcuts-grid .shortcut-item{
        display:flex; justify-content:space-between; align-items:center;
        padding:5px 0; border-bottom:1px dashed var(--border);
    }
    .shortcuts-grid .shortcut-item:last-child{ border-bottom:none; }
    .shortcuts-grid .shortcut-item .keys{
        display:flex; gap:4px; flex-shrink:0; margin-left:10px;
    }
    .shortcuts-grid .shortcut-item kbd{
        display:inline-block; padding:1px 6px;
        border:1px solid var(--border); border-bottom-width:2px;
        border-radius:4px; background:var(--kbd-bg); color:var(--kbd-text);
        font-size:10.5px; font-family:inherit; line-height:1.5;
    }

    .toast{
        position:fixed; bottom:56px; left:50%;
        transform:translateX(-50%) translateY(6px);
        background:var(--accent); color:var(--accent-text);
        padding:9px 18px; border-radius:8px; font-size:12.5px;
        box-shadow:var(--shadow-toast); pointer-events:none;
        opacity:0; transition:opacity .25s ease, transform .25s ease;
        z-index:2000; white-space:nowrap;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

    .drop-overlay{
        position:fixed; inset:0; z-index:4000;
        display:none; align-items:center; justify-content:center;
        background:var(--modal-overlay); backdrop-filter:blur(4px);
        pointer-events:none;
    }
    .drop-overlay.active{ display:flex; }
    .drop-overlay .drop-box{
        display:flex; flex-direction:column; align-items:center; gap:10px;
        padding:38px 56px; border-radius:16px;
        border:2px dashed var(--accent);
        background:var(--surface); color:var(--text);
        box-shadow:var(--shadow-panel); text-align:center;
    }
    .drop-overlay .drop-box svg{
        width:36px; height:36px; stroke:var(--accent); fill:none;
        stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
    }
    .drop-overlay .drop-title{ font-size:15px; font-weight:600; }
    .drop-overlay .drop-sub{ font-size:12px; color:var(--text-2); }

    .layer-list::-webkit-scrollbar,
    .canvas-wrapper::-webkit-scrollbar,
    .modal::-webkit-scrollbar{ width:8px; height:8px; }
    .layer-list::-webkit-scrollbar-track,
    .canvas-wrapper::-webkit-scrollbar-track,
    .modal::-webkit-scrollbar-track{ background:transparent; }
    .layer-list::-webkit-scrollbar-thumb,
    .canvas-wrapper::-webkit-scrollbar-thumb,
    .modal::-webkit-scrollbar-thumb{
        background:var(--scrollbar); border-radius:4px;
        border:2px solid transparent; background-clip:content-box;
    }
    .layer-list::-webkit-scrollbar-thumb:hover,
    .canvas-wrapper::-webkit-scrollbar-thumb:hover,
    .modal::-webkit-scrollbar-thumb:hover{
        background:var(--scrollbar-hover); background-clip:content-box;
    }

    .layer-marquee{
        position: fixed;
        display: none;
        pointer-events: none;
        border: 1px dashed var(--sel-accent);
        background: var(--sel-bg);
        border-radius: 3px;
        z-index: 2500;
    }
    .layer-marquee.active{ display: block; }

    .layer-list.marquee-active,
    .layer-list.marquee-active *{
        cursor: crosshair !important;
        user-select: none !important;
        -webkit-user-select: none !important;
    }
</style>
</head>
<body>

<div class="app">
    <header class="toolbar">
        <div class="tool-group" style="gap: 4px;">
            <label class="field" style="margin-right: 0;">宽 <input type="number" id="canvasWidth" value="800" min="100" max="4000" step="10" /></label>
            <button id="linkAspectBtn" class="icon-btn" title="锁定宽高比例" style="width: 28px; height: 28px; padding: 0;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"/><path d="M8 10.5V7.8a4 4 0 017.4-2.2"/></svg>
            </button>
            <label class="field" style="margin-right: 0;">高 <input type="number" id="canvasHeight" value="800" min="100" max="4000" step="10" /></label>
        </div>
        <div class="sep"></div>
        <div class="tool-group">
            <button id="uploadBtn" class="btn">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                上传图片
            </button>
            <button id="resetBtn" class="btn">
                <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                重置位置
            </button>
            <button id="transformBtn" class="btn">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
                自由变换
            </button>
            <button id="undoBtn" class="btn">
                <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg>
                撤销
            </button>
            <button id="redoBtn" class="btn" title="重做 (Ctrl+Shift+Z)">
                <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 014-4h12"/></svg>
                重做
            </button>
            <button id="deleteBtn" class="btn danger">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                删除图层
            </button>
            <button id="alignBtn" class="btn" title="对齐 / 分布 / 网格排列">
                <svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="3" y2="21"/><rect x="7" y="5" width="13" height="5" rx="1.5"/><rect x="7" y="14" width="8" height="5" rx="1.5"/></svg>
                对齐
            </button>
        </div>
        <div class="sep"></div>
        <div class="tool-group">
            <button id="saveBtn" class="btn primary">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出
            </button>
            <button id="projectSaveBtn" class="btn" title="保存为项目文件 (.json)">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                项目
            </button>
            <button id="projectOpenBtn" class="btn" title="打开项目文件">
                <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                打开
            </button>
            <button id="themeToggle" class="btn theme-toggle" title="切换主题"></button>
        </div>
        <div class="sep"></div>
        <div class="zoom-control">
            <span class="zoom-name">图层缩放</span>
            <input type="range" id="zoomSlider" min="10" max="300" value="100" step="1" title="等比缩放当前选中图层" />
            <input type="text" id="zoomLabel" value="100%" title="等比缩放当前选中图层" />
        </div>
        <label class="field" style="margin-right:0; margin-left:8px;" title="画布背景色">
            <span>背景</span>
            <input type="color" id="bgColorInput" value="#ffffff" />
        </label>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" />
        <input type="file" id="projectFileInput" accept="application/json,.json" style="display:none;" />
    </header>

    <div class="main-area">
        <div class="canvas-area">
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="canvas-stage" id="canvasStage">
                    <div class="canvas-inner">
                        <canvas id="mainCanvas"></canvas>
                        <svg class="transform-svg" id="transformSvg" xmlns="http://www.w3.org/2000/svg"></svg>
                    </div>
                </div>
            </div>
            <div class="view-zoom-badge" id="viewZoomBadge">视图 100%</div>
            <div class="mouse-hint" id="mouseHint">
                <span><kbd>左键</kbd>选择/移动</span>
                <span><kbd>空白拖拽</kbd>框选</span>
                <span><kbd>右键</kbd>菜单</span>
                <span><kbd>中键</kbd>平移画布</span>
                <span><kbd>滚轮</kbd>缩放视图</span>
                <span><kbd>双击</kbd>自由变换</span>
            </div>
            <div class="shortcut-hint" id="shortcutHint">空白处拖拽框选 · 双击图层自由变换 · 方向键微调</div>
        </div>

        <aside class="layer-panel">
            <div class="panel-header">
                <span>图层</span>
                <button class="icon-btn" id="addLayerBtn" title="上传图片新建图层">+</button>
            </div>
            <div class="layer-list" id="layerList"></div>
            <div class="layer-marquee" id="layerMarquee"></div>
        </aside>
    </div>

    <footer class="status-bar">
        <span id="sizeInfo">画布 800 × 800</span>
        <span id="posInfo">图层 0 · 未选中</span>
    </footer>
</div>

<div class="context-menu" id="contextMenu">
    <div class="menu-drag-bar" title="按住拖动 · 移动菜单"></div>
    <div class="menu-item" data-action="hue-sat">调整色相 / 饱和度</div>
    <div class="menu-item" data-action="auto-wb">自动白平衡</div>
    <div class="divider"></div>
    <div class="menu-item" data-action="reset-hue">重置所有调整</div>
    <div class="divider"></div>
    <div class="menu-item" data-action="flip-h">水平翻转</div>
    <div class="menu-item" data-action="flip-v">垂直翻转</div>
    <div class="menu-item" data-action="rotate-cw">顺时针旋转 90°</div>
    <div class="menu-item" data-action="rotate-ccw">逆时针旋转 90°</div>
    <div class="divider"></div>
    <div class="menu-item" data-action="duplicate">复制图层</div>
    <div class="menu-item" data-action="raise">上移一层</div>
    <div class="menu-item" data-action="lower">下移一层</div>
    <div class="divider"></div>
    <div class="menu-item" data-action="lock">锁定图层</div>
    <div class="menu-item" data-action="delete">删除图层</div>
</div>

<div class="align-panel" id="alignPanel">
    <div class="align-row">
        <button class="align-btn" data-align="left" title="左对齐">
            <svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="3" y2="21"/><rect x="7" y="5" width="13" height="5" rx="1.5"/><rect x="7" y="14" width="8" height="5" rx="1.5"/></svg>
        </button>
        <button class="align-btn" data-align="center-h" title="水平居中">
            <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><rect x="5" y="5" width="14" height="5" rx="1.5"/><rect x="8" y="14" width="8" height="5" rx="1.5"/></svg>
        </button>
        <button class="align-btn" data-align="right" title="右对齐">
            <svg viewBox="0 0 24 24"><line x1="21" y1="3" x2="21" y2="21"/><rect x="4" y="5" width="13" height="5" rx="1.5"/><rect x="9" y="14" width="8" height="5" rx="1.5"/></svg>
        </button>
    </div>
    <div class="align-row">
        <button class="align-btn" data-align="top" title="顶部对齐">
            <svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="21" y2="3"/><rect x="5" y="7" width="5" height="13" rx="1.5"/><rect x="14" y="7" width="5" height="8" rx="1.5"/></svg>
        </button>
        <button class="align-btn" data-align="middle" title="垂直居中">
            <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><rect x="5" y="5" width="5" height="14" rx="1.5"/><rect x="14" y="8" width="5" height="8" rx="1.5"/></svg>
        </button>
        <button class="align-btn" data-align="bottom" title="底部对齐">
            <svg viewBox="0 0 24 24"><line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="4" width="5" height="13" rx="1.5"/><rect x="14" y="9" width="5" height="8" rx="1.5"/></svg>
        </button>
    </div>
    <div class="divider-h"></div>
    <div class="align-row">
        <button class="align-btn" data-align="dist-h" title="水平分布（需 3 个以上图层）">
            <svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="3" y2="21"/><line x1="21" y1="3" x2="21" y2="21"/><rect x="10" y="7" width="4" height="10" rx="1"/></svg>
        </button>
        <button class="align-btn" data-align="dist-v" title="垂直分布（需 3 个以上图层）">
            <svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="21" y2="3"/><line x1="3" y1="21" x2="21" y2="21"/><rect x="7" y="10" width="10" height="4" rx="1"/></svg>
        </button>
        <button class="align-btn" data-align="grid" title="网格分布 · 田字格（需 2 个以上图层，自动铺满画布）">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.4"/><rect x="13" y="3" width="8" height="8" rx="1.4"/><rect x="3" y="13" width="8" height="8" rx="1.4"/><rect x="13" y="13" width="8" height="8" rx="1.4"/></svg>
        </button>
    </div>
</div>

<div class="hue-panel" id="huePanel">
    <h4>颜色 / 影调调整</h4>
    <div class="field">
        <label>色相旋转 <span id="hueValue">0°</span></label>
        <input type="range" id="hueSlider" min="-180" max="180" value="0" step="1" />
        <div class="gradient-bar" id="hueBar"><span class="gradient-marker" id="hueMarker"></span></div>
    </div>
    <div class="field">
        <label>饱和度 <span id="satValue">100%</span></label>
        <input type="range" id="satSlider" min="0" max="300" value="100" step="1" />
        <div class="gradient-bar" id="satBar"><span class="gradient-marker" id="satMarker"></span></div>
    </div>
    <div class="field">
        <label>亮度 <span id="briValue">100%</span></label>
        <input type="range" id="briSlider" min="0" max="200" value="100" step="1" />
        <div class="gradient-bar" id="briBar"><span class="gradient-marker" id="briMarker"></span></div>
    </div>
    <div class="field">
        <label>对比度 <span id="conValue">100%</span></label>
        <input type="range" id="conSlider" min="0" max="250" value="100" step="1" />
        <div class="gradient-bar" id="conBar"><span class="gradient-marker" id="conMarker"></span></div>
    </div>
    <div class="field" style="margin-bottom:8px;">
        <label>快捷预设</label>
        <div class="preset-row">
            <button class="preset-btn" data-preset="none">原图</button>
            <button class="preset-btn" data-preset="bw">黑白</button>
            <button class="preset-btn" data-preset="sepia">复古</button>
            <button class="preset-btn" data-preset="invert">反色</button>
            <button class="preset-btn" data-preset="punch">浓郁</button>
        </div>
    </div>

    // ========== 动态留白 ==========
    let stagePadX = 400, stagePadY = 400;
    function updateCanvasPadding() {
        const cw = canvasWidth * viewScale;
        const ch = canvasHeight * viewScale;
        const vw = canvasWrapper.clientWidth || 400;
        const vh = canvasWrapper.clientHeight || 400;

    // ========== 主题 ==========

        if (!cssCache[name]) {
            cssCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    function applyTheme(theme) {

    function initTheme() {

        try { saved = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}

        applyTheme(cur === 'dark' ? 'light' : 'dark');
    });

    // ========== 状态 ==========
    let layers = [];
    let activeLayerIndex = -1;
    let selectedIndices = new Set();
    let canvasWidth = 800, canvasHeight = 800;
    let viewScale = 1;
    let canvasBgColor = '#ffffff';

    let isAspectLocked = false;
    let lastValidWidth = 800;
    let lastValidHeight = 800;

    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let dragLayerStartX = 0, dragLayerStartY = 0;
    let dragMembers = [];

    let snapLines = [];

    let transformMode = false;

    let transformDragIndex = -1;
    let transformDragMode = null;
    let transformStartState = null;
    let transformEntryHistoryIndex = -1;

    let menuDragMoved = false;
    let menuDragStartX = 0, menuDragStartY = 0;
    let menuStartLeft = 0, menuStartTop = 0;
    let menuDragEndTime = 0;

    let hueOriginalState = null;

    let history = [];
    let historyIndex = -1;
    let isUndoing = false;
    let _restoreDoneCallback = null;

    let wheelSaveTimer = null;
    let nudgeSaveTimer = null;

    let dragSortSrcIndex = -1;
    let suppressItemDrag = false;

    let layerMarqueeStart = null;
    let layerMarqueeCurrent = null;
    let layerMarqueeMoved = false;

    // ========== 工具函数 ==========
    let toastTimer = null;
    function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    const DEFAULT_HINT = '空白处拖拽框选 · 双击图层自由变换 · 方向键微调';
    let lastHintText = DEFAULT_HINT;

    function showShortcutHint(text) {

    function hideShortcutHint() {
