    // ========== 图片加载 ==========
    function readImageFromFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error('图片解码失败'));
                image.src = e.target.result;
            };
            reader.onerror = () => reject(new Error('文件读取失败'));
            reader.readAsDataURL(file);
        });
    }

    function nameFromFile(file) {
        let n = (file && file.name ? file.name : '').replace(/\.[^.]+$/, '').trim();
        if (!n) return null;
        if (n.length > 24) n = n.slice(0, 24) + '…';
        return n;
    }

    function loadImageFile(file) {
        readImageFromFile(file).then(img => {
            addImageAsLayer(img, nameFromFile(file));
            showToast('已添加新图层');
        }).catch(() => showToast('图片加载失败'));
    }

    async function pasteFromClipboard() {
        try {
            if (!navigator.clipboard || !navigator.clipboard.read) {
                alert('您的浏览器不支持剪贴板读取功能，请使用"上传图片"按钮。');
                return;
            }
            const items = await navigator.clipboard.read();
            for (const item of items) {
                const imageTypes = item.types.filter(t => t.startsWith('image/'));
                if (imageTypes.length > 0) {
                    const type = imageTypes.find(t => t === 'image/png') || imageTypes[0];
                    const blob = await item.getType(type);
                    if (blob) {
                        const file = new File([blob], 'clipboard.png', { type: blob.type });
                        loadImageFile(file);
                        return;
                    }
                }
            }
            alert('剪贴板中没有图片数据。请先复制一张图片。');
        } catch (err) {
            console.error(err);
            alert('读取剪贴板失败，请确认已授予权限。\n' + err.message);
        }
    }

    // ========== 自动白平衡 ==========
    function computeWhiteBalanceImage(srcImg) {
        return new Promise((resolve) => {
            try {
                const w = srcImg.naturalWidth || srcImg.width;
                const h = srcImg.naturalHeight || srcImg.height;
                if (!w || !h) { resolve(null); return; }

                const MAX_DIM = 3200;
                let cw = w, ch = h;
                if (Math.max(w, h) > MAX_DIM) {
                    const k = MAX_DIM / Math.max(w, h);
                    cw = Math.max(1, Math.round(w * k));
                    ch = Math.max(1, Math.round(h * k));
                }

                const c = document.createElement('canvas');
                c.width = cw;
                c.height = ch;
                const cx = c.getContext('2d', { willReadFrequently: true });
                if (!cx) { resolve(null); return; }
                cx.drawImage(srcImg, 0, 0, cw, ch);

                let imgData;
                try {
                    imgData = cx.getImageData(0, 0, cw, ch);
                } catch (err) {
                    console.warn('[WB] getImageData failed', err);
                    resolve(null); return;
                }

                const d = imgData.data;
                const total = cw * ch;
                const step = Math.max(1, Math.floor(Math.sqrt(total / 25000)));

                let rSum = 0, gSum = 0, bSum = 0, n = 0;
                for (let y = 0; y < ch; y += step) {
                    const rowBase = y * cw;
                    for (let x = 0; x < cw; x += step) {
                        const i = (rowBase + x) * 4;
                        if (d[i + 3] < 8) continue;
                        rSum += d[i]; gSum += d[i + 1]; bSum += d[i + 2];
                        n++;
                    }
                }
                if (!n) { resolve(null); return; }

                const rAvg = rSum / n, gAvg = gSum / n, bAvg = bSum / n;
                const gray = (rAvg + gAvg + bAvg) / 3;
                if (gray < 2 || gray > 253) { resolve(null); return; }

                const MAX_G = 1.75, MIN_G = 0.58;
                let rG = gray / Math.max(rAvg, 1);
                let gG = gray / Math.max(gAvg, 1);
                let bG = gray / Math.max(bAvg, 1);
                rG = Math.min(Math.max(rG, MIN_G), MAX_G);
                gG = Math.min(Math.max(gG, MIN_G), MAX_G);
                bG = Math.min(Math.max(bG, MIN_G), MAX_G);

                const avgG = (rG + gG + bG) / 3;
                if (avgG > 0.0001) { rG /= avgG; gG /= avgG; bG /= avgG; }

                const lutR = new Uint8ClampedArray(256);
                const lutG = new Uint8ClampedArray(256);
                const lutB = new Uint8ClampedArray(256);
                for (let v = 0; v < 256; v++) {
                    lutR[v] = Math.round(v * rG);
                    lutG[v] = Math.round(v * gG);
                    lutB[v] = Math.round(v * bG);
                }

                for (let i = 0; i < d.length; i += 4) {
                    if (d[i + 3] < 8) continue;
                    d[i]     = lutR[d[i]];
                    d[i + 1] = lutG[d[i + 1]];
                    d[i + 2] = lutB[d[i + 2]];
                }

                cx.putImageData(imgData, 0, 0);

                resolve(c);
            } catch (err) {
                console.warn('[WB] failed', err);
                resolve(null);
            }
        });
    }

    function applyAutoWhiteBalance(index) {
        const layer = layers[index];
        if (!layer) { showToast('图层无效'); return; }
        if (!layer.img) { showToast('图层无图片'); return; }
        if (layer.locked) { showToast('图层已锁定，无法调整'); return; }

        showShortcutHint('正在计算白平衡…');
        computeWhiteBalanceImage(layer.img).then((newImg) => {
            hideShortcutHint();
            if (!newImg) {
                showToast('自动白平衡失败');
                return;
            }
            if (layers.indexOf(layer) < 0) return;
            layer.img = newImg;
            renderAll(); renderOverlay(); renderLayerPanel(); saveState();
            showToast('已应用自动白平衡');
        }).catch(() => {
            hideShortcutHint();
            showToast('自动白平衡失败');
        });
    }

    // ========== 变换模式 ==========
    function enterTransformMode() {
        if (transformBusy) return;
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) { showToast('请先选择图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层，无法变换'); return; }
        }
        transformEntryHistoryIndex = historyIndex;
        transformMode = true;
        snapLines = [];
        transformBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg> 变换中';
        transformBtn.classList.add('active');
        canvasStage.style.cursor = 'default';
        renderAll(); renderOverlay();
        showShortcutHint('角点缩放 · 角外侧圆点旋转 · <kbd>Shift</kbd> 中心缩放/吸附15° · <kbd>Ctrl</kbd> 自由拉伸');
        if (indices.length > 1) showToast(`多选变换（${indices.length} 个图层）`);
        else showToast('角点缩放 · 角外侧圆点旋转 · Shift 中心缩放/吸附');
    }

    function exitTransformMode(apply) {
        if (!transformMode) return;
        transformMode = false;
        transformDragIndex = -1;
        transformDragMode = null;
        transformStartState = null;
        canvasStage.style.cursor = '';

        if (apply) {
            saveState(true);
            showToast('变换已应用');
        } else {
            if (transformEntryHistoryIndex >= 0 && transformEntryHistoryIndex < history.length) {
                historyIndex = transformEntryHistoryIndex;
                transformBusy = true;
                restoreState(history[historyIndex], () => { transformBusy = false; });
                showToast('变换已取消');
            }
        }
        transformEntryHistoryIndex = -1;

        transformBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg> 自由变换';
        transformBtn.classList.remove('active');
        snapLines = [];
        renderAll(); renderOverlay();
        hideShortcutHint();
    }

    function toggleTransform() {
        if (transformMode) exitTransformMode(true);
        else enterTransformMode();
    }

    function resetImagePosition() {
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) { showToast('请先选择图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层'); return; }
        }
        const bounds = getSelectionBounds();
        if (!bounds) return;
        const dx = (canvasWidth - bounds.w) / 2 - bounds.x;
        const dy = (canvasHeight - bounds.h) / 2 - bounds.y;
        for (const i of indices) { layers[i].x += dx; layers[i].y += dy; }
        renderAll(); renderOverlay(); saveState();
    }

    function updateActiveScale(newScale, saveHist) {
        if (saveHist === undefined) saveHist = true;
        const active = getActiveLayer();
        if (!active || !active.img) return;
        if (active.locked) {
            showToast('图层已锁定，无法缩放');
            const cur = Math.round(active.scaleX * 100);
            zoomSlider.value = cur;
            zoomLabel.value = cur + '%';
            return;
        }
        newScale = Math.min(Math.max(newScale, 0.05), 20);
        const cx = active.x + getLayerW(active) / 2;
        const cy = active.y + getLayerH(active) / 2;
        active.scaleX = newScale;
        active.scaleY = newScale;
        const w = getLayerW(active);
        const h = getLayerH(active);
        active.x = cx - w / 2;
        active.y = cy - h / 2;
        renderAll(); renderOverlay();
        if (saveHist) saveState();
    }

    function updateSelectedOpacity(newOpacity, saveHist) {
        if (saveHist === undefined) saveHist = true;
        const indices = Array.from(selectedIndices).filter(i => i >= 0 && i < layers.length);
        if (indices.length === 0) return;
        newOpacity = Math.min(Math.max(newOpacity, 0), 1);

        let skippedLocked = false;
        for (const i of indices) {
            if (layers[i].locked) { skippedLocked = true; continue; }
            layers[i].opacity = newOpacity;
        }
        if (skippedLocked && saveHist) showToast('已跳过锁定图层');

        renderAll(); renderOverlay(); renderLayerPanel();
        if (saveHist) saveState();
    }

    function getFrameRotation() {
        const indices = getSelectedLayerIndices();
        if (indices.length === 1) {
            const l = layers[indices[0]];
            return l ? (l.rotation || 0) : 0;
        }
        return 0;
    }

    function startTransformDrag(mode, handleIndex, bounds, mouseX, mouseY) {
        transformDragMode = mode;
        transformDragIndex = handleIndex;
        setHintDimmed(true);

        const groupX = bounds.x, groupY = bounds.y, groupW = bounds.w, groupH = bounds.h;
        const indices = getSelectedLayerIndices();

        const members = indices.map(i => {
            const l = layers[i];
            const lw = getLayerW(l);
            const lh = getLayerH(l);
            const lcx = l.x + lw / 2;
            const lcy = l.y + lh / 2;
            return {
                layerIndex: i,
                relCX: lcx - groupX,
                relCY: lcy - groupY,
                relW: lw,
                relH: lh
            };
        });

        let ax, ay, dir, type;
        if (mode === 'scale') {
            switch (handleIndex) {
                case 0: ax = groupX + groupW; ay = groupY + groupH; dir = 'tl'; type = 'corner'; break;
                case 1: ax = groupX + groupW / 2; ay = groupY + groupH; dir = 't'; type = 'edge'; break;
                case 2: ax = groupX; ay = groupY + groupH; dir = 'tr'; type = 'corner'; break;
                case 3: ax = groupX; ay = groupY + groupH / 2; dir = 'r'; type = 'edge'; break;
                case 4: ax = groupX; ay = groupY; dir = 'br'; type = 'corner'; break;
                case 5: ax = groupX + groupW / 2; ay = groupY; dir = 'b'; type = 'edge'; break;
                case 6: ax = groupX + groupW; ay = groupY; dir = 'bl'; type = 'corner'; break;
                case 7: ax = groupX + groupW; ay = groupY + groupH / 2; dir = 'l'; type = 'edge'; break;
            }
        }

        transformStartState = {
            groupX, groupY, groupW, groupH,
            ax, ay, dir, type,
            centerX: groupX + groupW / 2,
            centerY: groupY + groupH / 2,
            startMouseX: mouseX, startMouseY: mouseY,
            frameRot: getFrameRotation(),
            snapTargets: buildSnapTargets(new Set(indices)),
            members, indices
        };
    }

    function startRotateDrag(bounds, mouseX, mouseY) {
        transformDragMode = 'rotate';
        transformDragIndex = -1;
        setHintDimmed(true);

        const cx = bounds.x + bounds.w / 2;
        const cy = bounds.y + bounds.h / 2;
        const indices = getSelectedLayerIndices();

        const members = indices.map(i => {
            const l = layers[i];
            const lw = getLayerW(l);
            const lh = getLayerH(l);
            const lcx = l.x + lw / 2;
            const lcy = l.y + lh / 2;
            return {
                layerIndex: i,
                origRotation: l.rotation || 0,
                origW: lw, origH: lh,
                relAngle: Math.atan2(lcy - cy, lcx - cx),
                relDist: Math.hypot(lcx - cx, lcy - cy)
            };
        });

        transformStartState = {
            centerX: cx,
            centerY: cy,
            startMouseAngle: Math.atan2(mouseY - cy, mouseX - cx),
            frameRot: getFrameRotation(),
            members
        };
    }

    function applyTransformScale(start, newGX, newGY, newGW, newGH) {
        if (start.groupW === 0 || start.groupH === 0) return;
        const scaleX = newGW / start.groupW;
        const scaleY = newGH / start.groupH;
        for (const mem of start.members) {
            const l = layers[mem.layerIndex];
            if (!l || !l.img || !l.img.width || !l.img.height) continue;
            const newCX = newGX + mem.relCX * scaleX;
            const newCY = newGY + mem.relCY * scaleY;
            const newW = mem.relW * scaleX;
            const newH = mem.relH * scaleY;
            l.scaleX = newW / l.img.width;
            l.scaleY = newH / l.img.height;
            l.x = newCX - newW / 2;
            l.y = newCY - newH / 2;
        }
    }

    function hitTestLayerAny(m, includeLocked) {
        for (let i = layers.length - 1; i >= 0; i--) {
            const layer = layers[i];
            if (!layer.visible || !layer.img) continue;
            if (!includeLocked && layer.locked) continue;
            const w = getLayerW(layer);
            const h = getLayerH(layer);
            if (w === 0 || h === 0) continue;

            const rot = layer.rotation || 0;
            let px = m.x, py = m.y;
            if (rot) {
                const cx = layer.x + w / 2, cy = layer.y + h / 2;
                const r = -rot * Math.PI / 180;
                const cos = Math.cos(r), sin = Math.sin(r);
                const dx = m.x - cx, dy = m.y - cy;
                px = cx + dx * cos - dy * sin;
                py = cy + dx * sin + dy * cos;
            }
            if (px >= layer.x && px <= layer.x + w && py >= layer.y && py <= layer.y + h) return i;
        }
        return -1;
    }

    // ========== 画布框选 ==========
    function getMarqueeHitIndices(start, cur) {
        if (!start || !cur) return [];
        const x1 = Math.min(start.x, cur.x);
        const y1 = Math.min(start.y, cur.y);
        const x2 = Math.max(start.x, cur.x);
        const y2 = Math.max(start.y, cur.y);

        const hits = [];
        for (let i = 0; i < layers.length; i++) {
            const l = layers[i];
            if (!l.visible || !l.img) continue;
            const b = getLayerAABB(l);
            if (b.w === 0 || b.h === 0) continue;
            if (b.x < x2 && b.x + b.w > x1 && b.y < y2 && b.y + b.h > y1) {
                hits.push(i);
            }
        }
        return hits;
    }

    function finishMarqueeSelect() {
        const start = marqueeStart;
        const cur = marqueeCurrent;
        const moved = marqueeMoved;
        const additive = marqueeAdditive;

        isMarqueeSelecting = false;
        marqueeStart = null;
        marqueeCurrent = null;
        marqueeMoved = false;
        marqueeAdditive = false;
        canvasStage.style.cursor = '';
        setHintDimmed(false);
        hideShortcutHint();

        if (!start || !cur) { renderOverlay(); return; }

        if (!moved) {
            if (!additive && selectedIndices.size > 0) {
                selectedIndices.clear();
                activeLayerIndex = -1;
                renderAll(); renderOverlay(); renderLayerPanel();
            } else {
                renderOverlay();
            }
            return;
        }

        const hits = getMarqueeHitIndices(start, cur);

        if (additive) {
            for (const i of hits) selectedIndices.add(i);
            if (hits.length > 0) activeLayerIndex = hits[hits.length - 1];
        } else {
            selectedIndices.clear();
            for (const i of hits) selectedIndices.add(i);
            activeLayerIndex = hits.length > 0 ? hits[hits.length - 1] : -1;
        }

        renderAll(); renderOverlay(); renderLayerPanel();

        if (hits.length > 0) {
            showToast(additive ? `加选了 ${hits.length} 个图层` : `已框选 ${hits.length} 个图层`);
        } else if (!additive) {
            showToast('框选范围内没有图层');
        }
    }

    function cancelMarqueeSelect() {
        if (!isMarqueeSelecting) return;
        isMarqueeSelecting = false;
        marqueeStart = null;
        marqueeCurrent = null;
        marqueeMoved = false;
        marqueeAdditive = false;
        canvasStage.style.cursor = '';
        setHintDimmed(false);
        renderOverlay();
    }

    // ========== 图层面板框选 ==========
    function updateLayerMarqueeRect() {
        if (!layerMarqueeEl || !layerMarqueeStart || !layerMarqueeCurrent) return;
        const s = layerMarqueeStart, c = layerMarqueeCurrent;
        const x1 = Math.min(s.x, c.x);
        const y1 = Math.min(s.y, c.y);
        const w = Math.abs(c.x - s.x);
        const h = Math.abs(c.y - s.y);
        layerMarqueeEl.style.left = x1 + 'px';
        layerMarqueeEl.style.top = y1 + 'px';
        layerMarqueeEl.style.width = w + 'px';
        layerMarqueeEl.style.height = h + 'px';
    }

    function finishLayerMarquee() {
        const start = layerMarqueeStart;
        const cur = layerMarqueeCurrent;
        const moved = layerMarqueeMoved;
        const additive = layerMarqueeAdditive;
        const startTarget = layerMarqueeStartTarget;

        layerMarqueeActive = false;
        layerMarqueeStart = null;
        layerMarqueeCurrent = null;
        layerMarqueeMoved = false;
        layerMarqueeAdditive = false;
        layerMarqueeStartTarget = null;
        if (layerMarqueeEl) layerMarqueeEl.classList.remove('active');
        layerList.classList.remove('marquee-active');

        suppressItemDrag = false;
        const itemEls = layerList.querySelectorAll('.layer-item');
        for (let i = 0; i < itemEls.length; i++) itemEls[i].draggable = true;

        if (!start || !cur) return;

        if (!moved) {
            const startedOnItem = startTarget && startTarget.closest && startTarget.closest('.layer-item');
            if (!startedOnItem && !additive && selectedIndices.size > 0) {
                selectedIndices.clear();
                activeLayerIndex = -1;
                renderAll(); renderOverlay(); renderLayerPanel();
            }
            return;
        }

        layerMarqueeJustFinished = Date.now();

        const x1 = Math.min(start.x, cur.x);
        const y1 = Math.min(start.y, cur.y);
        const x2 = Math.max(start.x, cur.x);
        const y2 = Math.max(start.y, cur.y);

        const hits = [];
        for (let k = 0; k < itemEls.length; k++) {
            const el = itemEls[k];
            const r = el.getBoundingClientRect();
            if (r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1) {
                const idx = parseInt(el.dataset.index, 10);
                if (!isNaN(idx) && idx >= 0 && idx < layers.length) hits.push(idx);
            }
        }

        if (additive) {
            for (const i of hits) selectedIndices.add(i);
            if (hits.length > 0) activeLayerIndex = hits[hits.length - 1];
        } else {
            selectedIndices.clear();
            for (const i of hits) selectedIndices.add(i);
            activeLayerIndex = hits.length > 0 ? hits[hits.length - 1] : -1;
        }

        renderAll(); renderOverlay(); renderLayerPanel();

        if (hits.length > 0) {
            showToast(additive ? `加选 ${hits.length} 个图层` : `框选 ${hits.length} 个图层`);
        }
    }

    layerList.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        if (e.target.closest('.layer-btn, .layer-ctrl, input, select, textarea')) return;

        const itemEl = e.target.closest('.layer-item');
        const modifier = e.ctrlKey || e.metaKey || e.altKey;
        if (itemEl && !modifier) return;

        e.preventDefault();
        suppressItemDrag = true;
        const items = layerList.querySelectorAll('.layer-item');
        for (let i = 0; i < items.length; i++) items[i].draggable = false;

        layerMarqueeActive = true;
        layerMarqueeMoved = false;
        layerMarqueeAdditive = e.shiftKey;
        layerMarqueeStart = { x: e.clientX, y: e.clientY };
        layerMarqueeCurrent = { x: e.clientX, y: e.clientY };
        layerMarqueeStartTarget = e.target;

        layerList.classList.add('marquee-active');
        if (layerMarqueeEl) {
            layerMarqueeEl.classList.add('active');
            updateLayerMarqueeRect();
        }
    });

    // ========== 画布交互 ==========
    canvasStage.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;

        if (spacePressed) {
            e.preventDefault();
            startPanning(e.clientX, e.clientY);
            return;
        }

        let m = getCanvasMouse(e);

        if (transformMode) {
            const frame = getTransformFrame();
            if (!frame) return;
            const bounds = { x: frame.x, y: frame.y, w: frame.w, h: frame.h };
            const fm = toFrameCoords(frame, m.x, m.y);
            const half = 8 / viewScale;

            const rotHandles = getRotateHandlePositions(bounds);
            for (let i = 0; i < rotHandles.length; i++) {
                const p = rotHandles[i];
                if (Math.hypot(fm.x - p.x, fm.y - p.y) < half) {
                    startRotateDrag(bounds, fm.x, fm.y);
                    showShortcutHint('拖拽旋转 · <kbd>Shift</kbd> 吸附 15°');
                    e.preventDefault(); return;
                }
            }

            const handles = getTransformHandlePositions(bounds);
            for (let i = 0; i < handles.length; i++) {
                const p = handles[i];
                if (Math.abs(fm.x - p.x) < half && Math.abs(fm.y - p.y) < half) {
                    startTransformDrag('scale', i, bounds, fm.x, fm.y);
                    showShortcutHint('拖拽缩放 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    e.preventDefault(); return;
                }
            }
            if (fm.x >= bounds.x && fm.x <= bounds.x + bounds.w &&
                fm.y >= bounds.y && fm.y <= bounds.y + bounds.h) {
                startTransformDrag('move', -1, bounds, fm.x, fm.y);
                canvasStage.style.cursor = 'move';
                showShortcutHint('移动变换框 · 松开鼠标应用');
                e.preventDefault(); return;
            }
            return;
        }

        const hitIndex = hitTestLayerAny(m, false);
        if (hitIndex >= 0) {
            const layer = layers[hitIndex];
            const additive = e.shiftKey;
            if (!additive) {
                if (!selectedIndices.has(hitIndex)) selectLayer(hitIndex, false);
                else if (hitIndex !== activeLayerIndex) {
                    activeLayerIndex = hitIndex;
                    renderAll(); renderOverlay(); renderLayerPanel();
                }
            } else {
                selectLayer(hitIndex, true);
            }

            dragMembers = Array.from(selectedIndices).map(idx => ({
                layerIndex: idx,
                origX: layers[idx].x,
                origY: layers[idx].y
            }));
            dragSnapTargets = buildSnapTargets(new Set(selectedIndices));
            isDragging = true;
            dragStartX = m.x;
            dragStartY = m.y;
            dragLayerStartX = layer.x;
            dragLayerStartY = layer.y;
            canvasStage.style.cursor = 'grabbing';
            setHintDimmed(true);
            showShortcutHint('移动图层中 · 松开鼠标放置 · <kbd>Shift</kbd> 点击多选');
            return;
        }

        isMarqueeSelecting = true;
        marqueeStart = { x: m.x, y: m.y };
        marqueeCurrent = { x: m.x, y: m.y };
        marqueeMoved = false;
        marqueeAdditive = e.shiftKey;
        canvasStage.style.cursor = 'crosshair';
        e.preventDefault();
    });

    canvasStage.addEventListener('mousemove', function(e) {
        if (!transformMode) {
            if (!isDragging && !transformDragMode && !isMarqueeSelecting) {
                const m = getCanvasMouse(e);
                const hit = hitTestLayerAny(m, false);
                canvasStage.style.cursor = hit >= 0 ? 'grab' : '';
            }
            return;
        }
        if (transformDragMode) return;

        const frame = getTransformFrame();
        if (!frame) return;
        const bounds = { x: frame.x, y: frame.y, w: frame.w, h: frame.h };
        const m0 = getCanvasMouse(e);
        const fm = toFrameCoords(frame, m0.x, m0.y);
        const half = 8 / viewScale;

        const rotHandles = getRotateHandlePositions(bounds);
        for (let i = 0; i < rotHandles.length; i++) {
            const p = rotHandles[i];
            if (Math.hypot(fm.x - p.x, fm.y - p.y) < half) {
                canvasStage.style.cursor = 'crosshair';
                showShortcutHint('拖拽旋转 · <kbd>Shift</kbd> 吸附 15°');
                return;
            }
        }

        const handles = getTransformHandlePositions(bounds);
        const cursors = ['nwse-resize', 'ns-resize', 'nesw-resize', 'ew-resize', 'nwse-resize', 'ns-resize', 'nesw-resize', 'ew-resize'];
        for (let i = 0; i < handles.length; i++) {
            const p = handles[i];
            if (Math.abs(fm.x - p.x) < half && Math.abs(fm.y - p.y) < half) {
                canvasStage.style.cursor = cursors[i];
                showShortcutHint('拖拽缩放 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                return;
            }
        }
        if (fm.x >= bounds.x && fm.x <= bounds.x + bounds.w &&
            fm.y >= bounds.y && fm.y <= bounds.y + bounds.h) {
            canvasStage.style.cursor = 'move';
            showShortcutHint('移动变换框 · 松开鼠标应用');
        } else {
            canvasStage.style.cursor = 'default';
            hideShortcutHint();
        }
    });

    canvasStage.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const m = getCanvasMouse(e);
        const hitIndex = hitTestLayerAny(m, true);

        if (hitIndex >= 0) {
            if (!selectedIndices.has(hitIndex)) {
                activeLayerIndex = hitIndex;
                selectedIndices.clear();
                selectedIndices.add(hitIndex);
            } else {
                activeLayerIndex = hitIndex;
            }
            renderAll(); renderOverlay(); renderLayerPanel();
            showContextMenu(e.clientX, e.clientY, hitIndex);
        } else {
            hideContextMenu();
        }
    });

    canvasStage.addEventListener('dblclick', function(e) {
        if (transformMode) { e.preventDefault(); exitTransformMode(true); return; }
        const m = getCanvasMouse(e);
        const hit = hitTestLayerAny(m, true);
        if (hit >= 0) {
            const layer = layers[hit];
            if (layer.locked) { showToast('图层已锁定，无法变换'); return; }
            if (!selectedIndices.has(hit)) {
                activeLayerIndex = hit;
                selectedIndices.clear();
                selectedIndices.add(hit);
                renderAll(); renderOverlay(); renderLayerPanel();
            }
            e.preventDefault();
            enterTransformMode();
        }
    });

    let pendingMoveEvent = null;
    let pendingMoveRaf = null;

    function processPendingMove() {
        pendingMoveRaf = null;
        const ev = pendingMoveEvent;
        if (!ev) return;
        pendingMoveEvent = null;
        handleDragMove(ev);
    }

    function handleDragMove(ev) {
        const clientX = ev.clientX, clientY = ev.clientY;

        if (transformMode && transformDragMode) {
            let m = canvasPointFromClient(clientX, clientY);
            const start = transformStartState;
            if (!start) return;

            const frameRot = start.frameRot || 0;
            if (frameRot) {
                const cx = start.centerX, cy = start.centerY;
                const rad = -frameRot * Math.PI / 180;
                const cos = Math.cos(rad), sin = Math.sin(rad);
                const dx = m.x - cx, dy = m.y - cy;
                m = { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
            }

            if (transformDragMode === 'rotate') {
                const cx = start.centerX, cy = start.centerY;
                const curAngle = Math.atan2(m.y - cy, m.x - cx);
                let deltaRad = curAngle - start.startMouseAngle;

                if (ev.shiftKey) {
                    const deltaDeg = deltaRad * 180 / Math.PI;
                    const snappedDeg = Math.round(deltaDeg / 15) * 15;
                    deltaRad = snappedDeg * Math.PI / 180;
                }

                for (const mem of start.members) {
                    const l = layers[mem.layerIndex];
                    if (!l) continue;
                    let newRot = mem.origRotation + deltaRad * 180 / Math.PI;
                    newRot = ((newRot % 360) + 360) % 360;
                    l.rotation = newRot;

                    const newAngle = mem.relAngle + deltaRad;
                    const lcx = cx + Math.cos(newAngle) * mem.relDist;
                    const lcy = cy + Math.sin(newAngle) * mem.relDist;
                    l.x = lcx - mem.origW / 2;
                    l.y = lcy - mem.origH / 2;
                }

                renderAll(); renderOverlay();
                const sample = layers[start.members[0].layerIndex];
                const deg = sample ? Math.round(sample.rotation) : 0;
                showShortcutHint(`旋转中 ${deg}° · <kbd>Shift</kbd> 吸附 15°`);
                return;
            }

            if (transformDragMode === 'move') {
                const dx = m.x - start.startMouseX;
                const dy = m.y - start.startMouseY;
                const newGroupX = start.groupX + dx;
                const newGroupY = start.groupY + dy;
                const snapped = applySnappingWithTargets(newGroupX, newGroupY, start.groupW, start.groupH, start.snapTargets);
                const finalDx = snapped.x - start.groupX;
                const finalDy = snapped.y - start.groupY;
                for (const mem of start.members) {
                    const l = layers[mem.layerIndex];
                    if (!l) continue;
                    const newCX = start.groupX + mem.relCX + finalDx;
                    const newCY = start.groupY + mem.relCY + finalDy;
                    const lw = getLayerW(l), lh = getLayerH(l);
                    l.x = newCX - lw / 2;
                    l.y = newCY - lh / 2;
                }
                renderAll(); renderOverlay();
                return;
            }

            if (transformDragMode === 'scale') {
                const gx = start.groupX, gy = start.groupY;
                const gw = start.groupW, gh = start.groupH;
                const ax = start.ax, ay = start.ay;
                const minSize = 5 / viewScale;
                const freeMode = ev.ctrlKey || ev.metaKey;

                let newW = gw, newH = gh;
                snapLines = [];
                const SNAP = 8 / viewScale;
                const xTargets = start.snapTargets ? start.snapTargets.xTargets : [];
                const yTargets = start.snapTargets ? start.snapTargets.yTargets : [];

                if (ev.shiftKey) {
                    const cx = start.centerX, cy = start.centerY;
                    let scale;
                    if (start.type === 'corner') {
                        const startDist = Math.sqrt((gw / 2) * (gw / 2) + (gh / 2) * (gh / 2));
                        const dx = m.x - cx, dy = m.y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        scale = startDist > 0 ? dist / startDist : 1;
                    } else {
                        if (start.dir === 't' || start.dir === 'b') scale = gh > 0 ? Math.abs(m.y - cy) / (gh / 2) : 1;
                        else scale = gw > 0 ? Math.abs(m.x - cx) / (gw / 2) : 1;
                    }
                    const minScale = minSize / Math.min(gw, gh);
                    scale = Math.max(scale, minScale);
                    scale = Math.min(scale, 50);

                    const propW = gw * scale, propH = gh * scale;
                    let bestScale = scale, bestDelta = SNAP + 1, bestLine = null;

                    const tryEdge = (edge, targets, isVertical, computeScale) => {
                        for (let ti = 0; ti < targets.length; ti++) {
                            const t = targets[ti];
                            const d = Math.abs(edge - t);
                            if (d < bestDelta) {
                                const s = computeScale(t);
                                if (s > minScale && s < 50) {
                                    bestDelta = d; bestScale = s;
                                    bestLine = { type: isVertical ? 'vertical' : 'horizontal', pos: t };
                                }
                            }
                        }
                    };
                    tryEdge(cx - propW / 2, xTargets, true, (t) => gw > 0 ? 2 * (cx - t) / gw : 1);
                    tryEdge(cx + propW / 2, xTargets, true, (t) => gw > 0 ? 2 * (t - cx) / gw : 1);
                    tryEdge(cy - propH / 2, yTargets, false, (t) => gh > 0 ? 2 * (cy - t) / gh : 1);
                    tryEdge(cy + propH / 2, yTargets, false, (t) => gh > 0 ? 2 * (t - cy) / gh : 1);

                    if (bestLine && bestDelta < SNAP) { scale = bestScale; snapLines.push(bestLine); }
                    newW = gw * scale; newH = gh * scale;
                    const newGX = cx - newW / 2, newGY = cy - newH / 2;
                    applyTransformScale(start, newGX, newGY, newW, newH);
                    renderAll(); renderOverlay();
                    showShortcutHint('中心等比缩放中 · <kbd>Shift</kbd> 已按住');
                    return;
                }

                if (start.type === 'corner') {
                    let rawW, rawH;
                    if (start.dir === 'br') { rawW = m.x - ax; rawH = m.y - ay; }
                    else if (start.dir === 'tl') { rawW = ax - m.x; rawH = ay - m.y; }
                    else if (start.dir === 'tr') { rawW = m.x - ax; rawH = ay - m.y; }
                    else { rawW = ax - m.x; rawH = m.y - ay; }

                    if (freeMode) {
                        newW = Math.max(rawW, minSize);
                        newH = Math.max(rawH, minSize);
                        const snapXDir = (start.dir === 'tl' || start.dir === 'bl') ? 'left'
                                       : (start.dir === 'tr' || start.dir === 'br') ? 'right' : null;
                        const snapYDir = (start.dir === 'tl' || start.dir === 'tr') ? 'top'
                                       : (start.dir === 'bl' || start.dir === 'br') ? 'bottom' : null;
                        if (snapXDir === 'left') {
                            const edge = ax - newW;
                            let best = null, bestD = SNAP + 1;
                            for (const t of xTargets) { const d = Math.abs(edge - t); if (d < bestD) { bestD = d; best = t; } }
                            if (best !== null && bestD < SNAP) { newW = ax - best; snapLines.push({ type: 'vertical', pos: best }); }
                        } else if (snapXDir === 'right') {
                            const edge = ax + newW;
                            let best = null, bestD = SNAP + 1;
                            for (const t of xTargets) { const d = Math.abs(edge - t); if (d < bestD) { bestD = d; best = t; } }
                            if (best !== null && bestD < SNAP) { newW = best - ax; snapLines.push({ type: 'vertical', pos: best }); }
                        }
                        if (snapYDir === 'top') {
                            const edge = ay - newH;
                            let best = null, bestD = SNAP + 1;
                            for (const t of yTargets) { const d = Math.abs(edge - t); if (d < bestD) { bestD = d; best = t; } }
                            if (best !== null && bestD < SNAP) { newH = ay - best; snapLines.push({ type: 'horizontal', pos: best }); }
                        } else if (snapYDir === 'bottom') {
                            const edge = ay + newH;
                            let best = null, bestD = SNAP + 1;
                            for (const t of yTargets) { const d = Math.abs(edge - t); if (d < bestD) { bestD = d; best = t; } }
                            if (best !== null && bestD < SNAP) { newH = best - ay; snapLines.push({ type: 'horizontal', pos: best }); }
                        }
                        newW = Math.max(newW, minSize);
                        newH = Math.max(newH, minSize);
                        showShortcutHint('自由拉伸中 · 松开 <kbd>Ctrl</kbd> 恢复等比缩放');
                    } else {
                        const dx = gw, dy = gh;
                        let s = (dx * dx + dy * dy) > 0 ? (rawW * dx + rawH * dy) / (dx * dx + dy * dy) : 1;
                        const minScale = minSize / Math.min(gw, gh);
                        s = Math.max(s, minScale);
                        s = Math.min(s, 50);

                        let tmpW = gw * s, tmpH = gh * s;
                        let cornerX, cornerY;
                        switch (start.dir) {
                            case 'tl': cornerX = ax - tmpW; cornerY = ay - tmpH; break;
                            case 'tr': cornerX = ax + 0;   cornerY = ay - tmpH; break;
                            case 'br': cornerX = ax + tmpW; cornerY = ay + tmpH; break;
                            case 'bl': cornerX = ax - tmpW; cornerY = ay + 0;   break;
                        }

                        let bestSX = null, bestDX = SNAP + 1, snapX = null;
                        for (const t of xTargets) {
                            const d = Math.abs(cornerX - t);
                            if (d < bestDX) {
                                let s2;
                                if (start.dir === 'tr' || start.dir === 'br') s2 = gw > 0 ? (t - ax) / gw : 1;
                                else s2 = gw > 0 ? (ax - t) / gw : 1;
                                if (s2 >= minScale && s2 <= 50) {
                                    bestDX = d; bestSX = s2; snapX = t;
                                }
                            }
                        }
                        let bestSY = null, bestDY = SNAP + 1, snapY = null;
                        for (const t of yTargets) {
                            const d = Math.abs(cornerY - t);
                            if (d < bestDY) {
                                let s2;
                                if (start.dir === 'bl' || start.dir === 'br') s2 = gh > 0 ? (t - ay) / gh : 1;
                                else s2 = gh > 0 ? (ay - t) / gh : 1;
                                if (s2 >= minScale && s2 <= 50) {
                                    bestDY = d; bestSY = s2; snapY = t;
                                }
                            }
                        }
                        if (bestDX < SNAP && bestDY < SNAP) {
                            if (bestDX <= bestDY) { s = bestSX; snapLines.push({type:'vertical', pos:snapX}); }
                            else { s = bestSY; snapLines.push({type:'horizontal', pos:snapY}); }
                        } else if (bestDX < SNAP) { s = bestSX; snapLines.push({type:'vertical', pos:snapX}); }
                        else if (bestDY < SNAP) { s = bestSY; snapLines.push({type:'horizontal', pos:snapY}); }

                        newW = gw * s; newH = gh * s;
                        showShortcutHint('等比缩放中 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    }
                } else if (freeMode) {
                    if (start.dir === 't') { newW = gw; newH = Math.max(ay - m.y, minSize); }
                    else if (start.dir === 'b') { newW = gw; newH = Math.max(m.y - ay, minSize); }
                    else if (start.dir === 'l') { newW = Math.max(ax - m.x, minSize); newH = gh; }
                    else { newW = Math.max(m.x - ax, minSize); newH = gh; }
                    newW = Math.max(newW, minSize);
                    newH = Math.max(newH, minSize);
                    showShortcutHint('单边自由拉伸 · 松开 <kbd>Ctrl</kbd> 恢复等比缩放');
                } else {
                    const cx = start.centerX, cy = start.centerY;
                    let s;
                    if (start.dir === 't') s = gh > 0 ? (ay - m.y) / gh : 1;
                    else if (start.dir === 'b') s = gh > 0 ? (m.y - ay) / gh : 1;
                    else if (start.dir === 'l') s = gw > 0 ? (ax - m.x) / gw : 1;
                    else s = gw > 0 ? (m.x - ax) / gw : 1;
                    const minScale = minSize / Math.min(gw, gh);
                    s = Math.max(s, minScale);
                    s = Math.min(s, 50);

                    if (start.dir === 't' || start.dir === 'b') {
                        const activeY = start.dir === 't' ? ay - gh * s : ay + gh * s;
                        let bestD = SNAP + 1, bestS = s;
                        for (const t of yTargets) {
                            const d = Math.abs(activeY - t);
                            if (d < bestD) {
                                const s2 = start.dir === 't' ? (gh > 0 ? (ay - t) / gh : 1) : (gh > 0 ? (t - ay) / gh : 1);
                                if (s2 >= minScale && s2 <= 50) { bestD = d; bestS = s2; }
                            }
                        }
                        if (bestD < SNAP) {
                            s = bestS;
                            snapLines.push({type:'horizontal', pos: start.dir === 't' ? ay - gh*s : ay + gh*s});
                        }
                    } else {
                        const activeX = start.dir === 'l' ? ax - gw * s : ax + gw * s;
                        let bestD = SNAP + 1, bestS = s;
                        for (const t of xTargets) {
                            const d = Math.abs(activeX - t);
                            if (d < bestD) {
                                const s2 = start.dir === 'l' ? (gw > 0 ? (ax - t) / gw : 1) : (gw > 0 ? (t - ax) / gw : 1);
                                if (s2 >= minScale && s2 <= 50) { bestD = d; bestS = s2; }
                            }
                        }
                        if (bestD < SNAP) {
                            s = bestS;
                            snapLines.push({type:'vertical', pos: start.dir === 'l' ? ax - gw*s : ax + gw*s});
                        }
                    }

                    newW = gw * s; newH = gh * s;
                    let ngx, ngy;
                    switch (start.dir) {
                        case 't': ngx = cx - newW / 2; ngy = ay - newH; break;
                        case 'b': ngx = cx - newW / 2; ngy = ay; break;
                        case 'l': ngx = ax - newW; ngy = cy - newH / 2; break;
                        default:  ngx = ax; ngy = cy - newH / 2; break;
                    }
                    applyTransformScale(start, ngx, ngy, newW, newH);
                    renderAll(); renderOverlay();
                    showShortcutHint('等比缩放中 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    return;
                }

                let newGX, newGY;
                switch (start.dir) {
                    case 'tl': newGX = ax - newW; newGY = ay - newH; break;
                    case 'tr': newGX = ax; newGY = ay - newH; break;
                    case 'br': newGX = ax; newGY = ay; break;
                    case 'bl': newGX = ax - newW; newGY = ay; break;
                    case 't':  newGX = ax - newW / 2; newGY = ay - newH; break;
                    case 'b':  newGX = ax - newW / 2; newGY = ay; break;
                    case 'l':  newGX = ax - newW; newGY = ay - newH / 2; break;
                    case 'r':  newGX = ax; newGY = ay - newH / 2; break;
                    default: return;
                }
                applyTransformScale(start, newGX, newGY, newW, newH);
                renderAll(); renderOverlay();
                return;
            }
        }

        if (isDragging) {
            const m = canvasPointFromClient(clientX, clientY);
            const active = getActiveLayer();
            if (!active) { isDragging = false; canvasStage.style.cursor = ''; return; }
            const dx = m.x - dragStartX;
            const dy = m.y - dragStartY;
            const newX = dragLayerStartX + dx;
            const newY = dragLayerStartY + dy;
            const w = getLayerW(active);
            const h = getLayerH(active);
            const snapped = applySnappingWithTargets(newX, newY, w, h, dragSnapTargets);
            const finalDx = snapped.x - dragLayerStartX;
            const finalDy = snapped.y - dragLayerStartY;
            for (const mem of dragMembers) {
                const l = layers[mem.layerIndex];
                if (!l) continue;
                l.x = mem.origX + finalDx;
                l.y = mem.origY + finalDy;
            }
            renderAll(); renderOverlay();
            showShortcutHint('移动中 · 松开鼠标放置');
        }
    }

    // ========== 中键 / 空格平移 ==========
    let isPanning = false;
    let panStartClientX = 0, panStartClientY = 0;
    let panLastClientX = 0, panLastClientY = 0;
    let panStartScrollLeft = 0, panStartScrollTop = 0;
    let panRafId = null;

    function startPanning(clientX, clientY) {
        isPanning = true;
        panStartClientX = panLastClientX = clientX;
        panStartClientY = panLastClientY = clientY;
        panStartScrollLeft = canvasWrapper.scrollLeft;
        panStartScrollTop = canvasWrapper.scrollTop;
        canvasWrapper.classList.add('panning');
        setHintDimmed(true);
        showShortcutHint('平移视图中 · 松开鼠标结束');
    }

    function stopPanning() {
        if (!isPanning) return;
        isPanning = false;
        canvasWrapper.classList.remove('panning');
        if (panRafId !== null) { cancelAnimationFrame(panRafId); panRafId = null; }
        setHintDimmed(false);
        hideShortcutHint();
    }

    canvasWrapper.addEventListener('mousedown', function(e) {
        if (e.button !== 1) return;
        e.preventDefault();
        startPanning(e.clientX, e.clientY);
    });

    canvasWrapper.addEventListener('auxclick', function(e) {
        if (e.button === 1) e.preventDefault();
    });

    canvasWrapper.addEventListener('scroll', invalidateCanvasRectCache, { passive: true });

    window.addEventListener('mousemove', function(e) {
        if (layerMarqueeActive) {
            const dx = e.clientX - layerMarqueeStart.x;
            const dy = e.clientY - layerMarqueeStart.y;
            if (!layerMarqueeMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                layerMarqueeMoved = true;
            }
            layerMarqueeCurrent = { x: e.clientX, y: e.clientY };
            updateLayerMarqueeRect();
            return;
        }

        if (isPanning) {
            e.preventDefault();
            panLastClientX = e.clientX;
            panLastClientY = e.clientY;
            if (panRafId !== null) return;
            panRafId = requestAnimationFrame(function() {
                panRafId = null;
                if (!isPanning) return;
                canvasWrapper.scrollLeft = panStartScrollLeft - (panLastClientX - panStartClientX);
                canvasWrapper.scrollTop  = panStartScrollTop  - (panLastClientY - panStartClientY);
            });
            return;
        }

        if (isMarqueeSelecting) {
            const m = canvasPointFromClient(e.clientX, e.clientY);
            if (!marqueeMoved &&
                (Math.abs(m.x - marqueeStart.x) > 3 || Math.abs(m.y - marqueeStart.y) > 3)) {
                marqueeMoved = true;
                setHintDimmed(true);
                showShortcutHint('框选中 · 松开鼠标完成 · <kbd>Shift</kbd> 加选');
            }
            marqueeCurrent = m;
            renderOverlay();
            return;
        }

        if ((transformMode && transformDragMode) || isDragging) {
            pendingMoveEvent = {
                clientX: e.clientX,
                clientY: e.clientY,
                shiftKey: e.shiftKey,
                ctrlKey: e.ctrlKey,
                metaKey: e.metaKey
            };
            if (pendingMoveRaf === null) {
                pendingMoveRaf = requestAnimationFrame(processPendingMove);
            }
        }
    }, { passive: false });

    window.addEventListener('mouseup', function() {
        if (layerMarqueeActive) {
            finishLayerMarquee();
            return;
        }

        if (isMarqueeSelecting) {
            finishMarqueeSelect();
            return;
        }
        if (transformMode && transformDragMode) {
            transformDragMode = null;
            transformDragIndex = -1;
            transformStartState = null;
            snapLines = [];
            setHintDimmed(false);
            renderAll(); renderOverlay();
            saveState();
            showToast('变换完成');
            hideShortcutHint();
            return;
        }
        if (isDragging) {
            isDragging = false;
            canvasStage.style.cursor = '';
            snapLines = [];
            dragMembers = [];
            dragSnapTargets = null;
            setHintDimmed(false);
            renderAll(); renderOverlay();
            saveState();
            hideShortcutHint();
        }
        stopPanning();
    });

    window.addEventListener('blur', function() {
        stopPanning();
        cancelMarqueeSelect();
        if (layerMarqueeActive) {
            layerMarqueeActive = false;
            layerMarqueeStart = null;
            layerMarqueeCurrent = null;
            layerMarqueeMoved = false;
            layerMarqueeAdditive = false;
            layerMarqueeStartTarget = null;
            if (layerMarqueeEl) layerMarqueeEl.classList.remove('active');
            layerList.classList.remove('marquee-active');
            suppressItemDrag = false;
            const items = layerList.querySelectorAll('.layer-item');
            for (let i = 0; i < items.length; i++) items[i].draggable = true;
        }
        spacePressed = false;
        canvasWrapper.classList.remove('space-pan');
        setHintDimmed(false);
    });

    canvasWrapper.addEventListener('wheel', function(e) {
        if (isPanning) return;
        if (e.target === canvas && !e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        setViewScale(viewScale * factor, e.clientX, e.clientY);
    }, { passive: false });

    canvas.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) return;
        e.preventDefault();

        if (transformMode) {
            if (selectedIndices.size !== 1) return;
            const active = getActiveLayer();
            if (!active || active.locked) return;
            if (!active.img || !active.img.width) return;

            const delta = e.deltaY > 0 ? -0.05 : 0.05;
            let newScale = active.scaleX + delta;
            newScale = Math.min(Math.max(newScale, 0.05), 20);
            if (newScale === active.scaleX && newScale === active.scaleY) return;

            const oldW = getLayerW(active);
            const oldH = getLayerH(active);
            if (oldW <= 0 || oldH <= 0) return;

            const newW = active.img.width * newScale;
            const newH = active.img.height * newScale;
            const cx = active.x + oldW / 2;
            const cy = active.y + oldH / 2;
            active.x = cx - newW / 2;
            active.y = cy - newH / 2;
            active.scaleX = newScale;
            active.scaleY = newScale;
            renderAll(); renderOverlay();
            if (wheelSaveTimer) clearTimeout(wheelSaveTimer);
            wheelSaveTimer = setTimeout(() => saveState(), 300);
            return;
        }

        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        setViewScale(viewScale * factor, e.clientX, e.clientY);
    }, { passive: false });

    // ========== 视图缩放快捷 ==========
    function fitCanvasInView() {
        const rect = canvasWrapper.getBoundingClientRect();
        const pad = 60;
        const vw = Math.max(rect.width - pad * 2, 100);
        const vh = Math.max(rect.height - pad * 2, 100);
        const s = Math.min(vw / canvasWidth, vh / canvasHeight, 1);
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        setViewScale(Math.max(0.05, Math.min(s, 10)), cx, cy);
        requestAnimationFrame(() => { centerCanvasInView(); renderOverlay(); });
        showToast(`视图已适应窗口（${Math.round(viewScale * 100)}%）`);
    }

    function setViewScaleTo1() {
        const rect = canvasWrapper.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        setViewScale(1, cx, cy);
        requestAnimationFrame(() => { centerCanvasInView(); renderOverlay(); });
        showToast('视图已复位到 100%');
    }

    // ========== 右键菜单 ==========
    function showContextMenu(x, y, layerIndex) {
        contextMenuLayerIndex = layerIndex;
        contextMenuMouseX = x;
        contextMenuMouseY = y;
        menuDragging = false;
        menuDragMoved = false;
        contextMenu.classList.remove('dragging');

        const layer = layers[layerIndex];
        if (!layer) { hideContextMenu(); return; }
        const items = contextMenu.querySelectorAll('.menu-item');
        items.forEach(item => {
            const action = item.dataset.action;
            if (layer.locked && action !== 'lock' && action !== 'reset-hue') item.classList.add('disabled');
            else item.classList.remove('disabled');
            if (action === 'lock') item.textContent = layer.locked ? '解锁图层' : '锁定图层';
        });

        const menuW = 200, menuH = 480;
        let px = x, py = y;
        if (px + menuW > window.innerWidth) px = window.innerWidth - menuW - 10;
        if (py + menuH > window.innerHeight) py = window.innerHeight - menuH - 10;
        if (px < 8) px = 8;
        if (py < 8) py = 8;
        contextMenu.style.left = px + 'px';
        contextMenu.style.top = py + 'px';
        contextMenu.classList.add('active');
    }

    function hideContextMenu() {
        contextMenu.classList.remove('active');
        contextMenu.classList.remove('dragging');
        menuDragging = false;
        menuDragMoved = false;
    }

    contextMenu.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        menuDragging = true;
        menuDragMoved = false;
        menuDragStartX = e.clientX;
        menuDragStartY = e.clientY;
        const rect = contextMenu.getBoundingClientRect();
        menuStartLeft = rect.left;
        menuStartTop = rect.top;
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!menuDragging) return;
        const dx = e.clientX - menuDragStartX;
        const dy = e.clientY - menuDragStartY;
        if (!menuDragMoved) {
            if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
            menuDragMoved = true;
            contextMenu.classList.add('dragging');
        }
        const rect = contextMenu.getBoundingClientRect();
        const maxLeft = Math.max(4, window.innerWidth - rect.width - 4);
        const maxTop = Math.max(4, window.innerHeight - rect.height - 4);
        contextMenu.style.left = Math.min(Math.max(menuStartLeft + dx, 4), maxLeft) + 'px';
        contextMenu.style.top = Math.min(Math.max(menuStartTop + dy, 4), maxTop) + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (!menuDragging) return;
        menuDragging = false;
        if (menuDragMoved) menuDragEndTime = Date.now();
        contextMenu.classList.remove('dragging');
    });

    contextMenu.addEventListener('click', (e) => {
        if (Date.now() - menuDragEndTime < 150) return;
        const item = e.target.closest('.menu-item');
        if (!item || item.classList.contains('disabled')) return;
        const action = item.dataset.action;
        const idx = contextMenuLayerIndex;
        if (idx < 0 || idx >= layers.length) { hideContextMenu(); return; }
        const layer = layers[idx];

        if (action === 'hue-sat') { hideContextMenu(); openHuePanel(idx); return; }
        else if (action === 'auto-wb') { hideContextMenu(); applyAutoWhiteBalance(idx); return; }
        else if (action === 'reset-hue') {
            layer.hue = 0; layer.saturation = 100; layer.brightness = 100;
            layer.contrast = 100; layer.grayscale = 0; layer.sepia = 0; layer.invert = 0;
            renderAll(); renderOverlay(); renderLayerPanel(); saveState();
            showToast('已重置所有颜色调整');
        }
        else if (action === 'flip-h') flipLayer(idx, true);
        else if (action === 'flip-v') flipLayer(idx, false);
        else if (action === 'rotate-cw') rotateLayer90(idx, true);
        else if (action === 'rotate-ccw') rotateLayer90(idx, false);
        else if (action === 'duplicate') duplicateSelected();
        else if (action === 'raise') nudgeLayerOrder(1);
        else if (action === 'lower') nudgeLayerOrder(-1);
        else if (action === 'lock') { toggleLayerLock(idx); }
        else if (action === 'delete') { if (layer.locked) showToast('图层已锁定，无法删除'); else removeLayer(idx); }
        hideContextMenu();
    });

    document.addEventListener('click', (e) => {
        if (Date.now() - menuDragEndTime < 150) return;
        if (!contextMenu.contains(e.target)) hideContextMenu();
    });

    // ========== 色相 / 颜色面板 ==========
    function buildHueGradientCSS() {
        const stops = [];
        const N = 12;
        for (let i = 0; i <= N; i++) {
            const t = i / N;
            const deg = Math.round(180 + t * 360) % 360;
            stops.push(`hsl(${deg}, 85%, 55%) ${(t * 100).toFixed(2)}%`);
        }
        return `linear-gradient(to right, ${stops.join(', ')})`;
    }

    hueBar.style.background = buildHueGradientCSS();
    briBar.style.background = 'linear-gradient(to right, #000000 0%, #3a3a3a 25%, #8a8a8a 50%, #d8d8d8 75%, #ffffff 100%)';
    conBar.style.background = 'linear-gradient(to right, #808080 0%, #a8a8a8 30%, #d0d0d0 60%, #ffffff 100%)';

    function normalizeDeg(v) { return ((v % 360) + 360) % 360; }

    function updateHueGradients() {
        const hue = parseFloat(hueSlider.value) || 0;
        const sat = parseFloat(satSlider.value);
        const bri = parseFloat(briSlider.value);
        const con = parseFloat(conSlider.value);
        const satNum = isNaN(sat) ? 100 : sat;
        const briNum = isNaN(bri) ? 100 : bri;
        const conNum = isNaN(con) ? 100 : con;

        const hDeg = normalizeDeg(hue);
        const huePct = ((hue + 180) / 360) * 100;
        hueMarker.style.left = Math.min(Math.max(huePct, 0), 100) + '%';
        hueMarker.style.background = `hsl(${hDeg}, 85%, 55%)`;

        satBar.style.background =
            `linear-gradient(to right, hsl(${hDeg}, 0%, 62%), hsl(${hDeg}, 60%, 52%) 55%, hsl(${hDeg}, 100%, 50%))`;
        const satPct = Math.min(Math.max(satNum / 300, 0), 1) * 100;
        satMarker.style.left = satPct + '%';
        satMarker.style.background = `hsl(${hDeg}, ${Math.min(Math.max(satNum, 0), 100)}%, 50%)`;

        const briPct = Math.min(Math.max(briNum / 200, 0), 1) * 100;
        briMarker.style.left = briPct + '%';
        briMarker.style.background = `hsl(${hDeg}, 0%, ${Math.min(Math.max(briNum, 0), 100)}%)`;

        const conPct = Math.min(Math.max(conNum / 250, 0), 1) * 100;
        conMarker.style.left = conPct + '%';
        conMarker.style.background = `hsl(${hDeg}, 0%, ${50 + (conNum - 100) * 0.4}%)`;
    }

    function openHuePanel(index) {
        const layer = layers[index];
        if (!layer) return;
        if (layer.locked) { showToast('图层已锁定，无法调整'); return; }
        hueEditingLayerIndex = index;
        hueOriginalState = {
            hue: layer.hue || 0,
            saturation: layer.saturation !== undefined ? layer.saturation : 100,
            brightness: layer.brightness !== undefined ? layer.brightness : 100,
            contrast: layer.contrast !== undefined ? layer.contrast : 100,
            grayscale: layer.grayscale || 0,
            sepia: layer.sepia || 0,
            invert: layer.invert || 0
        };
        hueSlider.value = hueOriginalState.hue;
        satSlider.value = hueOriginalState.saturation;
        briSlider.value = hueOriginalState.brightness;
        conSlider.value = hueOriginalState.contrast;
        hueValue.textContent = Math.round(hueOriginalState.hue) + '°';
        satValue.textContent = Math.round(hueOriginalState.saturation) + '%';
        briValue.textContent = Math.round(hueOriginalState.brightness) + '%';
        conValue.textContent = Math.round(hueOriginalState.contrast) + '%';
        updatePresetButtons();
        updateHueGradients();

        let px = contextMenuMouseX, py = contextMenuMouseY;
        const panelW = 300, panelH = 520;
        if (px + panelW > window.innerWidth) px = window.innerWidth - panelW - 10;
        if (py + panelH > window.innerHeight) py = window.innerHeight - panelH - 10;
        if (px < 10) px = 10;
        if (py < 10) py = 10;
        huePanel.style.left = px + 'px';
        huePanel.style.top = py + 'px';
        huePanel.classList.add('active');
    }

    function closeHuePanel() {
        huePanel.classList.remove('active');
        hueEditingLayerIndex = -1;
        hueOriginalState = null;
        if (huePreviewRaf !== null) {
            cancelAnimationFrame(huePreviewRaf);
            huePreviewRaf = null;
        }
    }

    let huePreviewRaf = null;

    function updateHuePreview() {
        const idx = hueEditingLayerIndex;
        if (idx < 0 || idx >= layers.length) return;
        const layer = layers[idx];
        layer.hue = parseFloat(hueSlider.value);
        layer.saturation = parseFloat(satSlider.value);
        layer.brightness = parseFloat(briSlider.value);
        layer.contrast = parseFloat(conSlider.value);
        hueValue.textContent = Math.round(layer.hue) + '°';
        satValue.textContent = Math.round(layer.saturation) + '%';
        briValue.textContent = Math.round(layer.brightness) + '%';
        conValue.textContent = Math.round(layer.contrast) + '%';
        updateHueGradients();
        updatePresetButtons();
        renderAll(); renderOverlay();
        refreshLayerItemThumb(idx);
    }

    function scheduleHuePreview() {
        if (huePreviewRaf !== null) return;
        huePreviewRaf = requestAnimationFrame(() => {
            huePreviewRaf = null;
            updateHuePreview();
        });
    }

    function refreshLayerItemThumb(index) {
        const item = layerList.querySelector('.layer-item[data-index="' + index + '"]');
        if (!item) return;
        const layer = layers[index];
        if (!layer) return;
        const oldThumb = item.querySelector('.layer-thumb');
        if (!oldThumb) return;
        const newThumb = buildThumbCanvas(layer);
        oldThumb.replaceWith(newThumb);
    }

    function updatePresetButtons() {
        const idx = hueEditingLayerIndex;
        if (idx < 0 || idx >= layers.length) return;
        const layer = layers[idx];
        const presets = huePanel.querySelectorAll('.preset-btn');
        presets.forEach(btn => {
            const p = btn.dataset.preset;
            let on = false;
            if (p === 'bw') on = layer.grayscale >= 100;
            else if (p === 'sepia') on = layer.sepia >= 80;
            else if (p === 'invert') on = layer.invert >= 100;
            else if (p === 'punch') on = layer.contrast > 120 && layer.saturation > 130;
            else if (p === 'none') on = (layer.grayscale || 0) === 0 && (layer.sepia || 0) === 0 && (layer.invert || 0) === 0 && layer.hue === 0 && layer.saturation === 100 && layer.brightness === 100 && layer.contrast === 100;
            btn.classList.toggle('on', on);
        });
    }

    hueSlider.addEventListener('input', scheduleHuePreview);
    satSlider.addEventListener('input', scheduleHuePreview);
    briSlider.addEventListener('input', scheduleHuePreview);
    conSlider.addEventListener('input', scheduleHuePreview);

    huePanel.querySelectorAll('.preset-btn').forEach(btn => {

    // ========== 导出 ==========
    function generateOutputCanvas(outW, outH) {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = outW; outCanvas.height = outH;
        const outCtx = outCanvas.getContext('2d');
        outCtx.globalCompositeOperation = 'source-over';
        outCtx.filter = 'none';
        outCtx.globalAlpha = 1;
        outCtx.fillStyle = canvasBgColor;
        outCtx.fillRect(0, 0, outW, outH);

        const scaleX = outW / canvasWidth;
        const scaleY = outH / canvasHeight;
        const scale = Math.min(scaleX, scaleY);
        const offsetX = (outW - canvasWidth * scale) / 2;
        const offsetY = (outH - canvasHeight * scale) / 2;

        outCtx.save();
        outCtx.translate(offsetX, offsetY);
        outCtx.scale(scale, scale);
        outCtx.fillStyle = canvasBgColor;
        outCtx.fillRect(0, 0, canvasWidth, canvasHeight);
        for (const layer of layers) {
            if (!layer.visible || !layer.img) continue;
            const w = getLayerW(layer);
            const h = getLayerH(layer);
            if (w === 0 || h === 0) continue;
            outCtx.globalAlpha = layer.opacity;
            outCtx.filter = getLayerFilter(layer);
            outCtx.globalCompositeOperation = layer.blend || 'source-over';
            const rotation = layer.rotation || 0;
            if (rotation || layer.flipX || layer.flipY) {
                outCtx.save();
                try {
                    outCtx.translate(layer.x + w / 2, layer.y + h / 2);
                    if (rotation) outCtx.rotate(rotation * Math.PI / 180);
                    outCtx.scale(layer.flipX ? -1 : 1, layer.flipY ? -1 : 1);
                    outCtx.drawImage(layer.img, -w / 2, -h / 2, w, h);
                } catch (err) {}
                outCtx.restore();
            } else {
                try { outCtx.drawImage(layer.img, layer.x, layer.y, w, h); } catch (err) {}
            }
        }
        outCtx.globalCompositeOperation = 'source-over';
        outCtx.filter = 'none';
        outCtx.globalAlpha = 1;
        outCtx.restore();
        return outCanvas;
    }

    let sizeUpdateTimer = null;
    function updateEstimatedSize() {
        if (sizeUpdateTimer) clearTimeout(sizeUpdateTimer);
        sizeUpdateTimer = setTimeout(() => {
            const w = parseInt(outputWidth.value);
            const h = parseInt(outputHeight.value);
            const format = outputFormat.value;
            const quality = parseInt(jpegQuality.value);
            if (isNaN(w) || isNaN(h) || w < 1 || h < 1) {
                fileSizeDisplay.textContent = '预计大小 --';
                qualityDesc.textContent = '请设置有效尺寸';
                previewCtx.clearRect(0, 0, 200, 200);
                return;
            }
            const outCanvas = generateOutputCanvas(w, h);
            const mimeType = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
            const qualityParam = (format === 'jpeg' || format === 'webp') ? quality / 100 : undefined;
            outCanvas.toBlob((blob) => {
                if (blob) {
                    const sizeKB = blob.size / 1024;
                    const sizeStr = sizeKB < 1024 ? sizeKB.toFixed(1) + ' KB' : (sizeKB / 1024).toFixed(2) + ' MB';
                    fileSizeDisplay.textContent = `预计大小 ${sizeStr}`;
                }
            }, mimeType, qualityParam);

            const previewImg = new Image();
            previewImg.onload = function() {
                previewCtx.clearRect(0, 0, 200, 200);
                previewCtx.drawImage(previewImg, 0, 0, 200, 200);
                if (format === 'png') qualityDesc.textContent = '质量：无损（PNG）';
                else {
                    let desc = '';
                    if (quality >= 80) desc = '高清晰度（接近无损）';
                    else if (quality >= 50) desc = '中等清晰度（文件较小）';
                    else desc = '低清晰度（文件小，损失明显）';
                    qualityDesc.textContent = `质量：${desc}`;
                }
            };
            previewImg.src = outCanvas.toDataURL(mimeType, qualityParam);
        }, 200);
    }

    // ========== 项目保存 / 打开 ==========
    function saveProjectToFile() {
        const state = {
            version: 1,
            savedAt: Date.now(),
            canvasWidth, canvasHeight, canvasBgColor, viewScale,
            activeIndex: activeLayerIndex,
            layers: serializeLayers()
        };
        try {
            const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `canvas_project_${Date.now()}.json`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            showToast('项目已保存到本地文件');
        } catch (e) {
            showToast('保存失败：' + (e.message || '未知错误'));
        }
    }

    function openProjectFromFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const state = JSON.parse(reader.result);
                if (!state || !Array.isArray(state.layers)) throw new Error('invalid');
                history = [];
                historyIndex = -1;
                restoreState(state, () => {
                    history = [];
                    historyIndex = -1;
                    saveState(true);
                    requestAnimationFrame(() => {
                        updateCanvasPadding();
                        centerCanvasInView();
                    });
                });
                showToast('项目已打开');
            } catch (err) {
                showToast('项目文件损坏或格式不支持');
            }
        };
        reader.onerror = () => showToast('读取文件失败');
        reader.readAsText(file);
    }
