            showToast(`多选变换（${indices.length} 个图层）`);
        } else {
            showToast('拖控制点：等比缩放 · Shift 中心 · Ctrl 自由拉伸');
        }
    }

    function exitTransformMode(apply) {
        if (!transformMode) return;
        transformMode = false;
        transformDragIndex = -1;
        transformDragMode = null;
        transformStartState = null;
        canvasStage.style.cursor = '';

        if (apply) {
            saveState();
            showToast('变换已应用');
            showShortcutHint('变换已应用');
        } else {
            if (transformEntryHistoryIndex >= 0 && transformEntryHistoryIndex < history.length) {
                historyIndex = transformEntryHistoryIndex;
                transformBusy = true;
                restoreState(history[historyIndex]);
                showToast('变换已取消');
                showShortcutHint('变换已取消');
                transformBusy = false;
            }
        }
        transformEntryHistoryIndex = -1;

        transformBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg> 自由变换';
        transformBtn.classList.remove('active');
        snapLines = [];
        renderAll(); renderOverlay();
    }

    function toggleTransform() {
        if (transformMode) exitTransformMode(true);
        else enterTransformMode();
    }

    function resetImagePosition() {
        const indices = getSelectedLayerIndices();
        if (indices.length === 0) { showToast('请先选择图层'); return; }
        for (const i of indices) {
            if (layers[i].locked) { showToast('选中图层中有锁定图层'); return; }
        }
        const bounds = getSelectionBounds();
        if (!bounds) return;
        const dx = (canvasWidth - bounds.w) / 2 - bounds.x;
        const dy = (canvasHeight - bounds.h) / 2 - bounds.y;
        for (const i of indices) {
            layers[i].x += dx;
            layers[i].y += dy;
        }
        renderAll(); renderOverlay(); saveState();
    }

    function updateActiveScale(newScale, saveHist) {
        if (saveHist === undefined) saveHist = true;
        const active = getActiveLayer();
        if (!active || !active.img) return;
        if (active.locked) {
            showToast('图层已锁定，无法缩放');
            const cur = Math.round(active.scaleX * 100);
            zoomSlider.value = cur;
            zoomLabel.value = cur + '%';
            return;
        }
        newScale = Math.min(Math.max(newScale, 0.05), 20);
        const cx = active.x + getLayerW(active) / 2;
        const cy = active.y + getLayerH(active) / 2;
        active.scaleX = newScale;
        active.scaleY = newScale;
        const w = getLayerW(active);
        const h = getLayerH(active);
        active.x = cx - w / 2;
        active.y = cy - h / 2;
        renderAll(); renderOverlay();
        if (saveHist) saveState();
    }

    /* ★ 新增：批量更新选中图层的不透明度（变换模式同样可用） */
    function updateSelectedOpacity(newOpacity, saveHist) {
        if (saveHist === undefined) saveHist = true;
        const indices = Array.from(selectedIndices).filter(i => i >= 0 && i < layers.length);
        if (indices.length === 0) return;
        newOpacity = Math.min(Math.max(newOpacity, 0), 1);

        let skippedLocked = false;
        for (const i of indices) {
            if (layers[i].locked) { skippedLocked = true; continue; }
            layers[i].opacity = newOpacity;
        }
        if (skippedLocked && saveHist) showToast('已跳过锁定图层');

        renderAll(); renderOverlay(); renderLayerPanel();
        if (saveHist) saveState();
    }

    function startTransformDrag(mode, handleIndex, bounds, mouseX, mouseY) {
        transformDragMode = mode;
        transformDragIndex = handleIndex;

        const groupX = bounds.x, groupY = bounds.y, groupW = bounds.w, groupH = bounds.h;
        const indices = getSelectedLayerIndices();

        const members = indices.map(i => {
            const l = layers[i];
            const lw = getLayerW(l);
            const lh = getLayerH(l);
            return {
                layerIndex: i,
                relX: l.x - groupX,
                relY: l.y - groupY,
                relW: lw,
                relH: lh
            };
        });

        let ax, ay, dir, type;
        if (mode === 'scale') {
            switch (handleIndex) {
                case 0: ax = groupX + groupW; ay = groupY + groupH; dir = 'tl'; type = 'corner'; break;
                case 1: ax = groupX + groupW / 2; ay = groupY + groupH; dir = 't'; type = 'edge'; break;
                case 2: ax = groupX; ay = groupY + groupH; dir = 'tr'; type = 'corner'; break;
                case 3: ax = groupX; ay = groupY + groupH / 2; dir = 'r'; type = 'edge'; break;
                case 4: ax = groupX; ay = groupY; dir = 'br'; type = 'corner'; break;
                case 5: ax = groupX + groupW / 2; ay = groupY; dir = 'b'; type = 'edge'; break;
                case 6: ax = groupX + groupW; ay = groupY; dir = 'bl'; type = 'corner'; break;
                case 7: ax = groupX + groupW; ay = groupY + groupH / 2; dir = 'l'; type = 'edge'; break;
            }
        }

        transformStartState = {
            groupX, groupY, groupW, groupH,
            ax, ay, dir, type,
            centerX: groupX + groupW / 2,
            centerY: groupY + groupH / 2,
            startMouseX: mouseX,
            startMouseY: mouseY,
            members,
            indices
        };
    }

    function applyTransformScale(start, newGX, newGY, newGW, newGH) {
        if (start.groupW === 0 || start.groupH === 0) return;
        const scaleX = newGW / start.groupW;
        const scaleY = newGH / start.groupH;
        for (const mem of start.members) {
            const l = layers[mem.layerIndex];
            if (!l || !l.img || !l.img.width || !l.img.height) continue;
            l.x = newGX + mem.relX * scaleX;
            l.y = newGY + mem.relY * scaleY;
            l.scaleX = (mem.relW * scaleX) / l.img.width;
            l.scaleY = (mem.relH * scaleY) / l.img.height;
        }
    }

    function getCanvasMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * sx,
            y: (e.clientY - rect.top) * sy
        };
    }

    function hitTestLayerAny(m, includeLocked) {
        for (let i = layers.length - 1; i >= 0; i--) {
            const layer = layers[i];
            if (!layer.visible || !layer.img) continue;
            if (!includeLocked && layer.locked) continue;
            const w = getLayerW(layer);
            const h = getLayerH(layer);
            if (w === 0 || h === 0) continue;
            if (m.x >= layer.x && m.x <= layer.x + w &&
                m.y >= layer.y && m.y <= layer.y + h) {
                return i;
            }
        }
        return -1;
    }

    // ========== 画布交互 ==========
    canvasStage.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        const m = getCanvasMouse(e);

        if (transformMode) {
            const bounds = getSelectionBounds();
            if (!bounds) return;
            const half = 8 / viewScale;
            const handles = getTransformHandlePositions(bounds);

            for (let i = 0; i < handles.length; i++) {
                const p = handles[i];
                if (Math.abs(m.x - p.x) < half && Math.abs(m.y - p.y) < half) {
                    startTransformDrag('scale', i, bounds, m.x, m.y);
                    showShortcutHint('拖拽缩放 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    e.preventDefault();
                    return;
                }
            }
            if (m.x >= bounds.x && m.x <= bounds.x + bounds.w &&
                m.y >= bounds.y && m.y <= bounds.y + bounds.h) {
                startTransformDrag('move', -1, bounds, m.x, m.y);
                canvasStage.style.cursor = 'move';
                showShortcutHint('移动变换框 · 松开鼠标应用');
                e.preventDefault();
                return;
            }
            return;
        }

        const hitIndex = hitTestLayerAny(m, false);
        if (hitIndex >= 0) {
            const layer = layers[hitIndex];
            const additive = e.shiftKey;
            if (!additive) {
                if (!selectedIndices.has(hitIndex)) {
                    selectLayer(hitIndex, false);
                } else if (hitIndex !== activeLayerIndex) {
                    activeLayerIndex = hitIndex;
                    renderAll(); renderOverlay(); renderLayerPanel();
                }
            } else {
                selectLayer(hitIndex, true);
            }

            dragMembers = Array.from(selectedIndices).map(idx => ({
                layerIndex: idx,
                origX: layers[idx].x,
                origY: layers[idx].y
            }));
            isDragging = true;
            dragStartX = m.x;
            dragStartY = m.y;
            dragLayerStartX = layer.x;
            dragLayerStartY = layer.y;
            canvasStage.style.cursor = 'grabbing';
            showShortcutHint('移动图层中 · 松开鼠标放置 · <kbd>Shift</kbd> 点击多选');
            return;
        }

        if (!e.shiftKey && selectedIndices.size > 0) {
            selectedIndices.clear();
            activeLayerIndex = -1;
            renderAll(); renderOverlay(); renderLayerPanel();
            hideShortcutHint();
        }
    });

    canvasStage.addEventListener('mousemove', function(e) {
        if (!transformMode) {
            if (!isDragging && !transformDragMode) {
                const m = getCanvasMouse(e);
                const hit = hitTestLayerAny(m, false);
                if (hit >= 0) {
                    canvasStage.style.cursor = 'grab';
                    showShortcutHint('双击进入变换 · 右键调整色相 · 拖拽移动图层');
                } else {
                    canvasStage.style.cursor = '';
                    if (lastHintText === '双击进入变换 · 右键调整色相 · 拖拽移动图层') {
                        hideShortcutHint();
                    }
                }
            }
            return;
        }
        if (transformDragMode) return;
        const m = getCanvasMouse(e);
        const bounds = getSelectionBounds();
        if (!bounds) return;
        const half = 8 / viewScale;
        const handles = getTransformHandlePositions(bounds);
        const cursors = ['nwse-resize', 'ns-resize', 'nesw-resize', 'ew-resize', 'nwse-resize', 'ns-resize', 'nesw-resize', 'ew-resize'];
        for (let i = 0; i < handles.length; i++) {
            const p = handles[i];
            if (Math.abs(m.x - p.x) < half && Math.abs(m.y - p.y) < half) {
                canvasStage.style.cursor = cursors[i];
                showShortcutHint('拖拽缩放 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                return;
            }
        }
        if (m.x >= bounds.x && m.x <= bounds.x + bounds.w &&
            m.y >= bounds.y && m.y <= bounds.y + bounds.h) {
            canvasStage.style.cursor = 'move';
            showShortcutHint('移动变换框 · 松开鼠标应用');
        } else {
            canvasStage.style.cursor = 'default';
            hideShortcutHint();
        }
    });

    canvasStage.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const m = getCanvasMouse(e);
        const hitIndex = hitTestLayerAny(m, true);

        if (hitIndex >= 0) {
            if (!selectedIndices.has(hitIndex)) {
                activeLayerIndex = hitIndex;
                selectedIndices.clear();
                selectedIndices.add(hitIndex);
            } else {
                activeLayerIndex = hitIndex;
            }
            renderAll(); renderOverlay(); renderLayerPanel();
            showContextMenu(e.clientX, e.clientY, hitIndex);
            showShortcutHint('右键菜单：色相 / 白平衡 / 翻转 / 旋转 / 锁定 / 删除');
        } else {
            hideContextMenu();
        }
    });

    canvasStage.addEventListener('dblclick', function(e) {
        if (transformMode) {
            e.preventDefault();
            exitTransformMode(true);
            return;
        }
        const m = getCanvasMouse(e);
        const hit = hitTestLayerAny(m, true);
        if (hit >= 0) {
            const layer = layers[hit];
            if (layer.locked) { showToast('图层已锁定，无法变换'); return; }
            if (!selectedIndices.has(hit)) {
                activeLayerIndex = hit;
                selectedIndices.clear();
                selectedIndices.add(hit);
                renderAll(); renderOverlay(); renderLayerPanel();
            }
            e.preventDefault();
            enterTransformMode();
        }
    });

    window.addEventListener('mousemove', function(e) {
        if (transformMode && transformDragMode) {
            const m = getCanvasMouse(e);
            const start = transformStartState;
            if (!start) return;

            if (transformDragMode === 'move') {
                const dx = m.x - start.startMouseX;
                const dy = m.y - start.startMouseY;
                const newGroupX = start.groupX + dx;
                const newGroupY = start.groupY + dy;
                const exclude = new Set(start.indices);
                const snapped = applySnapping(newGroupX, newGroupY, start.groupW, start.groupH, exclude);

                const finalDx = snapped.x - start.groupX;
                const finalDy = snapped.y - start.groupY;

                for (const mem of start.members) {
                    const l = layers[mem.layerIndex];
                    if (!l) continue;
                    l.x = start.groupX + mem.relX + finalDx;
                    l.y = start.groupY + mem.relY + finalDy;
                }
                renderAll(); renderOverlay();
                return;
            }

            if (transformDragMode === 'scale') {
                const gx = start.groupX, gy = start.groupY;
                const gw = start.groupW, gh = start.groupH;
                const ax = start.ax, ay = start.ay;
                const minSize = 5 / viewScale;
                const freeMode = e.ctrlKey || e.metaKey;

                let newW = gw, newH = gh;
                snapLines = [];
                const SNAP = 8 / viewScale;

                const exclude = new Set(start.indices);
                const xTargets = [0, canvasWidth / 2, canvasWidth];
                const yTargets = [0, canvasHeight / 2, canvasHeight];
                for (let i = 0; i < layers.length; i++) {
                    if (exclude.has(i)) continue;
                    const l = layers[i];
                    if (!l.visible || !l.img) continue;
                    const lw = getLayerW(l);
                    const lh = getLayerH(l);
                    if (lw === 0 || lh === 0) continue;
                    xTargets.push(l.x, l.x + lw / 2, l.x + lw);
                    yTargets.push(l.y, l.y + lh / 2, l.y + lh);
                }

                if (e.shiftKey) {
                    const cx = start.centerX;
                    const cy = start.centerY;
                    let scale;

                    if (start.type === 'corner') {
                        const startDist = Math.sqrt((gw / 2) * (gw / 2) + (gh / 2) * (gh / 2));
                        const dx = m.x - cx;
                        const dy = m.y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        scale = startDist > 0 ? dist / startDist : 1;
                    } else {
                        if (start.dir === 't' || start.dir === 'b') {
                            scale = gh > 0 ? Math.abs(m.y - cy) / (gh / 2) : 1;
                        } else {
                            scale = gw > 0 ? Math.abs(m.x - cx) / (gw / 2) : 1;
                        }
                    }
                    const minScale = minSize / Math.min(gw, gh);
                    scale = Math.max(scale, minScale);
                    scale = Math.min(scale, 50);

                    const propW = gw * scale;
                    const propH = gh * scale;
                    let bestScale = scale;
                    let bestDelta = SNAP + 1;
                    let bestLine = null;

                    const tryEdge = (edge, targets, isVertical, computeScale) => {
                        for (const t of targets) {
                            const d = Math.abs(edge - t);
                            if (d < bestDelta) {
                                const s = computeScale(t);
                                if (s > minScale && s < 50) {
                                    bestDelta = d;
                                    bestScale = s;
                                    bestLine = { type: isVertical ? 'vertical' : 'horizontal', pos: t };
                                }
                            }
                        }
                    };

                    tryEdge(cx - propW / 2, xTargets, true, (t) => gw > 0 ? 2 * (cx - t) / gw : 1);
                    tryEdge(cx + propW / 2, xTargets, true, (t) => gw > 0 ? 2 * (t - cx) / gw : 1);
                    tryEdge(cy - propH / 2, yTargets, false, (t) => gh > 0 ? 2 * (cy - t) / gh : 1);
                    tryEdge(cy + propH / 2, yTargets, false, (t) => gh > 0 ? 2 * (t - cy) / gh : 1);

                    if (bestLine && bestDelta < SNAP) {
                        scale = bestScale;
                        snapLines.push(bestLine);
                    }

                    newW = gw * scale;
                    newH = gh * scale;
                    const newGX = cx - newW / 2;
                    const newGY = cy - newH / 2;
                    applyTransformScale(start, newGX, newGY, newW, newH);
                    renderAll(); renderOverlay();
                    showShortcutHint('中心等比缩放中 · <kbd>Shift</kbd> 已按住');
                    return;
                }

                if (start.type === 'corner') {
                    let rawW, rawH;
                    if (start.dir === 'br') { rawW = m.x - ax; rawH = m.y - ay; }
                    else if (start.dir === 'tl') { rawW = ax - m.x; rawH = ay - m.y; }
                    else if (start.dir === 'tr') { rawW = m.x - ax; rawH = ay - m.y; }
                    else { rawW = ax - m.x; rawH = m.y - ay; }

                    if (freeMode) {
                        newW = Math.max(rawW, minSize);
                        newH = Math.max(rawH, minSize);

                        const snapXDir = (start.dir === 'tl' || start.dir === 'bl') ? 'left'
                                       : (start.dir === 'tr' || start.dir === 'br') ? 'right' : null;
                        const snapYDir = (start.dir === 'tl' || start.dir === 'tr') ? 'top'
                                       : (start.dir === 'bl' || start.dir === 'br') ? 'bottom' : null;

                        if (snapXDir === 'left') {
                            const edge = ax - newW;
                            let best = null, bestD = SNAP + 1;
                            for (const t of xTargets) {
                                const d = Math.abs(edge - t);
                                if (d < bestD) { bestD = d; best = t; }
                            }
                            if (best !== null && bestD < SNAP) {
                                newW = ax - best;
                                snapLines.push({ type: 'vertical', pos: best });
                            }
                        } else if (snapXDir === 'right') {
                            const edge = ax + newW;
                            let best = null, bestD = SNAP + 1;
                            for (const t of xTargets) {
                                const d = Math.abs(edge - t);
                                if (d < bestD) { bestD = d; best = t; }
                            }
                            if (best !== null && bestD < SNAP) {
                                newW = best - ax;
                                snapLines.push({ type: 'vertical', pos: best });
                            }
                        }
                        if (snapYDir === 'top') {
                            const edge = ay - newH;
                            let best = null, bestD = SNAP + 1;
                            for (const t of yTargets) {
                                const d = Math.abs(edge - t);
                                if (d < bestD) { bestD = d; best = t; }
                            }
                            if (best !== null && bestD < SNAP) {
                                newH = ay - best;
                                snapLines.push({ type: 'horizontal', pos: best });
                            }
                        } else if (snapYDir === 'bottom') {
                            const edge = ay + newH;
                            let best = null, bestD = SNAP + 1;
                            for (const t of yTargets) {
                                const d = Math.abs(edge - t);
                                if (d < bestD) { bestD = d; best = t; }
                            }
                            if (best !== null && bestD < SNAP) {
                                newH = best - ay;
                                snapLines.push({ type: 'horizontal', pos: best });
                            }
                        }
                        newW = Math.max(newW, minSize);
                        newH = Math.max(newH, minSize);
                        showShortcutHint('自由拉伸中 · 松开 <kbd>Ctrl</kbd> 恢复等比缩放');
                    } else {
                        const dx = gw;
                        const dy = gh;
                        let s = (dx * dx + dy * dy) > 0 ? (rawW * dx + rawH * dy) / (dx * dx + dy * dy) : 1;
                        s = Math.max(s, minSize / Math.min(gw, gh));

                        const candidates = [];
                        let movingX = null;
                        if (start.dir === 'tl' || start.dir === 'bl') movingX = 'left';
                        else if (start.dir === 'tr' || start.dir === 'br') movingX = 'right';

                        if (movingX === 'left') {
                            for (const t of xTargets) {
                                const newWidth = ax - t;
                                if (newWidth < minSize) continue;
                                const sX = newWidth / gw;
                                const edgePos = ax - gw * s;
                                if (Math.abs(edgePos - t) < SNAP) {
                                    candidates.push({ s: sX, line: { type: 'vertical', pos: t } });
                                }
                            }
                        } else if (movingX === 'right') {
                            for (const t of xTargets) {
                                const newWidth = t - ax;
                                if (newWidth < minSize) continue;
                                const sX = newWidth / gw;
                                const edgePos = ax + gw * s;
                                if (Math.abs(edgePos - t) < SNAP) {
                                    candidates.push({ s: sX, line: { type: 'vertical', pos: t } });
                                }
                            }
                        }

                        let movingY = null;
                        if (start.dir === 'tl' || start.dir === 'tr') movingY = 'top';
                        else if (start.dir === 'bl' || start.dir === 'br') movingY = 'bottom';

                        if (movingY === 'top') {
                            for (const t of yTargets) {
                                const newHeight = ay - t;
                                if (newHeight < minSize) continue;
                                const sY = newHeight / gh;
                                const edgePos = ay - gh * s;
                                if (Math.abs(edgePos - t) < SNAP) {
                                    candidates.push({ s: sY, line: { type: 'horizontal', pos: t } });
                                }
                            }
                        } else if (movingY === 'bottom') {
                            for (const t of yTargets) {
                                const newHeight = t - ay;
                                if (newHeight < minSize) continue;
                                const sY = newHeight / gh;
                                const edgePos = ay + gh * s;
                                if (Math.abs(edgePos - t) < SNAP) {
                                    candidates.push({ s: sY, line: { type: 'horizontal', pos: t } });
                                }
                            }
                        }

                        if (candidates.length > 0) {
                            let best = candidates[0], bestDiff = Math.abs(candidates[0].s - s);
                            for (const c of candidates) {
                                const d = Math.abs(c.s - s);
                                if (d < bestDiff) { bestDiff = d; best = c; }
                            }
                            s = best.s;
                            snapLines.push(best.line);
                        }

                        newW = gw * s;
                        newH = gh * s;
                        showShortcutHint('等比缩放中 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    }
                } else if (freeMode) {
                    if (start.dir === 't') { newW = gw; newH = Math.max(ay - m.y, minSize); }
                    else if (start.dir === 'b') { newW = gw; newH = Math.max(m.y - ay, minSize); }
                    else if (start.dir === 'l') { newW = Math.max(ax - m.x, minSize); newH = gh; }
                    else { newW = Math.max(m.x - ax, minSize); newH = gh; }

                    const snapXDir = start.dir === 'l' ? 'left' : (start.dir === 'r' ? 'right' : null);
                    if (snapXDir === 'left') {
                        const edge = ax - newW;
                        let best = null, bestD = SNAP + 1;
                        for (const t of xTargets) {
                            const d = Math.abs(edge - t);
                            if (d < bestD) { bestD = d; best = t; }
                        }
                        if (best !== null && bestD < SNAP) {
                            newW = ax - best;
                            snapLines.push({ type: 'vertical', pos: best });
                        }
                    } else if (snapXDir === 'right') {
                        const edge = ax + newW;
                        let best = null, bestD = SNAP + 1;
                        for (const t of xTargets) {
                            const d = Math.abs(edge - t);
                            if (d < bestD) { bestD = d; best = t; }
                        }
                        if (best !== null && bestD < SNAP) {
                            newW = best - ax;
                            snapLines.push({ type: 'vertical', pos: best });
                        }
                    }

                    const snapYDir = start.dir === 't' ? 'top' : (start.dir === 'b' ? 'bottom' : null);
                    if (snapYDir === 'top') {
                        const edge = ay - newH;
                        let best = null, bestD = SNAP + 1;
                        for (const t of yTargets) {
                            const d = Math.abs(edge - t);
                            if (d < bestD) { bestD = d; best = t; }
                        }
                        if (best !== null && bestD < SNAP) {
                            newH = ay - best;
                            snapLines.push({ type: 'horizontal', pos: best });
                        }
                    } else if (snapYDir === 'bottom') {
                        const edge = ay + newH;
                        let best = null, bestD = SNAP + 1;
                        for (const t of yTargets) {
                            const d = Math.abs(edge - t);
                            if (d < bestD) { bestD = d; best = t; }
                        }
                        if (best !== null && bestD < SNAP) {
                            newH = best - ay;
                            snapLines.push({ type: 'horizontal', pos: best });
                        }
                    }
                    newW = Math.max(newW, minSize);
                    newH = Math.max(newH, minSize);
                    showShortcutHint('单边自由拉伸 · 松开 <kbd>Ctrl</kbd> 恢复等比缩放');
                } else {
                    const cx = start.centerX;
                    const cy = start.centerY;
                    let s;
                    if (start.dir === 't') s = gh > 0 ? (ay - m.y) / gh : 1;
                    else if (start.dir === 'b') s = gh > 0 ? (m.y - ay) / gh : 1;
                    else if (start.dir === 'l') s = gw > 0 ? (ax - m.x) / gw : 1;
                    else s = gw > 0 ? (m.x - ax) / gw : 1;

                    const minScale = minSize / Math.min(gw, gh);
                    s = Math.max(s, minScale);
                    s = Math.min(s, 50);

                    let bestDelta = SNAP + 1;
                    let bestS = s;
                    let bestLine = null;
                    if (start.dir === 't' || start.dir === 'b') {
                        for (const t of yTargets) {
                            const ns = (start.dir === 't') ? (ay - t) / gh : (t - ay) / gh;
                            if (ns <= minScale || ns >= 50) continue;
                            const edge = (start.dir === 't') ? ay - gh * s : ay + gh * s;
                            const d = Math.abs(edge - t);
                            if (d < bestDelta) {
                                bestDelta = d; bestS = ns;
                                bestLine = { type: 'horizontal', pos: t };
                            }
                        }
                    } else {
                        for (const t of xTargets) {
                            const ns = (start.dir === 'l') ? (ax - t) / gw : (t - ax) / gw;
                            if (ns <= minScale || ns >= 50) continue;
                            const edge = (start.dir === 'l') ? ax - gw * s : ax + gw * s;
                            const d = Math.abs(edge - t);
                            if (d < bestDelta) {
                                bestDelta = d; bestS = ns;
                                bestLine = { type: 'vertical', pos: t };
                            }
                        }
                    }
                    if (bestLine && bestDelta < SNAP) {
                        s = bestS;
                        snapLines.push(bestLine);
                    }

                    newW = gw * s;
                    newH = gh * s;

                    let ngx, ngy;
                    switch (start.dir) {
                        case 't': ngx = cx - newW / 2; ngy = ay - newH; break;
                        case 'b': ngx = cx - newW / 2; ngy = ay; break;
                        case 'l': ngx = ax - newW; ngy = cy - newH / 2; break;
                        default:  ngx = ax; ngy = cy - newH / 2; break;
                    }

                    applyTransformScale(start, ngx, ngy, newW, newH);
                    renderAll(); renderOverlay();
                    showShortcutHint('等比缩放中 · <kbd>Shift</kbd> 中心缩放 · <kbd>Ctrl</kbd> 自由拉伸');
                    return;
                }

                let newGX, newGY;
                switch (start.dir) {
                    case 'tl': newGX = ax - newW; newGY = ay - newH; break;
                    case 'tr': newGX = ax; newGY = ay - newH; break;
                    case 'br': newGX = ax; newGY = ay; break;
                    case 'bl': newGX = ax - newW; newGY = ay; break;
                    case 't':  newGX = ax - newW / 2; newGY = ay - newH; break;
                    case 'b':  newGX = ax - newW / 2; newGY = ay; break;
                    case 'l':  newGX = ax - newW; newGY = ay - newH / 2; break;
                    case 'r':  newGX = ax; newGY = ay - newH / 2; break;
                    default: return;
                }

                applyTransformScale(start, newGX, newGY, newW, newH);
                renderAll(); renderOverlay();
                return;
            }
        }

        if (isDragging) {
            const m = getCanvasMouse(e);
            const active = getActiveLayer();
            if (!active) {
                isDragging = false;
                canvasStage.style.cursor = '';
                return;
            }
            const dx = m.x - dragStartX;
            const dy = m.y - dragStartY;
            const newX = dragLayerStartX + dx;
            const newY = dragLayerStartY + dy;
            const w = getLayerW(active);
            const h = getLayerH(active);

            const exclude = new Set(selectedIndices);
            const snapped = applySnapping(newX, newY, w, h, exclude);
            const finalDx = snapped.x - dragLayerStartX;
            const finalDy = snapped.y - dragLayerStartY;

            for (const mem of dragMembers) {
                const l = layers[mem.layerIndex];
                if (!l) continue;
                l.x = mem.origX + finalDx;
                l.y = mem.origY + finalDy;
            }
            renderAll(); renderOverlay();
            showShortcutHint('移动中 · 松开鼠标放置');
        }
    });

    window.addEventListener('mouseup', function() {
        if (transformMode && transformDragMode) {
            transformDragMode = null;
            transformDragIndex = -1;
            transformStartState = null;
            snapLines = [];
            renderAll(); renderOverlay();
            saveState();
            showShortcutHint('变换完成');
            showToast('变换完成');
            return;
        }
        if (isDragging) {
            isDragging = false;
            canvasStage.style.cursor = '';
            snapLines = [];
            dragMembers = [];
            renderAll(); renderOverlay();
            saveState();
            showShortcutHint('移动完成');
        }
    });

    // ========== 中键平移 ==========
    let isPanning = false;
    let panStartClientX = 0, panStartClientY = 0;
    let panLastClientX = 0, panLastClientY = 0;
    let panStartScrollLeft = 0, panStartScrollTop = 0;
    let panRafId = null;

    function stopPanning() {
        if (!isPanning) return;
        isPanning = false;
        canvasWrapper.classList.remove('panning');
        if (panRafId !== null) { cancelAnimationFrame(panRafId); panRafId = null; }
        showShortcutHint('平移结束');
    }

    canvasWrapper.addEventListener('mousedown', function(e) {
        if (e.button === 0 && e.target !== canvas && !transformMode) {
            if (!e.shiftKey && selectedIndices.size > 0) {
                selectedIndices.clear();
                activeLayerIndex = -1;
                renderAll(); renderOverlay(); renderLayerPanel();
                hideShortcutHint();
            }
        }

        if (e.button !== 1) return;
        e.preventDefault();
        isPanning = true;
        panStartClientX = panLastClientX = e.clientX;
        panStartClientY = panLastClientY = e.clientY;
        panStartScrollLeft = canvasWrapper.scrollLeft;
        panStartScrollTop = canvasWrapper.scrollTop;
        canvasWrapper.classList.add('panning');
        showShortcutHint('平移视图中...');
    });

    canvasWrapper.addEventListener('auxclick', function(e) {
        if (e.button === 1) e.preventDefault();
    });

    window.addEventListener('mousemove', function(e) {
        if (!isPanning) return;
        e.preventDefault();
        panLastClientX = e.clientX;
        panLastClientY = e.clientY;
        if (panRafId !== null) return;
        panRafId = requestAnimationFrame(function() {
            panRafId = null;
            if (!isPanning) return;
            canvasWrapper.scrollLeft = panStartScrollLeft - (panLastClientX - panStartClientX);
            canvasWrapper.scrollTop  = panStartScrollTop  - (panLastClientY - panStartClientY);
        });
    }, { passive: false });

    window.addEventListener('mouseup', function() {
        stopPanning();
    });

    window.addEventListener('blur', function() {
        stopPanning();
    });

    canvasWrapper.addEventListener('wheel', function(e) {
        if (isPanning) return;
        if (e.target === canvas && !e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        setViewScale(viewScale * factor, e.clientX, e.clientY);
    }, { passive: false });

    /* ★ 修改：滚轮缩放图层时始终以图层中心为缩放中心 */
    canvas.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) return;
        if (transformMode) { e.preventDefault(); return; }
        e.preventDefault();

        const active = getActiveLayer();

        if (!active || selectedIndices.size > 1) {
            const factor = e.deltaY > 0 ? 0.9 : 1.1;
            setViewScale(viewScale * factor, e.clientX, e.clientY);
            return;
        }

        if (active.locked) { showToast('图层已锁定，无法缩放'); return; }
        if (!active.img || !active.img.width) return;

        const delta = e.deltaY > 0 ? -0.05 : 0.05;
        let newScale = active.scaleX + delta;
        newScale = Math.min(Math.max(newScale, 0.05), 20);
        if (newScale === active.scaleX && newScale === active.scaleY) return;

        const oldW = getLayerW(active);
        const oldH = getLayerH(active);
        if (oldW <= 0 || oldH <= 0) return;

        const newW = active.img.width * newScale;
        const newH = active.img.height * newScale;

        // ★ 始终以图层中心点缩放，不再跟随鼠标位置
        const cx = active.x + oldW / 2;
        const cy = active.y + oldH / 2;
        active.x = cx - newW / 2;
        active.y = cy - newH / 2;

        active.scaleX = newScale;
        active.scaleY = newScale;
        renderAll(); renderOverlay();
        showShortcutHint('缩放图层中 · 以中心等比缩放');
        if (wheelSaveTimer) clearTimeout(wheelSaveTimer);
        wheelSaveTimer = setTimeout(() => saveState(), 300);
    }, { passive: false });

    // ========== 右键菜单 ==========
    function showContextMenu(x, y, layerIndex) {
        contextMenuLayerIndex = layerIndex;
        contextMenuMouseX = x;
        contextMenuMouseY = y;
        menuDragging = false;
        menuDragMoved = false;
        contextMenu.classList.remove('dragging');

        const layer = layers[layerIndex];
        if (!layer) { hideContextMenu(); return; }
        const items = contextMenu.querySelectorAll('.menu-item');
        items.forEach(item => {
            const action = item.dataset.action;
            if (layer.locked && action !== 'lock' && action !== 'reset-hue') {
                item.classList.add('disabled');
            } else {
                item.classList.remove('disabled');
            }
            if (action === 'lock') {
                item.textContent = layer.locked ? '解锁图层' : '锁定图层';
            }
        });

        const menuW = 200, menuH = 430;
        let px = x, py = y;
        if (px + menuW > window.innerWidth) px = window.innerWidth - menuW - 10;
        if (py + menuH > window.innerHeight) py = window.innerHeight - menuH - 10;
        if (px < 8) px = 8;
        if (py < 8) py = 8;
        contextMenu.style.left = px + 'px';
        contextMenu.style.top = py + 'px';
        contextMenu.classList.add('active');
    }

    function hideContextMenu() {
        contextMenu.classList.remove('active');
        contextMenu.classList.remove('dragging');
        menuDragging = false;
        menuDragMoved = false;
    }

    contextMenu.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        menuDragging = true;
        menuDragMoved = false;
        menuDragStartX = e.clientX;
        menuDragStartY = e.clientY;
        const rect = contextMenu.getBoundingClientRect();
        menuStartLeft = rect.left;
        menuStartTop = rect.top;
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!menuDragging) return;
        const dx = e.clientX - menuDragStartX;
        const dy = e.clientY - menuDragStartY;
        if (!menuDragMoved) {
            if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
            menuDragMoved = true;
            contextMenu.classList.add('dragging');
        }
        const rect = contextMenu.getBoundingClientRect();
        const maxLeft = Math.max(4, window.innerWidth - rect.width - 4);
        const maxTop = Math.max(4, window.innerHeight - rect.height - 4);
        contextMenu.style.left = Math.min(Math.max(menuStartLeft + dx, 4), maxLeft) + 'px';
        contextMenu.style.top = Math.min(Math.max(menuStartTop + dy, 4), maxTop) + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (!menuDragging) return;
        menuDragging = false;
        if (menuDragMoved) menuDragEndTime = Date.now();
        contextMenu.classList.remove('dragging');
    });

    contextMenu.addEventListener('click', (e) => {
        if (Date.now() - menuDragEndTime < 150) return;
        const item = e.target.closest('.menu-item');
        if (!item || item.classList.contains('disabled')) return;
        const action = item.dataset.action;
        const idx = contextMenuLayerIndex;
        if (idx < 0 || idx >= layers.length) { hideContextMenu(); return; }
        const layer = layers[idx];

        if (action === 'hue-sat') {
            hideContextMenu();
            openHuePanel(idx);
            return;
        } else if (action === 'auto-wb') {
            hideContextMenu();
            applyAutoWhiteBalance(idx);
            return;
        } else if (action === 'reset-hue') {
            layer.hue = 0; layer.saturation = 100; layer.brightness = 100;
            renderAll(); renderOverlay(); renderLayerPanel(); saveState();
            showToast('已重置色相 / 饱和度');
            showShortcutHint('色相饱和度已重置');
        } else if (action === 'flip-h') {
            flipLayer(idx, true);
        } else if (action === 'flip-v') {
            flipLayer(idx, false);
        } else if (action === 'rotate-cw') {
            rotateLayer90(idx, true);
        } else if (action === 'rotate-ccw') {
            rotateLayer90(idx, false);
        } else if (action === 'lock') {
            toggleLayerLock(idx);
            showShortcutHint(layer.locked ? '图层已锁定' : '图层已解锁');
        } else if (action === 'delete') {
            if (layer.locked) showToast('图层已锁定，无法删除');
            else removeLayer(idx);
        }
        hideContextMenu();
    });

    document.addEventListener('click', (e) => {
        if (Date.now() - menuDragEndTime < 150) return;
        if (!contextMenu.contains(e.target)) hideContextMenu();
    });

    // ========== 色相面板（含颜色示意） ==========
    function buildHueGradientCSS() {
        const stops = [];
        const N = 12;
        for (let i = 0; i <= N; i++) {
            const t = i / N;
            const deg = Math.round(180 + t * 360) % 360;
            stops.push(`hsl(${deg}, 85%, 55%) ${(t * 100).toFixed(2)}%`);
        }
        return `linear-gradient(to right, ${stops.join(', ')})`;

        hueMarker.style.left = Math.min(Math.max(huePct, 0), 100) + '%';
        hueMarker.style.background = `hsl(${hDeg}, 85%, 55%)`;

            `linear-gradient(to right, hsl(${hDeg}, 0%, 62%), hsl(${hDeg}, 60%, 52%) 55%, hsl(${hDeg}, 100%, 50%))`;
        const satPct = Math.min(Math.max(satNum / 300, 0), 1) * 100;
        satMarker.style.left = satPct + '%';
        satMarker.style.background = `hsl(${hDeg}, ${Math.min(Math.max(satNum, 0), 100)}%, 50%)`;

        const briPct = Math.min(Math.max(briNum / 200, 0), 1) * 100;
        briMarker.style.left = briPct + '%';
        briMarker.style.background = `hsl(${hDeg}, 0%, ${Math.min(Math.max(briNum, 0), 100)}%)`;

    // ========== 导出 ==========
    function generateOutputCanvas(outW, outH) {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = outW; outCanvas.height = outH;
        const outCtx = outCanvas.getContext('2d');
        outCtx.fillStyle = canvasBgColor;
        outCtx.fillRect(0, 0, outW, outH);

        const scaleX = outW / canvasWidth;
        const scaleY = outH / canvasHeight;
        const scale = Math.min(scaleX, scaleY);
        const offsetX = (outW - canvasWidth * scale) / 2;
        const offsetY = (outH - canvasHeight * scale) / 2;

        outCtx.save();
        outCtx.translate(offsetX, offsetY);
        outCtx.scale(scale, scale);
        outCtx.fillStyle = canvasBgColor;
        outCtx.fillRect(0, 0, canvasWidth, canvasHeight);
        for (const layer of layers) {
            if (!layer.visible || !layer.img) continue;
            const w = getLayerW(layer);
            const h = getLayerH(layer);
            if (w === 0 || h === 0) continue;
            outCtx.globalAlpha = layer.opacity;
            outCtx.filter = getLayerFilter(layer);
            if (layer.flipX || layer.flipY) {
                outCtx.save();
                try {
                    outCtx.translate(layer.x + w / 2, layer.y + h / 2);
                    outCtx.scale(layer.flipX ? -1 : 1, layer.flipY ? -1 : 1);
                    outCtx.drawImage(layer.img, -w / 2, -h / 2, w, h);
                } catch (err) { /* ignore */ }
                outCtx.restore();
            } else {
                try {
                    outCtx.drawImage(layer.img, layer.x, layer.y, w, h);
                } catch (err) { /* ignore */ }
            }
            outCtx.filter = 'none';
        }
        outCtx.globalAlpha = 1;
        outCtx.restore();
        return outCanvas;
    }

    let sizeUpdateTimer = null;
    function updateEstimatedSize() {
        if (sizeUpdateTimer) clearTimeout(sizeUpdateTimer);
        sizeUpdateTimer = setTimeout(() => {
            const w = parseInt(outputWidth.value);
            const h = parseInt(outputHeight.value);
            const format = outputFormat.value;
            const quality = parseInt(jpegQuality.value);
            if (isNaN(w) || isNaN(h) || w < 1 || h < 1) {
                fileSizeDisplay.textContent = '预计大小 --';
                qualityDesc.textContent = '请设置有效尺寸';
                previewCtx.clearRect(0, 0, 200, 200);
                return;
            }
            const outCanvas = generateOutputCanvas(w, h);
            const mimeType = (format === 'jpeg') ? 'image/jpeg' : 'image/png';
            const qualityParam = (format === 'jpeg') ? quality / 100 : undefined;
            outCanvas.toBlob((blob) => {
                if (blob) {
                    const sizeKB = blob.size / 1024;
                    const sizeStr = sizeKB < 1024 ? sizeKB.toFixed(1) + ' KB' : (sizeKB / 1024).toFixed(2) + ' MB';
                    fileSizeDisplay.textContent = `预计大小 ${sizeStr}`;
                }
            }, mimeType, qualityParam);

            const previewImg = new Image();
            previewImg.onload = function() {
                previewCtx.clearRect(0, 0, 200, 200);
                previewCtx.drawImage(previewImg, 0, 0, 200, 200);
                if (format === 'jpeg') {
                    let desc = '';
                    if (quality >= 80) desc = '高清晰度（接近无损）';
                    else if (quality >= 50) desc = '中等清晰度（文件较小）';
                    else desc = '低清晰度（文件小，损失明显）';
                    qualityDesc.textContent = `质量：${desc}`;
                } else {
                    qualityDesc.textContent = '质量：无损（PNG）';
                }
            };
            previewImg.src = outCanvas.toDataURL(mimeType, qualityParam);
        }, 200);
    }

        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        /* ★ 撤销 / 重做 */
        if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
            e.preventDefault(); redo(); return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
            e.preventDefault(); pasteFromClipboard(); return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'a') {

                if (layers[i].visible && layers[i].img) selectedIndices.add(i);

        if (e.key === 'Delete' || e.key === 'Backspace') {

    // ========== 拖拽导入 ==========
    const IMG_EXT_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;
    let dragDepth = 0;

    function isFileDrag(e) {
        const dt = e.dataTransfer;
        if (!dt || !dt.types) return false;
        try {
            const types = dt.types;
            const len = types.length || 0;
            for (let i = 0; i < len; i++) {
                const t = (types[i] !== undefined) ? types[i]
                        : (types.item ? types.item(i) : null);
                if (t === 'Files') return true;
            }
        } catch (err) { return false; }
        return false;
    }

    function isImageFile(f) {
        if (!f) return false;
        const t = f.type || '';
        if (t.indexOf('image/') === 0) return true;
        if (IMG_EXT_RE.test(f.name || '')) return true;
        return false;
    }

    function showDropOverlay() { dropOverlay.classList.add('active'); }
    function hideDropOverlay() {
        dragDepth = 0;
        dropOverlay.classList.remove('active');
    }

    function readAllEntries(reader) {
        return new Promise((resolve, reject) => {
            const all = [];
            const next = () => {
                reader.readEntries((entries) => {
                    if (!entries.length) { resolve(all); return; }
                    all.push(...entries);
                    next();
                }, reject);
            };
            next();
        });
    }

    async function collectEntryFiles(entry, out) {
        if (!entry) return;
        if (entry.isFile) {
            try {
                const f = await new Promise((res, rej) => entry.file(res, rej));
                out.push(f);
            } catch (err) {}
        } else if (entry.isDirectory) {
            try {
                const children = await readAllEntries(entry.createReader());
                for (const child of children) await collectEntryFiles(child, out);
            } catch (err) {}
        }
    }

    async function importImageFiles(files) {
        const total = files.length;
        let added = 0;
        for (let i = 0; i < total; i++) {
            try {
                const img = await readImageFromFile(files[i]);
                addImageAsLayer(img, nameFromFile(files[i]), {
                    silent: true,
                    skipHistory: true,
                    fill: true
                });
                added++;
            } catch (err) {
                console.warn('跳过无法解析的图片：', files[i] && files[i].name, err);
            }
        }
        if (added > 0) {
            renderAll(); renderOverlay(); renderLayerPanel();
            saveState();
            showToast(`已导入 ${added} 张图片，每张铺满画布，可在图层面板切换`);
            showShortcutHint(`已导入 ${added} 张图片`);
        } else {
            showToast('未找到可用的图片文件');
        }
    }

    async function handleDrop(rawFiles, entries) {
        let entryFiles = [];
        if (entries && entries.length) {
            for (const en of entries) await collectEntryFiles(en, entryFiles);
        }
        const merged = [];
        const seen = new Set();
        const pushUnique = (f) => {
            if (!f) return;
            const key = (f.name || '') + '|' + (f.size || 0) + '|' + (f.lastModified || 0);
            if (seen.has(key)) return;
            seen.add(key);
            merged.push(f);
        };
        entryFiles.forEach(pushUnique);
        (rawFiles || []).forEach(pushUnique);

        const imgs = merged.filter(isImageFile);
        if (!imgs.length) { showToast('未检测到图片文件'); return; }
        imgs.sort((a, b) => (a.name || '').localeCompare(
            b.name || '', undefined, { numeric: true, sensitivity: 'base' }
        ));
        await importImageFiles(imgs);
    }

    window.addEventListener('dragenter', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        dragDepth++;
        showDropOverlay();
    });

    window.addEventListener('dragover', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (!dropOverlay.classList.contains('active')) {
            dragDepth = Math.max(dragDepth, 1);
            showDropOverlay();
        }
    });

    window.addEventListener('dragleave', (e) => {
        if (dragDepth <= 0) return;
        dragDepth--;
        if (dragDepth <= 0 || e.relatedTarget === null) hideDropOverlay();
    });

    window.addEventListener('drop', (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        hideDropOverlay();
        const dt = e.dataTransfer;
        if (!dt) return;

        let rawFiles = [];
        try {
            if (dt.files && dt.files.length) rawFiles = Array.from(dt.files);
        } catch (err) { rawFiles = []; }

        const entries = [];
        try {
            if (dt.items && dt.items.length) {
                for (let i = 0; i < dt.items.length; i++) {
                    const it = dt.items[i];
                    if (!it || it.kind !== 'file') continue;
                    const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                    if (entry) entries.push(entry);
                }
            }
        } catch (err) {}

        handleDrop(rawFiles, entries);
    });

    function init() {

        canvasHeight = parseInt(heightInput.value) || 800;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        lastValidWidth = canvasWidth;
        lastValidHeight = canvasHeight;

        canvasBgColor = bgColorInput.value || '#ffffff';
        canvas.style.background = canvasBgColor;

        updateCanvasDisplaySize();
        updateViewZoomBadge();
        initTheme();
        renderAll();
        renderOverlay();
        renderLayerPanel();
        saveState();
        requestAnimationFrame(() => {
            updateCanvasPadding();
            centerCanvasInView();
        });
        showToast('Shift 点击图层多选 · 中键拖动平移 · 双击变换');
        showShortcutHint('提示：图层可拖拽排序，右键可自动白平衡');
    }
    init();
})();
</script>
</body>
</html>
